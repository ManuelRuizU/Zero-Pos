<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZERO POS — Pantalla Cliente</title>
<style>
:root{
  --bg:#0a0a0f;--surface:rgba(255,255,255,0.05);--surface2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.1);--accent:#6366f1;--accent2:#818cf8;
  --text:#f1f5f9;--text-dim:#94a3b8;--success:#22c55e;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(99,102,241,0.12) 0%,transparent 70%);
}

/* ── Idle ───────────────────────────────── */
#pantallaIdle{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
}
.idle-logo{font-size:72px;}
.idle-nombre{font-size:38px;font-weight:800;letter-spacing:-1px;}
.idle-nombre span{color:var(--accent2);}
.idle-tagline{font-size:16px;color:var(--text-dim);}
.idle-bienvenida{
  margin-top:32px;font-size:22px;font-weight:600;color:var(--text-dim);
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ── Venta activa ───────────────────────── */
#pantallaVenta{
  flex:1;display:none;flex-direction:column;
  max-width:640px;width:100%;margin:0 auto;padding:24px 16px;gap:16px;
}
.venta-header{
  text-align:center;font-size:13px;color:var(--text-dim);
  letter-spacing:.5px;text-transform:uppercase;padding-bottom:8px;
}
.items-lista{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
}
.item-row{
  display:flex;align-items:center;padding:14px 18px;
  border-bottom:1px solid var(--border);gap:12px;
}
.item-row:last-child{border-bottom:none;}
.item-cant{
  background:var(--accent);color:#fff;border-radius:8px;
  font-size:13px;font-weight:700;padding:4px 8px;min-width:30px;text-align:center;
}
.item-nombre{flex:1;font-size:15px;font-weight:500;}
.item-sub{font-size:15px;font-weight:700;color:var(--accent2);}
.total-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px 28px;
  display:flex;align-items:center;justify-content:space-between;
}
.total-label{font-size:14px;color:var(--text-dim);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.total-monto{font-size:52px;font-weight:900;letter-spacing:-2px;color:var(--accent2);}
</style>
</head>
<body>

<div id="pantallaIdle">
  <div class="idle-logo">🛍️</div>
  <div class="idle-nombre">ZERO<span>POS</span></div>
  <div class="idle-tagline">Sin internet. Sin comisiones. Solo tú y tus ventas.</div>
  <div class="idle-bienvenida">¡Bienvenido! 👋</div>
</div>

<div id="pantallaVenta">
  <div class="venta-header">Tu pedido</div>
  <div class="items-lista" id="itemsLista"></div>
  <div class="total-card">
    <div class="total-label">Total</div>
    <div class="total-monto" id="totalMonto">$0</div>
  </div>
</div>

<script>
const fmt = n => '$' + Math.round(n).toLocaleString('es-CL');

async function poll() {
  try {
    const estado = await fetch('/api/ventas/pantalla-cliente').then(r => r.json());
    if (estado.activa && estado.items && estado.items.length) {
      mostrarVenta(estado);
    } else {
      mostrarIdle();
    }
  } catch(e) {}
}

function mostrarVenta(estado) {
  document.getElementById('pantallaIdle').style.display = 'none';
  const pv = document.getElementById('pantallaVenta');
  pv.style.display = 'flex';

  const lista = document.getElementById('itemsLista');
  lista.innerHTML = estado.items.map(i => `
    <div class="item-row">
      <span class="item-cant">${i.cantidad}</span>
      <span class="item-nombre">${i.nombre}</span>
      <span class="item-sub">${fmt(i.subtotal)}</span>
    </div>`).join('');

  document.getElementById('totalMonto').textContent = fmt(estado.total);
}

function mostrarIdle() {
  document.getElementById('pantallaVenta').style.display = 'none';
  document.getElementById('pantallaIdle').style.display = 'flex';
}

poll();
setInterval(poll, 5000);
</script>
</body>
</html>
