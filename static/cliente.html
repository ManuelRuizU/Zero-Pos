<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<script src="/static/js/vendor/qrcode.min.js"></script>
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZERO POS — Pantalla Cliente</title>
<link rel="stylesheet" href="/static/css/cliente.css">
</head>
<body>

<!-- ═══ ESTADO 1: IDLE ════════════════════════════════════ -->
<div id="estadoIdle" class="estado activo">

  <!-- Carrusel fullscreen -->
  <div id="carruselPublicidad">
    <!-- Logo del negocio superpuesto -->
    <div class="idle-logo-overlay">
      <img id="logoNegocioIdle" alt="Logo">
      <div id="nombreNegocioIdle"></div>
    </div>
    <!-- Indicadores -->
    <div id="indicadoresCarrusel"></div>
  </div>

  <!-- Placeholder sin publicidad -->
  <div id="placeholderIdle">
    <div class="idle-logo-grande">ZERO<span>POS</span></div>
    <div class="idle-tagline">Bienvenido 👋</div>
  </div>

</div>

<!-- ═══ ESTADO 2: VENTA ═══════════════════════════════════ -->
<div id="estadoVenta" class="estado">
  <div class="layout-cliente">

    <!-- Zona productos (izq. en landscape, arriba en portrait) -->
    <div class="zona-producto">
      <div id="nombreNegocioVenta"></div>

      <!-- Último producto — Liquid Glass -->
      <div id="cardUltimoProducto" class="glass-card">
        <div class="up-label">Último producto</div>
        <div class="up-body">
          <div id="imagenUltimoProducto">🛍️</div>
          <div class="up-info">
            <div id="nombreUltimoProducto">—</div>
            <div id="cantidadUltimoProducto"></div>
          </div>
          <div id="precioUltimoProducto"></div>
        </div>
      </div>

      <!-- Lista de items -->
      <div id="listaItems"></div>

      <!-- Total — Liquid Glass -->
      <div id="cardTotal" class="glass-card">
        <div class="total-label">TOTAL</div>
        <div id="totalVenta">$0</div>
      </div>
    </div>

    <!-- Zona publicidad (der. en landscape, abajo en portrait) -->
    <div class="zona-publicidad">
      <div id="carruselPublicidadVenta"></div>
    </div>

  </div>
</div>

<!-- ═══ ESTADO 3: GRACIAS ══════════════════════════════════ -->
<div id="estadoGracias" class="estado">
  <span class="gracias-emoji">✅</span>
  <div class="gracias-titulo">¡Gracias!</div>
  <div id="montoGracias"></div>
  <div id="vueltoGracias"></div>
</div>

<!-- ═══ ESTADO 4: COBRAR TARJETA (SumUp QR) ══════════════════ -->
<div id="estadoCobrarTarjeta" class="estado">
  <div style="font-size:18px;font-weight:700;color:white;text-align:center">💳 Paga con tu teléfono</div>
  <div id="clienteTotalTarjeta">$0</div>
  <div id="clienteQRCanvas"><!-- QR se genera aquí --></div>
  <div style="font-size:15px;color:rgba(255,255,255,0.55);text-align:center;max-width:280px">
    Escanea el código QR con la cámara de tu teléfono para pagar
  </div>
  <div style="font-size:13px;color:#f59e0b;display:flex;align-items:center;gap:6px">
    ⏳ Esperando confirmación de pago...
  </div>
</div>


<script src="/static/js/cliente.js"></script>
</body>
</html>
