<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZERO POS — Pantalla Cliente</title>
<style>
/* ── Reset + base ─────────────────────────────────────────── */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --negocio-color: #6366f1;
  --negocio-color2: #8b5cf6;
}

body {
  background: #0a0a14;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  height: 100vh;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ── Estados ──────────────────────────────────────────────── */
.estado {
  position: absolute;
  inset: 0;
  display: none;
}
.estado.activo { display: flex; }

/* ── Estado Idle ──────────────────────────────────────────── */
#estadoIdle {
  flex-direction: column;
  align-items: stretch;
  justify-content: stretch;
}
#carruselPublicidad {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0a14;
}
/* Logo overlay idle */
.idle-logo-overlay {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 24px;
  background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
}
#logoNegocioIdle {
  height: 48px;
  display: none;
  border-radius: 8px;
}
#nombreNegocioIdle {
  font-size: clamp(20px, 3vw, 32px);
  font-weight: 900;
  letter-spacing: -1px;
}
/* Indicadores carrusel */
#indicadoresCarrusel {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 10;
}
.ind-dot {
  height: 8px;
  border-radius: 4px;
  background: rgba(255,255,255,0.3);
  transition: all 0.3s ease;
}
.ind-dot.activo {
  width: 24px !important;
  background: white !important;
}
/* Placeholder cuando no hay slides */
#placeholderIdle {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  background: linear-gradient(135deg, #0a0a14 0%, #141428 100%);
}
.idle-logo-grande {
  font-size: clamp(56px, 10vw, 96px);
  font-weight: 900;
  letter-spacing: -3px;
}
.idle-logo-grande span { color: var(--negocio-color); }
.idle-tagline {
  font-size: clamp(14px, 2vw, 20px);
  color: rgba(255,255,255,0.4);
  animation: pulseOpacity 3s ease-in-out infinite;
}
@keyframes pulseOpacity { 0%,100%{opacity:.4} 50%{opacity:.8} }

/* ── Estado Venta ─────────────────────────────────────────── */
#estadoVenta {
  flex-direction: column;
}

/* Layout responsive — landscape vs portrait */
.layout-cliente {
  width: 100%;
  height: 100%;
}
@media (orientation: landscape) {
  .layout-cliente {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
  }
  .zona-producto { grid-column: 1; overflow-y: auto; }
  .zona-publicidad { grid-column: 2; }
}
@media (orientation: portrait) {
  .layout-cliente {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .zona-producto {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .zona-publicidad {
    flex: 0 0 32vh;
  }
}

.zona-producto {
  display: flex;
  flex-direction: column;
  padding: clamp(12px, 2.5vw, 32px);
  gap: clamp(8px, 1.5vw, 16px);
  background: #0a0a14;
}
.zona-publicidad {
  position: relative;
  overflow: hidden;
  background: #0d0d1a;
}
#carruselPublicidadVenta {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* Nombre negocio arriba en venta */
#nombreNegocioVenta {
  font-size: clamp(12px, 1.4vw, 15px);
  color: rgba(255,255,255,0.4);
  font-weight: 600;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}

/* Card Liquid Glass */
.glass-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: clamp(14px, 2.5vw, 22px);
  position: relative;
  overflow: hidden;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.15),
    0 8px 32px rgba(0,0,0,0.4);
}
.glass-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
  pointer-events: none;
  border-radius: inherit;
}

/* Card último producto */
#cardUltimoProducto {
  padding: clamp(12px, 2vw, 22px);
  flex-shrink: 0;
}
.up-label {
  font-size: clamp(10px, 1.1vw, 12px);
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
  position: relative; z-index: 1;
}
.up-body {
  display: flex;
  align-items: center;
  gap: clamp(10px, 2vw, 16px);
  position: relative; z-index: 1;
}
#imagenUltimoProducto {
  width: clamp(48px, 7vw, 72px);
  height: clamp(48px, 7vw, 72px);
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(24px, 3.5vw, 36px);
  flex-shrink: 0;
  overflow: hidden;
}
#imagenUltimoProducto img { width: 100%; height: 100%; object-fit: cover; }
.up-info { flex: 1; min-width: 0; }
#nombreUltimoProducto {
  font-size: clamp(15px, 2.2vw, 26px);
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#cantidadUltimoProducto {
  font-size: clamp(12px, 1.3vw, 15px);
  color: rgba(255,255,255,0.5);
  margin-top: 3px;
}
#precioUltimoProducto {
  font-size: clamp(18px, 2.8vw, 32px);
  font-weight: 900;
  color: var(--negocio-color);
  flex-shrink: 0;
  letter-spacing: -0.5px;
}

/* Lista items */
#listaItems {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow: hidden;
}
.item-fila {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: clamp(6px, 1vw, 9px) clamp(10px, 1.5vw, 14px);
  background: rgba(255,255,255,0.04);
  border-radius: 8px;
  font-size: clamp(11px, 1.3vw, 14px);
  border: 1px solid rgba(255,255,255,0.06);
  animation: fadeSlide 0.2s ease;
}
@keyframes fadeSlide { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
.item-fila-nombre {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: rgba(255,255,255,0.8);
}
.item-fila-precio {
  color: white;
  font-weight: 600;
  flex-shrink: 0;
  margin-left: 12px;
}

/* Card total */
#cardTotal {
  padding: clamp(12px, 2vw, 22px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.total-label {
  font-size: clamp(14px, 2vw, 22px);
  font-weight: 700;
  color: rgba(255,255,255,0.6);
  position: relative; z-index: 1;
}
#totalVenta {
  font-size: clamp(28px, 5.5vw, 64px);
  font-weight: 900;
  letter-spacing: -2px;
  color: white;
  position: relative; z-index: 1;
  transition: all 0.3s ease;
}

/* ── Estado Gracias ───────────────────────────────────────── */
#estadoGracias {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 20px;
  background: radial-gradient(ellipse at center, rgba(34,197,94,0.15) 0%, #0a0a14 70%);
}
.gracias-emoji {
  font-size: clamp(64px, 12vw, 110px);
  animation: bounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  display: block;
}
@keyframes bounceIn {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}
.gracias-titulo {
  font-size: clamp(26px, 5vw, 52px);
  font-weight: 900;
}
#montoGracias {
  font-size: clamp(18px, 3vw, 36px);
  color: rgba(255,255,255,0.6);
}
#vueltoGracias {
  font-size: clamp(22px, 4vw, 42px);
  font-weight: 700;
  color: #22c55e;
  display: none;
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.3);
  border-radius: 16px;
  padding: 10px 24px;
}

/* ── Slides publicidad ────────────────────────────────────── */
.slide-pub {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: clamp(16px, 3vw, 32px);
  opacity: 0;
  transition: opacity 0.8s ease;
  background-size: cover;
  background-position: center;
}
.slide-pub.visible { opacity: 1; }
.slide-iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  opacity: 0;
  transition: opacity 0.8s ease;
  background: #0a0a14;
}
.slide-iframe.visible { opacity: 1; }
.slide-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 50%, transparent 100%);
}
.slide-texto {
  position: relative;
  z-index: 1;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: clamp(12px, 2vw, 20px) clamp(16px, 3vw, 28px);
  text-align: center;
  width: 100%;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
}
.slide-titulo {
  font-size: clamp(16px, 2.5vw, 28px);
  font-weight: 800;
  line-height: 1.2;
}
.slide-subtitulo {
  font-size: clamp(12px, 1.8vw, 18px);
  color: rgba(255,255,255,0.8);
  margin-top: 4px;
}

/* Ken Burns */
@keyframes kenBurns {
  0%   { transform: scale(1)    translateX(0); }
  100% { transform: scale(1.08) translateX(-2%); }
}
@keyframes kenBurns2 {
  0%   { transform: scale(1)    translateX(0); }
  100% { transform: scale(1.07) translateX(2%) translateY(-1%); }
}
</style>
</head>
<body>

<!-- ═══ ESTADO 1: IDLE ════════════════════════════════════ -->
<div id="estadoIdle" class="estado activo">

  <!-- Carrusel fullscreen -->
  <div id="carruselPublicidad">
    <!-- Logo del negocio superpuesto -->
    <div class="idle-logo-overlay">
      <img id="logoNegocioIdle" alt="Logo">
      <div id="nombreNegocioIdle"></div>
    </div>
    <!-- Indicadores -->
    <div id="indicadoresCarrusel"></div>
  </div>

  <!-- Placeholder sin publicidad -->
  <div id="placeholderIdle">
    <div class="idle-logo-grande">ZERO<span>POS</span></div>
    <div class="idle-tagline">Bienvenido 👋</div>
  </div>

</div>

<!-- ═══ ESTADO 2: VENTA ═══════════════════════════════════ -->
<div id="estadoVenta" class="estado">
  <div class="layout-cliente">

    <!-- Zona productos (izq. en landscape, arriba en portrait) -->
    <div class="zona-producto">
      <div id="nombreNegocioVenta"></div>

      <!-- Último producto — Liquid Glass -->
      <div id="cardUltimoProducto" class="glass-card">
        <div class="up-label">Último producto</div>
        <div class="up-body">
          <div id="imagenUltimoProducto">🛍️</div>
          <div class="up-info">
            <div id="nombreUltimoProducto">—</div>
            <div id="cantidadUltimoProducto"></div>
          </div>
          <div id="precioUltimoProducto"></div>
        </div>
      </div>

      <!-- Lista de items -->
      <div id="listaItems"></div>

      <!-- Total — Liquid Glass -->
      <div id="cardTotal" class="glass-card">
        <div class="total-label">TOTAL</div>
        <div id="totalVenta">$0</div>
      </div>
    </div>

    <!-- Zona publicidad (der. en landscape, abajo en portrait) -->
    <div class="zona-publicidad">
      <div id="carruselPublicidadVenta"></div>
    </div>

  </div>
</div>

<!-- ═══ ESTADO 3: GRACIAS ══════════════════════════════════ -->
<div id="estadoGracias" class="estado">
  <span class="gracias-emoji">✅</span>
  <div class="gracias-titulo">¡Gracias!</div>
  <div id="montoGracias"></div>
  <div id="vueltoGracias"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════════ */
const fmt = n => '$' + (Math.round(Number(n)) || 0).toLocaleString('es-CL');

/* ═══════════════════════════════════════════════════════════
   CARRUSEL PUBLICIDAD
══════════════════════════════════════════════════════════ */
class CarruselPublicidad {
  constructor(contenedor, slides, opciones = {}) {
    this.contenedor = contenedor;
    this.slides = slides;
    this.indice = 0;
    this.duracion = (opciones.duracion || 5) * 1000;
    this.transicion = opciones.transicion || 'kenburns';
    this.intervalo = null;
    this.slideActual = null;
    this._iniciado = false;
  }

  iniciar() {
    if (this._iniciado) return;
    this._iniciado = true;
    if (!this.slides.length) return;
    this.contenedor.innerHTML = '';
    this._renderSlide(0);
    this.intervalo = setInterval(() => this._siguiente(), this.duracion);
    this._actualizarIndicadores();
  }

  detener() {
    clearInterval(this.intervalo);
    this.intervalo = null;
    this._iniciado = false;
  }

  reiniciar(slides, opciones = {}) {
    this.detener();
    this.slides = slides;
    this.indice = 0;
    this.duracion = (opciones.duracion || this.duracion / 1000) * 1000;
    this.contenedor.innerHTML = '';
    this.slideActual = null;
    this.iniciar();
  }

  _renderSlide(idx) {
    const s = this.slides[idx];

    if (s.plantilla_id) {
      // Renderizado con plantilla HTML en iframe
      const iframe = document.createElement('iframe');
      iframe.className = 'slide-iframe';
      iframe.src = `/static/plantillas_publicidad/${s.plantilla_id}.html`;
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      iframe.setAttribute('loading', 'eager');
      this.contenedor.appendChild(iframe);

      let _enviado = false;
      const _enviarDatos = () => {
        if (_enviado) return;
        _enviado = true;
        let datos = {};
        try { datos = JSON.parse(s.datos_plantilla || '{}'); } catch(e) {}
        iframe.contentWindow.postMessage({
          tipo: 'slide-data',
          titulo:    s.titulo    || '',
          subtitulo: s.subtitulo || '',
          imagen_url: s.imagen_url || null,
          color:  s.color  || '#6366f1',
          color2: s.color2 || '#8b5cf6',
          datos,
        }, '*');
      };

      iframe.addEventListener('load', () => {
        setTimeout(_enviarDatos, 100);
        requestAnimationFrame(() => iframe.classList.add('visible'));
      });
      requestAnimationFrame(() => { if (!iframe.classList.contains('visible')) iframe.classList.add('visible'); });
      this.slideActual = iframe;
      return;
    }

    // Modo simple (sin plantilla)
    const el = document.createElement('div');
    el.className = 'slide-pub';

    if (s.imagen_url) {
      el.style.backgroundImage = `url(${s.imagen_url})`;
      if (this.transicion === 'kenburns') {
        el.style.animation = `kenBurns${idx % 2 === 0 ? '' : '2'} ${this.duracion}ms ease-out forwards`;
      }
    } else {
      el.style.background = `linear-gradient(135deg, ${s.color || '#6366f1'}, ${s.color2 || '#8b5cf6'})`;
    }

    const overlay = document.createElement('div');
    overlay.className = 'slide-overlay';
    el.appendChild(overlay);

    if (s.titulo || s.subtitulo) {
      const texto = document.createElement('div');
      texto.className = 'slide-texto';
      if (s.titulo)    texto.innerHTML += `<div class="slide-titulo">${_esc(s.titulo)}</div>`;
      if (s.subtitulo) texto.innerHTML += `<div class="slide-subtitulo">${_esc(s.subtitulo)}</div>`;
      el.appendChild(texto);
    }

    this.contenedor.appendChild(el);
    requestAnimationFrame(() => el.classList.add('visible'));
    this.slideActual = el;
  }

  _siguiente() {
    const anterior = this.slideActual;
    this.indice = (this.indice + 1) % this.slides.length;
    this._renderSlide(this.indice);
    this._actualizarIndicadores();
    if (anterior) {
      setTimeout(() => {
        anterior.classList.remove('visible');
        setTimeout(() => anterior.remove(), 900);
      }, 100);
    }
  }

  _actualizarIndicadores() {
    const cont = document.getElementById('indicadoresCarrusel');
    if (!cont) return;
    cont.innerHTML = this.slides.map((_, i) => {
      const cls = i === this.indice ? ' activo' : '';
      const w = i === this.indice ? '24px' : '8px';
      return `<div class="ind-dot${cls}" style="width:${w}"></div>`;
    }).join('');
  }
}

function _esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ═══════════════════════════════════════════════════════════
   ESTADO DE PANTALLA
══════════════════════════════════════════════════════════ */
let carruselIdle = null;
let carruselVenta = null;
let estadoActual = 'idle';
let _pagadoTimer = null;
let _negocioNombre = 'ZERO POS';
let _slidesActuales = [];

function _setEstado(nombre) {
  document.querySelectorAll('.estado').forEach(el => el.classList.remove('activo'));
  const el = document.getElementById('estado' + nombre.charAt(0).toUpperCase() + nombre.slice(1));
  if (el) el.classList.add('activo');
  estadoActual = nombre;
}

function mostrarEstadoIdle() {
  _setEstado('idle');
  if (carruselIdle && !carruselIdle._iniciado) carruselIdle.iniciar();
  if (carruselVenta) carruselVenta.detener();
}

function mostrarEstadoVenta() {
  _setEstado('venta');
  if (carruselIdle) carruselIdle.detener();
  if (carruselVenta && !carruselVenta._iniciado) carruselVenta.iniciar();
}

function mostrarEstadoGracias(total, vuelto) {
  _setEstado('gracias');
  document.getElementById('montoGracias').textContent = `Total: ${fmt(total)}`;
  const vueltoEl = document.getElementById('vueltoGracias');
  if (vuelto > 0) {
    vueltoEl.style.display = 'block';
    vueltoEl.textContent = `Vuelto: ${fmt(vuelto)}`;
  } else {
    vueltoEl.style.display = 'none';
  }
  setTimeout(() => {
    mostrarEstadoIdle();
  }, 3000);
}

/* ═══════════════════════════════════════════════════════════
   ACTUALIZAR DATOS DE VENTA
══════════════════════════════════════════════════════════ */
function actualizarDatosVenta(data) {
  // Nombre negocio
  document.getElementById('nombreNegocioVenta').textContent = _negocioNombre;

  // Total
  const totalEl = document.getElementById('totalVenta');
  if (totalEl) {
    const nuevoTotal = fmt(data.total || 0);
    if (totalEl.textContent !== nuevoTotal) {
      totalEl.style.transform = 'scale(1.05)';
      totalEl.textContent = nuevoTotal;
      setTimeout(() => { totalEl.style.transform = ''; }, 200);
    }
  }

  // Último producto
  const items = data.items || [];
  if (items.length > 0) {
    const ultimo = items[items.length - 1];
    document.getElementById('nombreUltimoProducto').textContent = ultimo.nombre || '—';
    document.getElementById('precioUltimoProducto').textContent = fmt(ultimo.subtotal || 0);
    document.getElementById('cantidadUltimoProducto').textContent =
      `${ultimo.cantidad} × ${fmt(ultimo.precio_unit || 0)}`;
    const imgEl = document.getElementById('imagenUltimoProducto');
    if (ultimo.imagen_url) {
      imgEl.innerHTML = `<img src="${_esc(ultimo.imagen_url)}" alt="">`;
    } else {
      imgEl.textContent = '🛍️';
    }
  }

  // Lista items
  const listaEl = document.getElementById('listaItems');
  if (listaEl) {
    const maxItems = window.innerHeight < 700 ? 3 : 5;
    listaEl.innerHTML = items.slice(-maxItems).map(item => `
      <div class="item-fila">
        <span class="item-fila-nombre">${item.cantidad}× ${_esc(item.nombre)}</span>
        <span class="item-fila-precio">${fmt(item.subtotal || 0)}</span>
      </div>`).join('');
  }
}

/* ═══════════════════════════════════════════════════════════
   SINCRONIZACIÓN CON EL POS
══════════════════════════════════════════════════════════ */
let _estadoAnterior = null;

async function sincronizar() {
  try {
    const data = await fetch('/api/ventas/pantalla-cliente', { cache: 'no-store' })
      .then(r => r.json());

    if (data.activa && data.items && data.items.length) {
      if (_pagadoTimer) { clearTimeout(_pagadoTimer); _pagadoTimer = null; }
      if (estadoActual !== 'venta') mostrarEstadoVenta();
      actualizarDatosVenta(data);
      _estadoAnterior = 'venta';

    } else if (data.estado === 'pagado') {
      if (_estadoAnterior === 'venta' && !_pagadoTimer) {
        _pagadoTimer = setTimeout(() => {
          _pagadoTimer = null;
          _estadoAnterior = 'idle';
        }, 3500);
        mostrarEstadoGracias(data.total || 0, data.vuelto || 0);
      } else if (!_pagadoTimer && estadoActual !== 'gracias') {
        if (estadoActual !== 'idle') mostrarEstadoIdle();
      }

    } else {
      if (_pagadoTimer) { clearTimeout(_pagadoTimer); _pagadoTimer = null; }
      if (estadoActual !== 'idle' && estadoActual !== 'gracias') mostrarEstadoIdle();
      _estadoAnterior = 'idle';
    }
  } catch(e) {
    // Sin conexión → no cambiar estado
  }
}

/* ═══════════════════════════════════════════════════════════
   CARGA PUBLICIDAD
══════════════════════════════════════════════════════════ */
async function cargarPublicidad() {
  try {
    const slides = await fetch('/api/publicidad', { cache: 'no-store' }).then(r => r.json());
    const cfg = await fetch('/api/publicidad/config', { cache: 'no-store' }).then(r => r.json())
      .catch(() => ({ duracion: 5, transicion: 'kenburns' }));

    // Si son los mismos slides, no reiniciar
    const nuevosIds = JSON.stringify(slides.map(s => s.id + s.activo));
    const actualesIds = JSON.stringify(_slidesActuales.map(s => s.id + s.activo));
    if (nuevosIds === actualesIds && carruselIdle && carruselVenta) return;

    _slidesActuales = slides;
    const opciones = { duracion: cfg.duracion || 5, transicion: cfg.transicion || 'kenburns' };

    if (slides.length === 0) {
      // Mostrar placeholder
      document.getElementById('carruselPublicidad').style.visibility = 'hidden';
      document.getElementById('placeholderIdle').style.display = 'flex';
      carruselIdle = null;
      carruselVenta = null;
    } else {
      document.getElementById('carruselPublicidad').style.visibility = 'visible';
      document.getElementById('placeholderIdle').style.display = 'none';

      if (carruselIdle) {
        carruselIdle.reiniciar(slides, opciones);
      } else {
        carruselIdle = new CarruselPublicidad(
          document.getElementById('carruselPublicidad'), slides, opciones
        );
        if (estadoActual === 'idle') carruselIdle.iniciar();
      }

      if (carruselVenta) {
        carruselVenta.reiniciar(slides, opciones);
      } else {
        carruselVenta = new CarruselPublicidad(
          document.getElementById('carruselPublicidadVenta'), slides, opciones
        );
        if (estadoActual === 'venta') carruselVenta.iniciar();
      }
    }
  } catch(e) {
    // Sin slides → placeholder
    document.getElementById('placeholderIdle').style.display = 'flex';
    document.getElementById('carruselPublicidad').style.visibility = 'hidden';
  }
}

/* ═══════════════════════════════════════════════════════════
   CARGA CONFIG NEGOCIO
══════════════════════════════════════════════════════════ */
async function cargarConfigNegocio() {
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    if (cfg.nombre_negocio) {
      _negocioNombre = cfg.nombre_negocio;
      document.getElementById('nombreNegocioIdle').textContent = cfg.nombre_negocio;
      document.getElementById('nombreNegocioVenta').textContent = cfg.nombre_negocio;
    }
    if (cfg.tema_color) {
      document.documentElement.style.setProperty('--negocio-color', cfg.tema_color);
    }
    // Logo
    const logo = document.getElementById('logoNegocioIdle');
    const logoUrl = '/static/negocio/logo_ticket.png';
    const img = new Image();
    img.onload = () => { logo.src = logoUrl; logo.style.display = 'block'; };
    img.src = logoUrl;
  } catch(e) {}
}

/* ═══════════════════════════════════════════════════════════
   INICIALIZACIÓN
══════════════════════════════════════════════════════════ */
async function sincronizarPantalla() {
  try {
    const resp = await fetch('/api/ventas/pantalla-cliente', { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    if (data && data.activa) {
      mostrarEstadoVenta();
      actualizarDatosVenta(data);
    } else {
      mostrarEstadoIdle();
    }
  } catch(e) {
    console.log('Sin conexión al POS');
  }
}

cargarConfigNegocio();
cargarPublicidad();
sincronizarPantalla();
setInterval(sincronizarPantalla, 3000);
setInterval(cargarPublicidad, 30000);
</script>
