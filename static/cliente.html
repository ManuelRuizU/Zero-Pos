<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZERO POS — Pantalla Cliente</title>
<style>
:root{
  --bg:#0a0a0f;--surface:rgba(255,255,255,0.05);--surface2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.1);--accent:#6366f1;--accent2:#818cf8;
  --text:#f1f5f9;--text-dim:#94a3b8;--success:#22c55e;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(99,102,241,0.12) 0%,transparent 70%);
}

/* ── Header ─────────────────────────────── */
#headerBar{
  text-align:center;padding:14px 0 10px;
  font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--text-dim);border-bottom:1px solid var(--border);
  display:none;
}

/* ── Idle ───────────────────────────────── */
#pantallaIdle{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
}
.idle-logo{font-size:72px;}
.idle-nombre{font-size:38px;font-weight:800;letter-spacing:-1px;}
.idle-nombre span{color:var(--accent2);}
.idle-tagline{font-size:16px;color:var(--text-dim);}
.idle-bienvenida{
  margin-top:32px;font-size:22px;font-weight:600;color:var(--text-dim);
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ── Venta activa ───────────────────────── */
#pantallaVenta{
  flex:1;display:none;flex-direction:column;
  max-width:640px;width:100%;margin:0 auto;padding:24px 16px;gap:16px;
}
.venta-header{
  text-align:center;font-size:13px;color:var(--text-dim);
  letter-spacing:.5px;text-transform:uppercase;padding-bottom:8px;
}
.items-lista{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
}
.item-row{
  display:flex;align-items:center;padding:14px 18px;
  border-bottom:1px solid var(--border);gap:12px;
}
.item-row:last-child{border-bottom:none;}
.item-cant{
  background:var(--accent);color:#fff;border-radius:8px;
  font-size:13px;font-weight:700;padding:4px 8px;min-width:30px;text-align:center;
}
.item-nombre{flex:1;font-size:15px;font-weight:500;}
.item-sub{font-size:15px;font-weight:700;color:var(--accent2);}

/* ── Totales ────────────────────────────── */
.totales-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 24px;display:flex;flex-direction:column;gap:10px;
}
.tot-row{display:flex;justify-content:space-between;align-items:center;}
.tot-label{font-size:13px;color:var(--text-dim);font-weight:600;letter-spacing:.4px;text-transform:uppercase;}
.tot-valor{font-size:15px;font-weight:700;}
.tot-iva{color:var(--text-dim);}
.tot-divider{border:none;border-top:1px solid var(--border);margin:4px 0;}
.tot-total-label{font-size:14px;color:var(--text-dim);font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.tot-total-monto{font-size:52px;font-weight:900;letter-spacing:-2px;color:var(--accent2);}

/* ── Vuelto (estado pagado) ─────────────── */
#vueltoCard{
  display:none;
  background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.3);
  border-radius:var(--radius);padding:20px 24px;
  flex-direction:column;gap:8px;align-items:center;
}
.vuelto-title{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--success);}
.vuelto-monto{font-size:64px;font-weight:900;letter-spacing:-3px;color:var(--success);}
.pago-metodo{font-size:13px;color:var(--text-dim);margin-top:2px;}
</style>
</head>
<body>

<div id="headerBar"></div>

<div id="pantallaIdle">
  <div class="idle-logo">🛍️</div>
  <div class="idle-nombre" id="idleNombre">ZERO<span>POS</span></div>
  <div class="idle-tagline">Sin internet. Sin comisiones. Solo tú y tus ventas.</div>
  <div class="idle-bienvenida">¡Bienvenido! 👋</div>
</div>

<div id="pantallaVenta">
  <div class="venta-header">Tu pedido</div>
  <div class="items-lista" id="itemsLista"></div>
  <div class="totales-card">
    <div class="tot-row" id="ivaRow" style="display:none">
      <span class="tot-label tot-iva">IVA incluido</span>
      <span class="tot-valor tot-iva" id="ivaValor">$0</span>
    </div>
    <hr class="tot-divider" id="ivaDivider" style="display:none">
    <div class="tot-row">
      <span class="tot-total-label">Total</span>
      <span class="tot-total-monto" id="totalMonto">$0</span>
    </div>
  </div>
  <div id="vueltoCard">
    <div class="vuelto-title">Vuelto</div>
    <div class="vuelto-monto" id="vueltoMonto">$0</div>
    <div class="pago-metodo" id="pagoMetodo"></div>
  </div>
</div>

<script>
const fmt = n => '$' + Math.round(n).toLocaleString('es-CL');
const METODOS = {efectivo:'Efectivo',tarjeta:'Tarjeta',transferencia:'Transferencia',khipu:'Khipu'};

let _nombreNegocio = 'ZERO POS';

async function cargarNombre() {
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    if (cfg.nombre_negocio) {
      _nombreNegocio = cfg.nombre_negocio;
      document.getElementById('headerBar').textContent = _nombreNegocio;
      const el = document.getElementById('idleNombre');
      el.innerHTML = _nombreNegocio.replace(/ /g, '<span style="color:var(--accent2)"> </span>');
    }
  } catch(e) {}
}

async function poll() {
  try {
    const estado = await fetch('/api/ventas/pantalla-cliente').then(r => r.json());
    if (estado.activa && estado.items && estado.items.length) {
      mostrarVenta(estado);
    } else if (estado.estado === 'pagado') {
      mostrarVenta(estado);
    } else {
      mostrarIdle();
    }
  } catch(e) {}
}

function mostrarVenta(est) {
  document.getElementById('pantallaIdle').style.display = 'none';
  document.getElementById('headerBar').style.display = 'block';
  const pv = document.getElementById('pantallaVenta');
  pv.style.display = 'flex';

  // Items
  const lista = document.getElementById('itemsLista');
  lista.innerHTML = (est.items || []).map(i => `
    <div class="item-row">
      <span class="item-cant">${i.cantidad}</span>
      <span class="item-nombre">${i.nombre}</span>
      <span class="item-sub">${fmt(i.subtotal)}</span>
    </div>`).join('');

  // IVA
  const iva = est.iva || 0;
  const ivaRow = document.getElementById('ivaRow');
  const ivaDivider = document.getElementById('ivaDivider');
  if (iva > 0) {
    document.getElementById('ivaValor').textContent = fmt(iva);
    ivaRow.style.display = '';
    ivaDivider.style.display = '';
  } else {
    ivaRow.style.display = 'none';
    ivaDivider.style.display = 'none';
  }

  // Total
  document.getElementById('totalMonto').textContent = fmt(est.total);

  // Vuelto
  const vueltoCard = document.getElementById('vueltoCard');
  if (est.estado === 'pagado' && est.vuelto > 0) {
    document.getElementById('vueltoMonto').textContent = fmt(est.vuelto);
    const met = METODOS[est.metodo_pago] || est.metodo_pago || '';
    document.getElementById('pagoMetodo').textContent = met ? `Pagó con ${met}` : '';
    vueltoCard.style.display = 'flex';
  } else {
    vueltoCard.style.display = 'none';
  }
}

function mostrarIdle() {
  document.getElementById('pantallaVenta').style.display = 'none';
  document.getElementById('headerBar').style.display = 'none';
  document.getElementById('pantallaIdle').style.display = 'flex';
}

cargarNombre();
poll();
setInterval(poll, 2000);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', {scope: '/'})
      .catch(err => console.log('SW error:', err));
  });
}
</script>
</body>
</html>
