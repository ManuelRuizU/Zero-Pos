<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZERO POS — Cocina</title>
<style>
:root{
  --bg:#0a0a0f;--surface:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);
  --accent:#6366f1;--text:#f1f5f9;--text-dim:#94a3b8;
  --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;min-height:100vh;}
.topbar{display:flex;align-items:center;padding:12px 20px;gap:12px;
  background:rgba(10,10,15,0.9);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;}
.logo{font-weight:700;font-size:16px;} .logo span{color:var(--accent);}
.status{margin-left:auto;font-size:13px;color:var(--text-dim);}
.cola{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:20px;max-width:1400px;margin:0 auto;}
.pedido{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.pedido.nuevo{border-color:var(--warning);box-shadow:0 0 20px rgba(245,158,11,0.15);}
.pedido.listo{border-color:var(--success);opacity:0.65;}
.pedido-header{padding:12px 16px;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:space-between;}
.pedido-num{font-weight:700;font-size:16px;}
.pedido-hora{font-size:12px;color:var(--text-dim);}
.pedido-items{padding:12px 16px;}
.item-linea{padding:6px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,0.05);}
.item-linea:last-child{border:none;}
.item-qty{font-weight:700;color:var(--accent);}
.pedido-footer{padding:10px 16px;display:flex;gap:8px;}
.btn-accion{flex:1;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-listo{background:var(--success);color:#fff;}
.btn-listo:hover{filter:brightness(1.1);}
.btn-cancelar{background:rgba(239,68,68,0.2);color:var(--danger);}
.empty{text-align:center;padding:60px 20px;color:var(--text-dim);font-size:14px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">ZERO<span>POS</span> — Cocina</div>
  <span id="reloj" class="status"></span>
</div>
<div id="cola" class="cola">
  <div class="empty">
    <div style="font-size:48px;margin-bottom:12px">🍳</div>
    <div>Sin pedidos pendientes</div>
  </div>
</div>

<script>
function reloj() {
  document.getElementById('reloj').textContent = new Date().toLocaleTimeString('es-CL');
}
setInterval(reloj, 1000);
reloj();

async function cargarPedidos() {
  try {
    const ventas = await fetch('/api/ventas?limite=20', {credentials:'include'}).then(r=>r.json());
    const hoy = ventas.filter(v => v.estado==='completada' && v.creado_en?.startsWith(new Date().toISOString().substring(0,10)));
    const cola = document.getElementById('cola');
    if (!hoy.length) {
      cola.innerHTML='<div class="empty"><div style="font-size:48px;margin-bottom:12px">🍳</div><div>Sin pedidos pendientes</div></div>';
      return;
    }
    cola.innerHTML = hoy.slice(0,12).map(v=>`
      <div class="pedido" id="p${v.id}">
        <div class="pedido-header">
          <span class="pedido-num">Pedido #${v.id}</span>
          <span class="pedido-hora">${v.creado_en?.substring(11,16)||''}</span>
        </div>
        <div class="pedido-items">
          <div class="item-linea"><span class="item-qty">⏳</span> ${v.total?.toLocaleString('es-CL')} — ${v.metodo_pago}</div>
        </div>
        <div class="pedido-footer">
          <button class="btn-accion btn-listo" onclick="marcarListo(${v.id})">✓ Listo</button>
        </div>
      </div>`).join('');
  } catch(e) {}
}

function marcarListo(id) {
  const el = document.getElementById('p'+id);
  if (el) { el.classList.add('listo'); setTimeout(()=>el.remove(), 2000); }
}

async function init() {
  const me = await fetch('/api/auth/me',{credentials:'include'}).then(r=>r.json()).catch(()=>null);
  if (!me||me.error) { location.href='login.html'; return; }
  cargarPedidos();
  setInterval(cargarPedidos, 15000);
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', {scope: '/'})
      .catch(err => console.log('SW error:', err));
  });
}
</script>
</body>
</html>
