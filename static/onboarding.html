<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO POS — Configuración inicial</title>
<style>
:root{
  --bg:#0a0a0f;--surface:rgba(255,255,255,0.05);--surface2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.1);--accent:#6366f1;--accent2:#818cf8;
  --text:#f1f5f9;--text-dim:#94a3b8;--success:#22c55e;--radius:16px;
  --blur:blur(20px);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%,rgba(99,102,241,0.18) 0%,transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 80%,rgba(99,102,241,0.08) 0%,transparent 60%);
  padding:24px;
}

.container{
  width:100%;max-width:760px;
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

.header{text-align:center;margin-bottom:48px;}
.logo{font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:12px;}
.logo span{color:var(--accent);}
.tagline{color:var(--text-dim);font-size:15px;}
.step-title{font-size:24px;font-weight:700;margin-bottom:8px;}
.step-sub{color:var(--text-dim);font-size:14px;}

/* Tipo selector */
.tipos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;margin-bottom:32px;
}
.tipo-card{
  background:var(--surface);border:2px solid var(--border);
  border-radius:var(--radius);padding:24px 16px;
  cursor:pointer;transition:all .2s;text-align:center;
  user-select:none;
}
.tipo-card:hover{
  background:var(--surface2);
  border-color:rgba(99,102,241,0.5);
  transform:translateY(-3px);
}
.tipo-card.selected{
  background:rgba(99,102,241,0.15);
  border-color:var(--accent);
}
.tipo-icon{font-size:40px;margin-bottom:10px;display:block;}
.tipo-nombre{font-size:14px;font-weight:600;}

/* Progress */
.progress-bar{
  height:4px;background:var(--surface2);border-radius:2px;
  margin-bottom:40px;overflow:hidden;
}
.progress-fill{
  height:100%;background:var(--accent);border-radius:2px;
  transition:width .5s ease;
}

/* Paso 2 - confirmación */
.resumen-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px;margin-bottom:24px;
}
.resumen-titulo{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.resumen-lista{display:flex;flex-direction:column;gap:8px;}
.resumen-item{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:var(--text-dim);
}
.resumen-item::before{content:'✓';color:var(--success);font-weight:700;}

/* Acciones */
.acciones{display:flex;gap:12px;}
.btn-back{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:14px 24px;cursor:pointer;font-size:14px;
  transition:all .15s;
}
.btn-back:hover{background:var(--surface2);}
.btn-primary{
  flex:1;background:var(--accent);border:none;color:#fff;
  border-radius:12px;padding:14px 24px;font-size:15px;font-weight:700;
  cursor:pointer;transition:all .2s;
  box-shadow:0 4px 20px rgba(99,102,241,0.4);
}
.btn-primary:hover{filter:brightness(1.12);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}

/* Loading */
.loading{
  text-align:center;padding:40px;
  display:none;
}
.spinner{
  width:48px;height:48px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.8s linear infinite;margin:0 auto 20px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-msg{color:var(--text-dim);font-size:14px;}

/* Éxito */
.exito{text-align:center;padding:40px;display:none;}
.exito-icon{font-size:72px;margin-bottom:16px;}
.exito-titulo{font-size:22px;font-weight:700;margin-bottom:8px;}
.exito-sub{color:var(--text-dim);font-size:14px;margin-bottom:32px;}

.badge{
  display:inline-block;background:rgba(99,102,241,0.15);
  border:1px solid rgba(99,102,241,0.3);color:var(--accent2);
  border-radius:99px;padding:3px 10px;font-size:12px;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">ZERO<span>POS</span></div>
    <div class="tagline">Sin internet. Sin comisiones. Tuyo.</div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:25%"></div>
  </div>

  <!-- Paso 1: Elegir tipo -->
  <div id="paso1">
    <div class="step-title">¿Qué tipo de negocio tienes?</div>
    <div class="step-sub" style="margin-bottom:28px;">
      Cargamos categorías y productos base para que puedas vender de inmediato.
    </div>
    <div class="tipos-grid" id="tiposGrid"></div>
    <div class="acciones">
      <button class="btn-primary" id="btnSiguiente" disabled onclick="irPaso2()">
        Continuar →
      </button>
    </div>
  </div>

  <!-- Paso 2: Confirmar -->
  <div id="paso2" style="display:none">
    <div class="step-title">Configuración lista</div>
    <div class="step-sub" style="margin-bottom:24px;">
      Vamos a cargar lo siguiente para tu negocio:
    </div>
    <div class="resumen-card">
      <div class="resumen-titulo"><span id="resumenIcon">🏪</span> <span id="resumenTipo"></span></div>
      <div class="resumen-lista" id="resumenLista"></div>
    </div>
    <div class="acciones">
      <button class="btn-back" onclick="irPaso1()">← Cambiar</button>
      <button class="btn-primary" onclick="confirmar()">
        ✓ Cargar y comenzar
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-msg">Cargando productos...</div>
  </div>

  <!-- Éxito -->
  <div class="exito" id="exito">
    <div class="exito-icon">🎉</div>
    <div class="exito-titulo">¡Todo listo!</div>
    <div class="exito-sub" id="exitoMsg">Tu negocio está configurado.</div>
    <button class="btn-primary" style="max-width:260px;margin:0 auto;"
      onclick="location.href='pos.html'">
      Ir al punto de venta →
    </button>
  </div>
</div>

<script>
let tipoSeleccionado = null;
let tiposData = [];

async function init() {
  // Verificar auth
  const me = await fetch('/api/auth/me', {credentials:'include'}).then(r => r.json()).catch(() => null);
  if (!me || me.error) { location.href = 'login.html'; return; }

  // Verificar si ya está configurado
  const estado = await fetch('/api/onboarding/estado', {credentials:'include'}).then(r => r.json()).catch(() => ({}));
  if (estado.completado) {
    location.href = 'pos.html';
    return;
  }

  // Cargar tipos
  tiposData = await fetch('/api/onboarding/tipos', {credentials:'include'}).then(r => r.json()).catch(() => []);
  renderTipos();
}

function renderTipos() {
  const grid = document.getElementById('tiposGrid');
  grid.innerHTML = '';
  tiposData.forEach(t => {
    const card = document.createElement('div');
    card.className = 'tipo-card';
    card.dataset.id = t.id;
    card.innerHTML = `<span class="tipo-icon">${t.icono}</span><div class="tipo-nombre">${t.nombre}</div>`;
    card.onclick = () => seleccionarTipo(card, t);
    grid.appendChild(card);
  });
}

function seleccionarTipo(card, tipo) {
  document.querySelectorAll('.tipo-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  tipoSeleccionado = tipo;
  document.getElementById('btnSiguiente').disabled = false;
}

function irPaso2() {
  if (!tipoSeleccionado) return;
  document.getElementById('paso1').style.display = 'none';
  document.getElementById('paso2').style.display = 'block';
  document.getElementById('progressFill').style.width = '66%';

  document.getElementById('resumenIcon').textContent = tipoSeleccionado.icono;
  document.getElementById('resumenTipo').textContent = tipoSeleccionado.nombre;

  const lista = document.getElementById('resumenLista');
  lista.innerHTML = `
    <div class="resumen-item">Categorías y subcategorías específicas del rubro</div>
    <div class="resumen-item">Productos más comunes con precios de referencia en CLP</div>
    <div class="resumen-item">Variantes de tamaño/presentación configuradas</div>
    <div class="resumen-item">Stock inicial estimado</div>
    <div class="resumen-item">Puedes editar precios, stock y agregar más productos después</div>
  `;
}

function irPaso1() {
  document.getElementById('paso2').style.display = 'none';
  document.getElementById('paso1').style.display = 'block';
  document.getElementById('progressFill').style.width = '25%';
}

async function confirmar() {
  if (!tipoSeleccionado) return;

  document.getElementById('paso2').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('progressFill').style.width = '85%';

  try {
    const r = await fetch('/api/onboarding/setup', {
      method: 'POST',
      credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({tipo: tipoSeleccionado.id}),
    });
    const data = await r.json();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('progressFill').style.width = '100%';

    if (data.ok) {
      document.getElementById('exito').style.display = 'block';
      document.getElementById('exitoMsg').textContent =
        `Se cargaron ${data.productos_cargados} productos para tu ${tipoSeleccionado.nombre}. ¡A vender!`;
    } else {
      alert('Error: ' + (data.error || 'Error desconocido'));
      irPaso2();
    }
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    alert('Error de conexión');
    irPaso2();
  }
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', {scope: '/'})
      .catch(err => console.log('SW error:', err));
  });
}
</script>
</body>
</html>
