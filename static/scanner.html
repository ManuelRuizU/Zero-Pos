<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#22c55e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZERO POS — Escáner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/scanner.css">
</head>
<body>
<div class="topbar">
  <div class="logo">ZERO<span>POS</span> — Escáner</div>
  <button class="back" onclick="location.href='pos.html'">← Volver al POS</button>
</div>
<div class="scanner-area">
  <video id="video" playsinline autoplay></video>
  <div class="manual-row">
    <input class="cod-input" type="text" id="codigoInput"
      placeholder="O ingresa código manualmente..."
      onkeydown="if(event.key==='Enter')buscarCodigo()">
    <button class="btn-buscar" onclick="buscarCodigo()">Buscar</button>
  </div>
  <div class="resultado" id="resultado">
    <div class="res-nombre" id="resNombre"></div>
    <div class="res-precio" id="resPrecio"></div>
    <div class="res-stock" id="resStock"></div>
    <button class="btn-agregar" onclick="agregarYContinuar()">+ Agregar al carrito →</button>
  </div>
  <p class="msg" id="msg">Apunta la cámara al código de barras</p>
  <div id="scannerToast"></div>
  <div id="scannerBadge" onclick="irAPos()"></div>
</div>

<script src="/static/js/zero-utils.js"></script>
<script src="/static/js/scanner.js"></script>
</body>
</html>
