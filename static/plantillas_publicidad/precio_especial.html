<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { margin:0;padding:0;box-sizing:border-box }
:root { --c1:#f59e0b; --c2:#ef4444; }
body {
  width:100vw;height:100vh;overflow:hidden;
  background:#0a0a14;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  color:white;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:clamp(20px,4vw,48px);
}
.badge-descuento {
  background:linear-gradient(135deg,var(--c1),var(--c2));
  color:white;font-weight:900;
  font-size:clamp(13px,2vw,20px);
  letter-spacing:2px;text-transform:uppercase;
  padding:6px 20px;border-radius:100px;
  margin-bottom:clamp(16px,3vw,32px);
  box-shadow:0 4px 20px rgba(239,68,68,.4);
}
#titulo {
  font-size:clamp(20px,3.5vw,40px);
  font-weight:800;margin-bottom:clamp(20px,3.5vw,40px);
  opacity:.9;
}
.precios-wrap {
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:clamp(16px,2.5vw,28px);
  padding:clamp(20px,3.5vw,44px);
  width:100%;max-width:480px;
}
.precio-antes {
  font-size:clamp(22px,4vw,48px);
  font-weight:700;
  color:rgba(255,255,255,.4);
  text-decoration:line-through;
  text-decoration-color:var(--c2);
  text-decoration-thickness:3px;
  margin-bottom:4px;
}
.label-antes {
  font-size:clamp(11px,1.5vw,15px);
  color:rgba(255,255,255,.4);
  margin-bottom:clamp(12px,2vw,20px);
}
.precio-hoy {
  font-size:clamp(42px,8vw,96px);
  font-weight:900;
  color:var(--c1);
  line-height:1;
  margin-bottom:4px;
  text-shadow:0 0 32px color-mix(in srgb,var(--c1),transparent 40%);
}
.label-hoy {
  font-size:clamp(11px,1.5vw,15px);
  color:rgba(255,255,255,.55);
  margin-bottom:clamp(16px,2.5vw,28px);
}
.ahorro-badge {
  display:inline-block;
  background:rgba(245,158,11,.15);
  border:1px solid rgba(245,158,11,.3);
  border-radius:8px;
  padding:4px 14px;
  font-size:clamp(12px,1.8vw,18px);
  font-weight:600;
  color:var(--c1);
}
</style>
</head>
<body>
<div class="badge-descuento">Precio especial</div>
<div id="titulo">Producto seleccionado</div>
<div class="precios-wrap">
  <div class="precio-antes" id="precio_antes">$2.500</div>
  <div class="label-antes">Precio anterior</div>
  <div class="precio-hoy" id="precio_hoy">$1.890</div>
  <div class="label-hoy">Precio hoy</div>
  <div class="ahorro-badge" id="ahorro_badge">Ahorras $610</div>
</div>
<script>
function _parsePrecio(s) {
  return parseInt((s||'').replace(/[^0-9]/g,'')) || 0;
}
function render(d) {
  const datos = d.datos || {};
  if (datos.color1 || d.color) document.documentElement.style.setProperty('--c1', datos.color1 || d.color || '#f59e0b');
  if (datos.color2 || d.color2) document.documentElement.style.setProperty('--c2', datos.color2 || d.color2 || '#ef4444');
  if (d.titulo) document.getElementById('titulo').textContent = d.titulo;
  const pa = datos.precio_antes || '$2.500';
  const ph = datos.precio_hoy  || '$1.890';
  document.getElementById('precio_antes').textContent = pa;
  document.getElementById('precio_hoy').textContent   = ph;
  const diff = _parsePrecio(pa) - _parsePrecio(ph);
  if (diff > 0) {
    document.getElementById('ahorro_badge').textContent =
      'Ahorras $' + diff.toLocaleString('es-CL');
  }
}
window.addEventListener('message', e => { if (e.data?.tipo === 'slide-data') render(e.data); });
</script>
</body>
</html>
