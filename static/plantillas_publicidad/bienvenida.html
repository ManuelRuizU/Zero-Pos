<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { margin:0;padding:0;box-sizing:border-box }
:root { --c1:#6366f1; --c2:#8b5cf6; }
body {
  width:100vw;height:100vh;overflow:hidden;
  background:#0a0a14;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  color:white;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:clamp(12px,2.5vw,28px);
  padding:clamp(20px,5vw,56px);
  position:relative;
}
.bg-layer {
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 50% 50%, color-mix(in srgb,var(--c1),transparent 82%), transparent);
}
.logo-circle {
  width:clamp(70px,12vw,120px);
  height:clamp(70px,12vw,120px);
  border-radius:50%;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(30px,5.5vw,56px);
  box-shadow:0 8px 32px color-mix(in srgb,var(--c1),transparent 50%),
             inset 0 2px 0 rgba(255,255,255,.3);
  position:relative;z-index:1;
  animation:float 4s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform:translateY(0); }
  50%      { transform:translateY(-8px); }
}
.bienvenido {
  font-size:clamp(14px,2.2vw,22px);
  font-weight:600;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.5);
  position:relative;z-index:1;
}
h1 {
  font-size:clamp(26px,5vw,58px);font-weight:900;
  text-align:center;line-height:1.05;
  background:linear-gradient(135deg,white,rgba(255,255,255,.75));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  position:relative;z-index:1;
}
.divider {
  width:clamp(40px,6vw,64px);height:3px;
  background:linear-gradient(90deg,var(--c1),var(--c2));
  border-radius:2px;
  position:relative;z-index:1;
}
#frase {
  font-size:clamp(15px,2.3vw,26px);
  color:rgba(255,255,255,.65);
  text-align:center;max-width:600px;
  line-height:1.5;
  position:relative;z-index:1;
}
.dia-hoy {
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:clamp(10px,1.5vw,16px);
  padding:clamp(8px,1.4vw,14px) clamp(16px,3vw,28px);
  display:flex;gap:12px;align-items:center;
  position:relative;z-index:1;
}
.dia-hoy-label { font-size:clamp(11px,1.4vw,14px);color:rgba(255,255,255,.4); }
.dia-hoy-valor {
  font-size:clamp(13px,1.8vw,18px);font-weight:700;
  color:var(--c1);
}
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="logo-circle">🏪</div>
<div class="bienvenido">Bienvenido a</div>
<h1 id="nombre_negocio">Tu Tienda Favorita</h1>
<div class="divider"></div>
<div id="frase">Tu compra de confianza</div>
<div class="dia-hoy">
  <span>📅</span>
  <div>
    <div class="dia-hoy-label">Hoy es</div>
    <div class="dia-hoy-valor" id="dia-hoy-texto">—</div>
  </div>
</div>
<script>
function _diaHoy() {
  return new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
}
function render(d) {
  const datos = d.datos || {};
  document.documentElement.style.setProperty('--c1', datos.color1 || d.color || '#6366f1');
  document.documentElement.style.setProperty('--c2', datos.color2 || d.color2 || '#8b5cf6');
  const nombre = datos.nombre_negocio || d.titulo || 'Tu Tienda Favorita';
  document.getElementById('nombre_negocio').textContent = nombre;
  if (datos.frase || d.subtitulo) {
    document.getElementById('frase').textContent = datos.frase || d.subtitulo;
  }
  document.getElementById('dia-hoy-texto').textContent = _diaHoy();
}
window.addEventListener('message', e => { if (e.data?.tipo === 'slide-data') render(e.data); });
render({});
setInterval(() => {
  document.getElementById('dia-hoy-texto').textContent = _diaHoy();
}, 60000);
</script>
</body>
</html>
