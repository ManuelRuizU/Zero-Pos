<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { margin:0;padding:0;box-sizing:border-box }
:root { --c1:#06b6d4; --c2:#0ea5e9; }
body {
  width:100vw;height:100vh;overflow:hidden;
  background:#0a0a14;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  color:white;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:clamp(16px,3vw,32px);
  position:relative;
}
.bg-glow {
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 50% 50%, color-mix(in srgb,var(--c1),transparent 82%), transparent);
}
.wifi-icon {
  font-size:clamp(36px,6vw,64px);
  filter:drop-shadow(0 0 16px var(--c1));
}
h1 {
  font-size:clamp(24px,4.5vw,52px);font-weight:900;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;
}
.glass-card {
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.13);
  border-radius:clamp(16px,2.5vw,24px);
  padding:clamp(16px,3vw,28px);
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(12px,2vw,20px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
  max-width:min(340px,88vw);
}
#qr-img {
  width:clamp(140px,22vw,220px);
  height:clamp(140px,22vw,220px);
  border-radius:12px;
  background:white;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#qr-img img { width:100%;height:100%;object-fit:contain; }
.ssid-wrap { text-align:center; }
.ssid-label { font-size:clamp(11px,1.5vw,14px);color:rgba(255,255,255,.5);margin-bottom:3px; }
#ssid-text {
  font-size:clamp(16px,2.5vw,26px);font-weight:700;
  color:var(--c1);letter-spacing:.5px;
}
.hint { font-size:clamp(10px,1.3vw,13px);color:rgba(255,255,255,.4);text-align:center; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="wifi-icon">📶</div>
<h1>Conéctate gratis</h1>
<div class="glass-card">
  <div id="qr-img"><span style="color:#0a0a14;font-size:13px;padding:8px;text-align:center">Cargando QR…</span></div>
  <div class="ssid-wrap">
    <div class="ssid-label">Red WiFi</div>
    <div id="ssid-text">MiNegocioWiFi</div>
  </div>
</div>
<div class="hint">Escanea el código para conectarte automáticamente</div>
<script>
function render(d) {
  const datos = d.datos || {};
  const c1 = datos.color1 || d.color || '#06b6d4';
  const c2 = datos.color2 || d.color2 || '#0ea5e9';
  document.documentElement.style.setProperty('--c1', c1);
  document.documentElement.style.setProperty('--c2', c2);

  const ssid = datos.ssid || 'MiNegocioWiFi';
  const pass = datos.password || '';
  document.getElementById('ssid-text').textContent = ssid;

  const wifiUri = `WIFI:T:WPA;S:${ssid};P:${pass};;`;
  const qrBox = document.getElementById('qr-img');
  const enc = encodeURIComponent(wifiUri);
  qrBox.innerHTML = `<img src="/api/publicidad/qr?d=${enc}" alt="QR WiFi" onerror="this.parentNode.innerHTML='<span style=color:#0a0a14;font-size:12px;padding:8px>Sin QR</span>'">`;
}
window.addEventListener('message', e => { if (e.data?.tipo === 'slide-data') render(e.data); });
</script>
</body>
</html>
