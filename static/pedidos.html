<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery — ZERO POS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="/static/css/zero-tokens.css">
<link rel="stylesheet" href="/static/css/zero-base.css">
<link rel="stylesheet" href="/static/css/zero-components.css">
<link rel="stylesheet" href="/static/css/pedidos.css">
</head>
<body>

<!-- Header -->
<div id="header">
  <div style="width:36px;height:36px;background:#2a1a10;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
    <i class="ti ti-motorbike" style="color:#fb923c;font-size:20px"></i>
  </div>
  <h1>Delivery</h1>
  <span class="badge" id="badgeActivos">0</span>
  <button onclick="location.href='/static/pos.html'" style="margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.4);color:#a5b4fc;font-size:13px;cursor:pointer;padding:6px 12px;border-radius:8px;font-weight:600;transition:all .15s" onmouseenter="this.style.background='rgba(99,102,241,0.22)'" onmouseleave="this.style.background='rgba(99,102,241,0.12)'">
    <i class="ti ti-arrow-left" style="font-size:16px"></i> Volver a la Caja
  </button>
</div>

<!-- Mobile tabs -->
<div id="tabs">
  <button class="active" onclick="showTab('form')"><i class="ti ti-plus"></i> Nuevo Pedido</button>
  <button id="tabCola" onclick="showTab('cola')"><i class="ti ti-list"></i> Cola <span id="tabColaBadge"></span></button>
</div>

<!-- Main -->
<div id="main">

  <!-- LEFT: Form -->
  <div id="panelForm">

    <!-- Tipo -->
    <div>
      <div class="sec-title">Tipo de pedido</div>
      <div id="tipoSelector">
        <button class="tipo-btn active" data-tipo="delivery" onclick="setTipo('delivery')">
          <span>🛵</span>Delivery
        </button>
        <button class="tipo-btn" data-tipo="retiro" onclick="setTipo('retiro')">
          <span>🏠</span>Retiro
        </button>
        <button class="tipo-btn" data-tipo="local" onclick="setTipo('local')">
          <span>🪑</span>Local
        </button>
      </div>
    </div>

    <!-- Cliente -->
    <div id="secCliente">
      <div class="sec-title">Cliente</div>
      <div class="field-group">
        <div>
          <label>📱 Teléfono *</label>
          <input id="fTel" type="tel" placeholder="+56 9 1234 5678"
                 oninput="onTelInput(this.value)">
        </div>
        <div id="clienteBadge"></div>
        <div class="field-row">
          <div>
            <label>Nombre *</label>
            <input id="fNombre" type="text" placeholder="Juan Pérez">
          </div>
          <div>
            <label>Tel 2</label>
            <input id="fTel2" type="tel" placeholder="Opcional">
          </div>
        </div>
        <div>
          <label>Email</label>
          <input id="fEmail" type="email" placeholder="correo@ejemplo.cl">
        </div>
        <div id="receptorSugerencia" style="display:none;background:#6366f115;border:1px solid #6366f144;border-radius:7px;padding:8px 10px;font-size:12px;">
          <div id="receptorSugerenciaTexto" style="color:var(--accent2);margin-bottom:6px;"></div>
          <div style="display:flex;gap:8px;">
            <button onclick="aceptarReceptorSugerido()" style="flex:1;background:var(--accent);border:none;color:#fff;border-radius:6px;padding:5px 0;font-size:12px;cursor:pointer;font-family:inherit;">Sí</button>
            <button onclick="rechazarReceptorSugerido()" style="flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 0;font-size:12px;cursor:pointer;font-family:inherit;">No, otra persona</button>
          </div>
        </div>
        <div id="toggleReceptor">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text-dim);">
            <input type="checkbox" id="chkReceptor" onchange="toggleReceptorFields()">
            Entregar a otra persona
          </label>
        </div>
        <div id="camposReceptor" style="display:none;flex-direction:column;gap:8px;">
          <div>
            <label>Nombre de quien recibe *</label>
            <input id="receptorNombre" type="text" placeholder="Nombre de quien recibe">
          </div>
          <div>
            <label>Teléfono de quien recibe</label>
            <input id="receptorTel" type="tel" placeholder="Teléfono de quien recibe">
          </div>
        </div>
      </div>
    </div>

    <!-- Dirección (solo delivery) -->
    <div id="secDireccion">
      <div class="sec-title">Dirección de entrega</div>
      <div class="field-group">
        <div style="position:relative;">
          <label>Dirección *</label>
          <input id="fDir" type="text" placeholder="Av. Principal 1234"
                 oninput="onDirInput(this.value)" autocomplete="off">
          <div id="dirAutocomplete"
               style="display:none;position:absolute;top:100%;left:0;right:0;
                      background:var(--card2);border:1px solid var(--border);
                      border-radius:7px;max-height:180px;overflow-y:auto;
                      z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.3);"></div>
        </div>
        <div id="alertaDireccion"
             style="display:none;background:rgba(239,68,68,.1);
                    border:1px solid rgba(239,68,68,.4);border-radius:7px;
                    padding:7px 10px;font-size:12px;color:var(--red);
                    margin-top:4px;line-height:1.7;"></div>
        <div class="field-row">
          <div>
            <label>Depto / Piso</label>
            <input id="fDepto" type="text" placeholder="Depto 302">
          </div>
          <div>
            <label>Referencia</label>
            <input id="fRef" type="text" placeholder="Portón verde">
          </div>
        </div>
        <input id="fComuna" type="hidden">
      </div>
    </div>

    <!-- Productos -->
    <div>
      <div class="sec-title">Productos</div>
      <div id="prodSearch">
        <input id="prodInput" type="text" placeholder="🔍 Buscar producto..."
               oninput="onProdInput(this.value)" autocomplete="off">
        <div id="prodResultados"></div>
      </div>
      <div id="variantesPicker">
        <div class="vp-title" id="vpTitulo"></div>
        <div id="variantesGrid2"></div>
      </div>
      <div id="carritoLista" style="margin-top:8px"></div>
    </div>

    <!-- Notas y pago -->
    <div>
      <label>Notas del pedido</label>
      <textarea id="fNotas" placeholder="Ej: sin wasabi, tocar timbre, etc."></textarea>
    </div>
    <div>
      <label>Método de pago</label>
      <select id="fPago">
        <option value="efectivo">💵 Efectivo</option>
        <option value="tarjeta">💳 Tarjeta</option>
        <option value="transferencia">🏦 Transferencia</option>
        <option value="debito">💳 Débito</option>
      </select>
    </div>

    <!-- Total + submit -->
    <div id="totalBar">
      <span class="total-label">Total</span>
      <span class="total-val" id="totalVal">$0</span>
    </div>
    <button id="btnConfirmar" onclick="confirmarPedido()" disabled>
      ✅ Confirmar Pedido
    </button>

  </div>

  <!-- RIGHT: Cola -->
  <div id="panelCola">
    <div id="colaHeader">
      <h2>Cola de Pedidos</h2>
      <button style="margin-left:auto;background:var(--card);border:1px solid var(--border);
                     color:var(--text-dim);border-radius:6px;padding:4px 10px;
                     font-size:11px;cursor:pointer" onclick="cargarCola()">↻ Refrescar</button>
    </div>
    <div class="filter-pills">
      <button class="pill active" data-f="activos" onclick="setFiltro('activos',this)">Activos</button>
      <button class="pill" data-f="nuevo" onclick="setFiltro('nuevo',this)">Nuevo</button>
      <button class="pill" data-f="preparando" onclick="setFiltro('preparando',this)">Preparando</button>
      <button class="pill" data-f="listo" onclick="setFiltro('listo',this)">Listo</button>
      <button class="pill" data-f="todos" onclick="setFiltro('todos',this)">Todos</button>
    </div>
    <div id="colaCards"></div>
  </div>

</div>

<!-- Modal QR -->
<div id="modalQR" onclick="cerrarQR()">
  <div class="modal-qr-box" onclick="event.stopPropagation()">
    <h3>🗺 Ruta de Entrega</h3>
    <img id="qrImg" src="" alt="QR Maps">
    <div class="dir-text" id="qrDirText"></div>
    <a id="qrMapsLink" href="#" target="_blank" rel="noopener">Abrir en Google Maps ↗</a>
    <button class="close-btn" onclick="cerrarQR()">Cerrar</button>
  </div>
</div>

<!-- Print zone -->
<div id="printZone"></div>

<script src="/static/js/pedidos.js"></script>
</body>
</html>
