<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery — ZERO POS</title>
<link rel="stylesheet" href="/static/css/zero-tokens.css">
<link rel="stylesheet" href="/static/css/zero-base.css">
<link rel="stylesheet" href="/static/css/zero-components.css">
<style>
:root {
  --bg:       #0f0f13;
  --panel:    #17171f;
  --card:     #1e1e28;
  --card2:    #25252f;
  --border:   #2e2e3a;
  --accent:   #6366f1;
  --accent2:  #818cf8;
  --green:    #22c55e;
  --yellow:   #eab308;
  --red:      #ef4444;
  --blue:     #3b82f6;
  --gray:     #6b7280;
  --text:     #f1f1f5;
  --text-dim: #8b8b9e;
  --radius:   10px;
  --shadow:   0 2px 12px #0005;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
#header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#header h1 { font-size: 17px; font-weight: 700; }
#header .badge {
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 99px;
}
#header a {
  margin-left: auto;
  color: var(--text-dim);
  font-size: 12px;
  text-decoration: none;
}
#header a:hover { color: var(--text); }

/* ── Mobile tabs ── */
#tabs {
  display: none;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#tabs button {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 13px;
  padding: 10px 0;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .15s;
}
#tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Main layout ── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}
#panelForm {
  width: 420px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#panelCola {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── Section titles ── */
.sec-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}

/* ── Type selector ── */
#tipoSelector {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
.tipo-btn {
  background: var(--card);
  border: 2px solid var(--border);
  color: var(--text-dim);
  border-radius: var(--radius);
  padding: 10px 6px;
  cursor: pointer;
  text-align: center;
  font-size: 13px;
  transition: all .15s;
  line-height: 1.4;
}
.tipo-btn span { display: block; font-size: 22px; margin-bottom: 2px; }
.tipo-btn.active {
  border-color: var(--accent);
  color: var(--text);
  background: #6366f115;
}

/* ── Form fields ── */
.field-group { display: flex; flex-direction: column; gap: 8px; }
.field-row { display: flex; gap: 8px; }
.field-row > * { flex: 1; }
label { font-size: 11px; color: var(--text-dim); font-weight: 600; display: block; margin-bottom: 3px; }
input, select, textarea {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 7px;
  padding: 8px 10px;
  font-size: 13px;
  outline: none;
  transition: border-color .15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 52px; }
select { cursor: pointer; }

/* ── Phone search ── */
#clienteBadge {
  background: #22c55e18;
  border: 1px solid #22c55e44;
  border-radius: 7px;
  padding: 7px 10px;
  font-size: 12px;
  color: var(--green);
  display: none;
}
#clienteBadge.nuevo { background: #6366f115; border-color: #6366f144; color: var(--accent2); }

/* ── Products ── */
#prodSearch {
  position: relative;
}
#prodResultados {
  position: absolute;
  top: 100%;
  left: 0; right: 0;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-height: 200px;
  overflow-y: auto;
  z-index: 50;
  display: none;
}
.prod-result-item {
  padding: 8px 12px;
  cursor: pointer;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.prod-result-item:last-child { border-bottom: none; }
.prod-result-item:hover { background: var(--card); }
.prod-result-item .pname { font-weight: 500; }
.prod-result-item .pprice { color: var(--text-dim); font-size: 12px; }
.prod-result-item .variantes-hint { font-size: 11px; color: var(--accent2); }

#carritoLista {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 32px;
}
.carrito-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.carrito-item .ci-nombre { flex: 1; font-size: 13px; }
.carrito-item .ci-precio { color: var(--text-dim); font-size: 12px; min-width: 58px; text-align: right; }
.ci-qty {
  display: flex;
  align-items: center;
  gap: 4px;
}
.ci-qty button {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text);
  width: 24px; height: 24px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.ci-qty span { min-width: 20px; text-align: center; font-size: 13px; font-weight: 600; }
.ci-del {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 16px;
  padding: 2px;
  line-height: 1;
}
.ci-del:hover { color: var(--red); }

/* ── Item notas inline ── */
.ci-notas-input {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 5px;
  font-size: 11px;
  padding: 3px 7px;
  width: 100%;
  margin-top: 3px;
}
.ci-notas-input:focus { border-color: var(--accent); color: var(--text); }

/* ── Variantes picker ── */
#variantesPicker {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  display: none;
  flex-direction: column;
  gap: 6px;
}
#variantesPicker .vp-title { font-size: 12px; color: var(--text-dim); font-weight: 600; }
#variantesGrid2 {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.vp-btn {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
.vp-btn:hover { border-color: var(--accent); }

/* ── Total / submit ── */
#totalBar {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#totalBar .total-label { font-size: 12px; color: var(--text-dim); }
#totalBar .total-val { font-size: 20px; font-weight: 700; color: var(--text); }
#btnConfirmar {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  transition: background .15s;
}
#btnConfirmar:hover { background: var(--accent2); }
#btnConfirmar:disabled { background: var(--gray); cursor: not-allowed; }

/* ── Queue ── */
#colaHeader {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
#colaHeader h2 { font-size: 15px; font-weight: 700; }
.filter-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.pill {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
.pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── Order card ── */
.pedido-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color .2s;
}
.pedido-card.estado-nuevo    { border-left: 3px solid var(--blue); }
.pedido-card.estado-preparando { border-left: 3px solid var(--yellow); }
.pedido-card.estado-listo    { border-left: 3px solid var(--green); }
.pedido-card.estado-despachado { border-left: 3px solid var(--gray); opacity: .7; }

.pc-top {
  display: flex;
  align-items: center;
  gap: 8px;
}
.pc-num { font-size: 17px; font-weight: 800; }
.pc-tipo { font-size: 18px; }
.pc-time { font-size: 11px; color: var(--text-dim); margin-left: auto; }
.pc-cliente { font-size: 13px; font-weight: 600; }
.pc-items { font-size: 12px; color: var(--text-dim); }
.pc-notas {
  font-size: 12px;
  color: var(--yellow);
  background: #eab30818;
  border-radius: 5px;
  padding: 4px 8px;
}

.estado-badge {
  display: inline-block;
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
}
.estado-nuevo      { background: #3b82f620; color: #60a5fa; }
.estado-preparando { background: #eab30820; color: #fbbf24; }
.estado-listo      { background: #22c55e20; color: #4ade80; }
.estado-despachado { background: #6b728020; color: #9ca3af; }
.estado-cancelado  { background: #ef444420; color: #f87171; }

.pc-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.pc-actions button {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
.pc-actions button:hover { background: var(--border); }
.pc-actions .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.pc-actions .btn-primary:hover { background: var(--accent2); }
.pc-actions .btn-danger:hover { background: var(--red); border-color: var(--red); color: #fff; }

/* ── Modal QR ── */
#modalQR {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 200;
  align-items: center;
  justify-content: center;
}
#modalQR.active { display: flex; }
.modal-qr-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  max-width: 340px;
  width: 90%;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-qr-box h3 { font-size: 16px; font-weight: 700; }
.modal-qr-box img { width: 200px; height: 200px; margin: 0 auto; border-radius: 8px; }
.modal-qr-box .dir-text { font-size: 12px; color: var(--text-dim); }
.modal-qr-box a {
  color: var(--accent2);
  font-size: 12px;
  text-decoration: none;
}
.modal-qr-box .close-btn {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  padding: 8px;
  cursor: pointer;
  font-size: 13px;
}

/* ── Print zone ── */
#printZone { display: none; }

@media print {
  body > *:not(#printZone) { display: none !important; }
  #printZone {
    display: block !important;
    font-family: monospace;
    font-size: 13px;
    color: #000;
    background: #fff;
    padding: 10px;
    max-width: 300px;
  }
  .print-line { margin: 2px 0; }
  .print-sep { border-top: 1px dashed #000; margin: 4px 0; }
  .print-bold { font-weight: bold; }
  .print-center { text-align: center; }
  .print-big { font-size: 16px; font-weight: bold; }
  .print-nota { background: #fffde0; padding: 2px 4px; }
  .print-qr { margin: 8px auto; display: block; width: 140px; }
}

/* ── Mobile ── */
@media (max-width: 720px) {
  #tabs { display: flex; }
  #main { overflow: visible; }
  #panelForm {
    width: 100%;
    border-right: none;
    overflow: visible;
  }
  #panelCola { overflow: visible; }
  .tab-hidden { display: none !important; }
  body { overflow-y: auto; }
}
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <span style="font-size:20px">🛵</span>
  <h1>Delivery</h1>
  <span class="badge" id="badgeActivos">0</span>
  <a href="/static/pos.html">← POS</a>
</div>

<!-- Mobile tabs -->
<div id="tabs">
  <button class="active" onclick="showTab('form')">➕ Nuevo Pedido</button>
  <button id="tabCola" onclick="showTab('cola')">📋 Cola <span id="tabColaBadge"></span></button>
</div>

<!-- Main -->
<div id="main">

  <!-- LEFT: Form -->
  <div id="panelForm">

    <!-- Tipo -->
    <div>
      <div class="sec-title">Tipo de pedido</div>
      <div id="tipoSelector">
        <button class="tipo-btn active" data-tipo="delivery" onclick="setTipo('delivery')">
          <span>🛵</span>Delivery
        </button>
        <button class="tipo-btn" data-tipo="retiro" onclick="setTipo('retiro')">
          <span>🏠</span>Retiro
        </button>
        <button class="tipo-btn" data-tipo="local" onclick="setTipo('local')">
          <span>🪑</span>Local
        </button>
      </div>
    </div>

    <!-- Cliente -->
    <div id="secCliente">
      <div class="sec-title">Cliente</div>
      <div class="field-group">
        <div>
          <label>📱 Teléfono *</label>
          <input id="fTel" type="tel" placeholder="+56 9 1234 5678"
                 oninput="onTelInput(this.value)">
        </div>
        <div id="clienteBadge"></div>
        <div class="field-row">
          <div>
            <label>Nombre *</label>
            <input id="fNombre" type="text" placeholder="Juan Pérez">
          </div>
          <div>
            <label>Tel 2</label>
            <input id="fTel2" type="tel" placeholder="Opcional">
          </div>
        </div>
        <div>
          <label>Email</label>
          <input id="fEmail" type="email" placeholder="correo@ejemplo.cl">
        </div>
        <div id="receptorSugerencia" style="display:none;background:#6366f115;border:1px solid #6366f144;border-radius:7px;padding:8px 10px;font-size:12px;">
          <div id="receptorSugerenciaTexto" style="color:var(--accent2);margin-bottom:6px;"></div>
          <div style="display:flex;gap:8px;">
            <button onclick="aceptarReceptorSugerido()" style="flex:1;background:var(--accent);border:none;color:#fff;border-radius:6px;padding:5px 0;font-size:12px;cursor:pointer;font-family:inherit;">Sí</button>
            <button onclick="rechazarReceptorSugerido()" style="flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 0;font-size:12px;cursor:pointer;font-family:inherit;">No, otra persona</button>
          </div>
        </div>
        <div id="toggleReceptor">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text-dim);">
            <input type="checkbox" id="chkReceptor" onchange="toggleReceptorFields()">
            Entregar a otra persona
          </label>
        </div>
        <div id="camposReceptor" style="display:none;flex-direction:column;gap:8px;">
          <div>
            <label>Nombre de quien recibe *</label>
            <input id="receptorNombre" type="text" placeholder="Nombre de quien recibe">
          </div>
          <div>
            <label>Teléfono de quien recibe</label>
            <input id="receptorTel" type="tel" placeholder="Teléfono de quien recibe">
          </div>
        </div>
      </div>
    </div>

    <!-- Dirección (solo delivery) -->
    <div id="secDireccion">
      <div class="sec-title">Dirección de entrega</div>
      <div class="field-group">
        <div style="position:relative;">
          <label>Dirección *</label>
          <input id="fDir" type="text" placeholder="Av. Principal 1234"
                 oninput="onDirInput(this.value)" autocomplete="off">
          <div id="dirAutocomplete"
               style="display:none;position:absolute;top:100%;left:0;right:0;
                      background:var(--card2);border:1px solid var(--border);
                      border-radius:7px;max-height:180px;overflow-y:auto;
                      z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.3);"></div>
        </div>
        <div id="alertaDireccion"
             style="display:none;background:rgba(239,68,68,.1);
                    border:1px solid rgba(239,68,68,.4);border-radius:7px;
                    padding:7px 10px;font-size:12px;color:var(--red);
                    margin-top:4px;line-height:1.7;"></div>
        <div class="field-row">
          <div>
            <label>Depto / Piso</label>
            <input id="fDepto" type="text" placeholder="Depto 302">
          </div>
          <div>
            <label>Referencia</label>
            <input id="fRef" type="text" placeholder="Portón verde">
          </div>
        </div>
        <input id="fComuna" type="hidden">
      </div>
    </div>

    <!-- Productos -->
    <div>
      <div class="sec-title">Productos</div>
      <div id="prodSearch">
        <input id="prodInput" type="text" placeholder="🔍 Buscar producto..."
               oninput="onProdInput(this.value)" autocomplete="off">
        <div id="prodResultados"></div>
      </div>
      <div id="variantesPicker">
        <div class="vp-title" id="vpTitulo"></div>
        <div id="variantesGrid2"></div>
      </div>
      <div id="carritoLista" style="margin-top:8px"></div>
    </div>

    <!-- Notas y pago -->
    <div>
      <label>Notas del pedido</label>
      <textarea id="fNotas" placeholder="Ej: sin wasabi, tocar timbre, etc."></textarea>
    </div>
    <div>
      <label>Método de pago</label>
      <select id="fPago">
        <option value="efectivo">💵 Efectivo</option>
        <option value="tarjeta">💳 Tarjeta</option>
        <option value="transferencia">🏦 Transferencia</option>
        <option value="debito">💳 Débito</option>
      </select>
    </div>

    <!-- Total + submit -->
    <div id="totalBar">
      <span class="total-label">Total</span>
      <span class="total-val" id="totalVal">$0</span>
    </div>
    <button id="btnConfirmar" onclick="confirmarPedido()" disabled>
      ✅ Confirmar Pedido
    </button>

  </div>

  <!-- RIGHT: Cola -->
  <div id="panelCola">
    <div id="colaHeader">
      <h2>Cola de Pedidos</h2>
      <button style="margin-left:auto;background:var(--card);border:1px solid var(--border);
                     color:var(--text-dim);border-radius:6px;padding:4px 10px;
                     font-size:11px;cursor:pointer" onclick="cargarCola()">↻ Refrescar</button>
    </div>
    <div class="filter-pills">
      <button class="pill active" data-f="activos" onclick="setFiltro('activos',this)">Activos</button>
      <button class="pill" data-f="nuevo" onclick="setFiltro('nuevo',this)">Nuevo</button>
      <button class="pill" data-f="preparando" onclick="setFiltro('preparando',this)">Preparando</button>
      <button class="pill" data-f="listo" onclick="setFiltro('listo',this)">Listo</button>
      <button class="pill" data-f="todos" onclick="setFiltro('todos',this)">Todos</button>
    </div>
    <div id="colaCards"></div>
  </div>

</div>

<!-- Modal QR -->
<div id="modalQR" onclick="cerrarQR()">
  <div class="modal-qr-box" onclick="event.stopPropagation()">
    <h3>🗺 Ruta de Entrega</h3>
    <img id="qrImg" src="" alt="QR Maps">
    <div class="dir-text" id="qrDirText"></div>
    <a id="qrMapsLink" href="#" target="_blank" rel="noopener">Abrir en Google Maps ↗</a>
    <button class="close-btn" onclick="cerrarQR()">Cerrar</button>
  </div>
</div>

<!-- Print zone -->
<div id="printZone"></div>

<script>
// ─── State ───────────────────────────────────────────────
let pedidoTipo  = 'delivery';
let carrito     = [];
let cfgComuna   = '';       // [{producto_id, variante_id, nombre, cantidad, precio, subtotal, notas}]
let clienteActual = null;
let todosProd   = [];
let colaFiltro  = 'activos';
let allPedidos  = [];
let prodPendiente = null;   // producto esperando selección de variante
let _telTimer   = null;
let _prodTimer  = null;

// ─── Helpers ─────────────────────────────────────────────
const fmt = n => '$' + Math.round(n).toLocaleString('es-CL');

async function apiFetch(url, opts = {}) {
  try {
    const r = await fetch(url, {
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
      ...opts,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    return r.ok ? r.json() : null;
  } catch { return null; }
}

// ─── Init ────────────────────────────────────────────────
async function init() {
  todosProd = await apiFetch('/api/productos/completos') || [];
  const cfg = await apiFetch('/api/config') || {};
  cfgComuna = cfg.comuna_negocio || '';
  await cargarCola();
  setInterval(cargarCola, 15000);
}

// ─── Tipo selector ───────────────────────────────────────
function setTipo(t) {
  pedidoTipo = t;
  document.querySelectorAll('.tipo-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tipo === t);
  });
  const showCliente  = t !== 'local';
  const showDir      = t === 'delivery';
  document.getElementById('secCliente').style.display   = showCliente ? '' : 'none';
  document.getElementById('secDireccion').style.display = showDir ? '' : 'none';
  validarForm();
}

// ─── Phone search ────────────────────────────────────────
function onTelInput(val) {
  clearTimeout(_telTimer);
  if (val.length < 7) { limpiarClienteBadge(); return; }
  _telTimer = setTimeout(() => buscarCliente(val), 400);
}

async function buscarCliente(tel) {
  const cl = await apiFetch(`/api/clientes/buscar?tel=${encodeURIComponent(tel)}`);
  if (cl && cl.id) {
    clienteActual = cl;
    document.getElementById('fNombre').value  = cl.nombre || '';
    document.getElementById('fTel2').value    = cl.telefono2 || '';
    document.getElementById('fEmail').value   = cl.email || '';
    document.getElementById('fDir').value     = cl.direccion || '';
    document.getElementById('fDepto').value   = cl.depto || '';
    document.getElementById('fComuna').value  = cl.comuna || '';
    const badge = document.getElementById('clienteBadge');
    badge.style.display = '';
    badge.className = '';
    badge.textContent = `✓ Cliente conocido — ${cl.total_pedidos} pedidos anteriores`;
    if (cl.receptores_frecuentes && cl.receptores_frecuentes.length > 0) {
      mostrarSugerenciaReceptor(cl.receptores_frecuentes[0]);
    } else {
      document.getElementById('receptorSugerencia').style.display = 'none';
    }
  } else {
    clienteActual = null;
    limpiarClienteBadge(true);
    document.getElementById('receptorSugerencia').style.display = 'none';
  }
  validarForm();
}

let _receptorSugerido = null;

function toggleReceptorFields() {
  const chk = document.getElementById('chkReceptor');
  const campos = document.getElementById('camposReceptor');
  campos.style.display = chk.checked ? 'flex' : 'none';
  if (chk.checked) document.getElementById('receptorNombre').focus();
}

function mostrarSugerenciaReceptor(rf) {
  _receptorSugerido = rf;
  const veces = rf.veces === 1 ? 'la última vez' : `las últimas ${rf.veces} veces`;
  document.getElementById('receptorSugerenciaTexto').textContent =
    `¿Entregamos a ${rf.nombre} como ${veces}?`;
  document.getElementById('receptorSugerencia').style.display = '';
}

function aceptarReceptorSugerido() {
  if (!_receptorSugerido) return;
  document.getElementById('chkReceptor').checked = true;
  toggleReceptorFields();
  document.getElementById('receptorNombre').value = _receptorSugerido.nombre;
  document.getElementById('receptorTel').value    = _receptorSugerido.tel || '';
  document.getElementById('receptorSugerencia').style.display = 'none';
  _receptorSugerido = null;
}

function rechazarReceptorSugerido() {
  document.getElementById('receptorSugerencia').style.display = 'none';
  _receptorSugerido = null;
  document.getElementById('chkReceptor').checked = true;
  toggleReceptorFields();
}

// ─── Autocomplete + validación de dirección ──────────────────────────────────
let _dirTimer = null;

function onDirInput(val) {
  clearTimeout(_dirTimer);
  document.getElementById('alertaDireccion').style.display = 'none';
  document.getElementById('fDir').style.borderColor = '';
  if (!val || val.length < 3) {
    document.getElementById('dirAutocomplete').style.display = 'none';
    return;
  }
  _dirTimer = setTimeout(() => _buscarDirecciones(val), 320);
}

async function _buscarDirecciones(q) {
  const comuna = document.getElementById('fComuna').value.trim() || cfgComuna;
  const params = new URLSearchParams({q});
  if (comuna) params.set('comuna', comuna);
  const results = await apiFetch(`/api/direcciones/buscar?${params}`) || [];
  const ac = document.getElementById('dirAutocomplete');
  if (!results.length) { ac.style.display = 'none'; return; }
  ac.innerHTML = results.map(r => {
    const c = r.calle.replace(/'/g, "\\'");
    const com = (r.comuna || '').replace(/'/g, "\\'");
    return `<div class="prod-result-item" onclick="seleccionarDir('${c}','${com}')">
      <span class="pname">${r.calle}</span>
      <span class="pprice">${r.comuna || ''}${r.fuente==='nominatim' ? ' 🌐' : ''}</span>
    </div>`;
  }).join('');
  ac.style.display = '';
}

function seleccionarDir(calle, comuna) {
  document.getElementById('fDir').value = calle;
  document.getElementById('dirAutocomplete').style.display = 'none';
  document.getElementById('alertaDireccion').style.display = 'none';
  document.getElementById('fDir').style.borderColor = 'var(--green)';
  if (comuna && !document.getElementById('fComuna').value.trim()) {
    document.getElementById('fComuna').value = comuna;
  }
  validarForm();
}

function usarSugerenciaDir(calle) {
  document.getElementById('fDir').value = calle;
  document.getElementById('alertaDireccion').style.display = 'none';
  document.getElementById('fDir').style.borderColor = 'var(--green)';
  validarForm();
}

function limpiarClienteBadge(nuevo = false) {
  const badge = document.getElementById('clienteBadge');
  if (nuevo) {
    badge.style.display = '';
    badge.className = 'nuevo';
    badge.textContent = '+ Nuevo cliente';
  } else {
    badge.style.display = 'none';
  }
}

// ─── Product search ──────────────────────────────────────
function onProdInput(val) {
  clearTimeout(_prodTimer);
  cerrarVariantes();
  if (!val.trim()) { document.getElementById('prodResultados').style.display = 'none'; return; }
  _prodTimer = setTimeout(() => mostrarResultados(val), 180);
}

function mostrarResultados(q) {
  const lower = q.toLowerCase();
  const matches = todosProd.filter(p =>
    p.nombre.toLowerCase().includes(lower) && p.stock > 0 || p.tiene_variantes
  ).slice(0, 10);

  const box = document.getElementById('prodResultados');
  if (!matches.length) { box.style.display = 'none'; return; }

  box.innerHTML = matches.map(p => {
    const varHint = p.tiene_variantes && p._variantes && p._variantes.length
      ? `<span class="variantes-hint">${p._variantes.length} variantes</span>` : '';
    return `<div class="prod-result-item" onclick="seleccionarProd(${p.id})">
      <div>
        <div class="pname">${p.nombre}</div>
        ${varHint}
      </div>
      <span class="pprice">${fmt(p.precio)}</span>
    </div>`;
  }).join('');
  box.style.display = '';
}

function seleccionarProd(id) {
  const prod = todosProd.find(p => p.id === id);
  if (!prod) return;
  document.getElementById('prodResultados').style.display = 'none';
  document.getElementById('prodInput').value = '';

  if (prod.tiene_variantes && prod._variantes && prod._variantes.length > 1) {
    prodPendiente = prod;
    mostrarVariantesPicker(prod);
  } else {
    agregarAlCarrito(prod, prod._variantes && prod._variantes.length ? prod._variantes[0] : null);
  }
}

function mostrarVariantesPicker(prod) {
  const picker = document.getElementById('variantesPicker');
  document.getElementById('vpTitulo').textContent = `Elige variante de ${prod.nombre}:`;
  const grid = document.getElementById('variantesGrid2');
  grid.innerHTML = prod._variantes.map(v => `
    <button class="vp-btn" onclick="seleccionarVariante(${v.id})"
            ${v.stock <= 0 ? 'disabled style="opacity:.4"' : ''}>
      ${v.nombre}<br><small style="color:var(--text-dim)">${fmt(v.precio)}</small>
    </button>`).join('');
  picker.style.display = 'flex';
}

function seleccionarVariante(vid) {
  if (!prodPendiente) return;
  const v = prodPendiente._variantes.find(x => x.id === vid);
  if (!v) return;
  agregarAlCarrito(prodPendiente, v);
  cerrarVariantes();
}

function cerrarVariantes() {
  prodPendiente = null;
  document.getElementById('variantesPicker').style.display = 'none';
}

function agregarAlCarrito(prod, variante) {
  const nombre = variante ? `${prod.nombre} — ${variante.nombre}` : prod.nombre;
  const precio = variante ? variante.precio : prod.precio;
  const existing = carrito.find(i =>
    i.producto_id === prod.id && i.variante_id === (variante ? variante.id : null)
  );
  if (existing) {
    existing.cantidad++;
    existing.subtotal = existing.cantidad * existing.precio;
  } else {
    carrito.push({
      producto_id: prod.id,
      variante_id: variante ? variante.id : null,
      nombre, cantidad: 1, precio, subtotal: precio, notas: '',
    });
  }
  renderCarrito();
}

function renderCarrito() {
  const lista = document.getElementById('carritoLista');
  if (!carrito.length) {
    lista.innerHTML = '<div style="color:var(--text-dim);font-size:12px;padding:4px 0">Sin productos aún</div>';
    actualizarTotal();
    validarForm();
    return;
  }
  lista.innerHTML = carrito.map((item, i) => `
    <div class="carrito-item">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="ci-nombre">${item.nombre}</div>
          <div class="ci-precio">${fmt(item.subtotal)}</div>
          <div class="ci-qty">
            <button onclick="cambiarQty(${i},-1)">−</button>
            <span>${item.cantidad}</span>
            <button onclick="cambiarQty(${i},1)">+</button>
          </div>
          <button class="ci-del" onclick="quitarItem(${i})">×</button>
        </div>
        <input class="ci-notas-input" type="text"
               placeholder="Nota (ej: sin wasabi)"
               value="${item.notas || ''}"
               oninput="setNotaItem(${i}, this.value)">
      </div>
    </div>`).join('');
  actualizarTotal();
  validarForm();
}

function cambiarQty(i, delta) {
  carrito[i].cantidad = Math.max(1, carrito[i].cantidad + delta);
  carrito[i].subtotal = carrito[i].cantidad * carrito[i].precio;
  renderCarrito();
}

function quitarItem(i) {
  carrito.splice(i, 1);
  renderCarrito();
}

function setNotaItem(i, val) {
  carrito[i].notas = val;
}

function actualizarTotal() {
  const total = carrito.reduce((s, i) => s + i.subtotal, 0);
  document.getElementById('totalVal').textContent = fmt(total);
}

// ─── Validation ──────────────────────────────────────────
function validarForm() {
  let ok = carrito.length > 0;
  if (pedidoTipo !== 'local') {
    ok = ok && document.getElementById('fNombre').value.trim() !== '';
  }
  if (pedidoTipo === 'delivery') {
    ok = ok && document.getElementById('fDir').value.trim() !== '';
  }
  document.getElementById('btnConfirmar').disabled = !ok;
}

// ─── Confirm order ───────────────────────────────────────
async function confirmarPedido() {
  const nombre = document.getElementById('fNombre').value.trim();
  const payload = {
    tipo:           pedidoTipo,
    cliente_nombre: nombre || 'Local',
    cliente_tel:    document.getElementById('fTel').value.trim(),
    cliente_tel2:   document.getElementById('fTel2').value.trim(),
    cliente_email:  document.getElementById('fEmail').value.trim(),
    direccion:      document.getElementById('fDir').value.trim(),
    depto:          document.getElementById('fDepto').value.trim(),
    referencia:     document.getElementById('fRef').value.trim(),
    comuna:         document.getElementById('fComuna').value.trim() || cfgComuna,
    notas:          document.getElementById('fNotas').value.trim(),
    metodo_pago:    document.getElementById('fPago').value,
    receptor_nombre: document.getElementById('chkReceptor')?.checked
                       ? document.getElementById('receptorNombre').value.trim() || null
                       : null,
    receptor_tel:   document.getElementById('chkReceptor')?.checked
                       ? document.getElementById('receptorTel').value.trim() || null
                       : null,
    items: carrito.map(i => ({
      producto_id: i.producto_id,
      variante_id: i.variante_id,
      nombre:      i.nombre,
      cantidad:    i.cantidad,
      precio:      i.precio,
      subtotal:    i.subtotal,
      notas:       i.notas || null,
    })),
  };

  const btn = document.getElementById('btnConfirmar');
  btn.disabled = true;
  btn.textContent = 'Enviando…';

  const res = await apiFetch('/api/pedidos', { method: 'POST', body: payload });

  btn.disabled = false;
  btn.textContent = '✅ Confirmar Pedido';

  if (!res || !res.id) {
    alert('Error al crear el pedido. Intenta de nuevo.');
    return;
  }

  printComanda(res);
  limpiarForm();
  await cargarCola();
  if (window.innerWidth <= 720) showTab('cola');
}

function limpiarForm() {
  carrito = [];
  clienteActual = null;
  _receptorSugerido = null;
  ['fTel','fNombre','fTel2','fEmail','fDir','fDepto','fRef','fComuna','fNotas',
   'receptorNombre','receptorTel'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const chk = document.getElementById('chkReceptor');
  if (chk) { chk.checked = false; }
  document.getElementById('camposReceptor').style.display = 'none';
  document.getElementById('receptorSugerencia').style.display = 'none';
  document.getElementById('clienteBadge').style.display = 'none';
  document.getElementById('alertaDireccion').style.display = 'none';
  document.getElementById('fDir').style.borderColor = '';
  renderCarrito();
}

// ─── Cola ────────────────────────────────────────────────
function setFiltro(f, btn) {
  colaFiltro = f;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  renderCola();
}

async function cargarCola() {
  const data = await apiFetch('/api/pedidos?activos=1') || [];
  // Also fetch despachados for "todos" filter
  const todos = await apiFetch('/api/pedidos') || [];
  allPedidos = todos;
  const activos = data.length;
  document.getElementById('badgeActivos').textContent = activos;
  const tabBadge = document.getElementById('tabColaBadge');
  tabBadge.textContent = activos > 0 ? `(${activos})` : '';
  renderCola();
}

const TIPO_EMOJI = { delivery: '🛵', retiro: '🏠', local: '🪑' };
const ESTADO_LABEL = {
  nuevo: 'Nuevo', preparando: 'Preparando',
  listo: 'Listo', despachado: 'Despachado', cancelado: 'Cancelado',
};

function tiempoDesde(iso) {
  const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (diff < 60)  return `${diff}s`;
  if (diff < 3600) return `${Math.floor(diff/60)}m`;
  return `${Math.floor(diff/3600)}h`;
}

function renderCola() {
  let lista = allPedidos;
  if (colaFiltro === 'activos') {
    lista = allPedidos.filter(p => !['despachado','cancelado'].includes(p.estado));
  } else if (colaFiltro !== 'todos') {
    lista = allPedidos.filter(p => p.estado === colaFiltro);
  }

  const box = document.getElementById('colaCards');
  if (!lista.length) {
    box.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:20px;text-align:center">
      ${colaFiltro === 'activos' ? 'Sin pedidos activos' : 'Sin pedidos'}</div>`;
    return;
  }

  box.innerHTML = lista.map(p => {
    const items = p.items || [];
    const resumen = items.slice(0,2).map(i => `${i.cantidad}× ${i.nombre}`).join(', ')
      + (items.length > 2 ? ` y ${items.length - 2} más` : '');

    const notasItems = items.filter(i => i.notas).map(i => `⚠️ ${i.nombre}: ${i.notas}`).join(' | ');

    const acciones = buildAcciones(p);
    return `
    <div class="pedido-card estado-${p.estado}">
      <div class="pc-top">
        <span class="pc-num">#${String(p.numero).padStart(3,'0')}</span>
        <span class="pc-tipo">${TIPO_EMOJI[p.tipo] || ''}</span>
        <span class="estado-badge estado-${p.estado}">${ESTADO_LABEL[p.estado]}</span>
        <span class="pc-time">hace ${tiempoDesde(p.creado_en)}</span>
      </div>
      <div class="pc-cliente">${p.cliente_nombre}</div>
      ${p.tipo === 'delivery' && p.direccion ? `<div style="font-size:11px;color:var(--text-dim)">📍 ${p.direccion}${p.depto ? ', '+p.depto : ''}</div>` : ''}
      <div class="pc-items">${resumen}</div>
      ${notasItems ? `<div class="pc-notas">${notasItems}</div>` : ''}
      ${p.notas ? `<div class="pc-notas">📝 ${p.notas}</div>` : ''}
      <div style="font-size:12px;color:var(--text-dim)">${fmt(p.total)} · ${p.metodo_pago}</div>
      <div class="pc-actions">${acciones}</div>
    </div>`;
  }).join('');
}

function buildAcciones(p) {
  let html = '';
  if (p.estado === 'nuevo') {
    html += `<button class="btn-primary" onclick="cambiarEstado(${p.id},'preparando')">🍳 Preparar</button>`;
  }
  if (p.estado === 'preparando') {
    html += `<button class="btn-primary" onclick="cambiarEstado(${p.id},'listo')">✅ Listo</button>`;
  }
  if (p.estado === 'listo') {
    const label = p.tipo === 'retiro' ? '📦 Entregar' : '🛵 Despachar';
    html += `<button class="btn-primary" onclick="cambiarEstado(${p.id},'despachado')">${label}</button>`;
  }
  html += `<button onclick="printComandaById(${p.id})">🖨 Comanda</button>`;
  if (p.tipo === 'delivery' && p.direccion) {
    html += `<button onclick="verRuta(${p.id})">🗺 Ruta</button>`;
  }
  if (!['despachado','cancelado'].includes(p.estado)) {
    html += `<button class="btn-danger" onclick="cancelarPedido(${p.id})">❌</button>`;
  }
  return html;
}

async function cambiarEstado(id, estado) {
  await apiFetch(`/api/pedidos/${id}/estado`, { method: 'PUT', body: { estado } });
  if (estado === 'listo') {
    const p = allPedidos.find(x => x.id === id);
    if (p) printTicket(p);
  }
  await cargarCola();
}

async function cancelarPedido(id) {
  if (!confirm('¿Cancelar este pedido?')) return;
  await apiFetch(`/api/pedidos/${id}`, { method: 'DELETE' });
  await cargarCola();
}

// ─── QR Ruta ─────────────────────────────────────────────
async function verRuta(id) {
  const data = await apiFetch(`/api/pedidos/${id}/qr-ruta`);
  if (!data) { alert('Sin dirección registrada'); return; }
  const modal = document.getElementById('modalQR');
  document.getElementById('qrDirText').textContent = data.direccion || '';
  document.getElementById('qrMapsLink').href = data.maps_url || '#';
  if (data.qr_base64) {
    document.getElementById('qrImg').src = `data:image/png;base64,${data.qr_base64}`;
    document.getElementById('qrImg').style.display = '';
  } else {
    document.getElementById('qrImg').style.display = 'none';
  }
  modal.classList.add('active');
}

function cerrarQR() {
  document.getElementById('modalQR').classList.remove('active');
}

// ─── Print ───────────────────────────────────────────────
function buildComandaHTML(p) {
  const hora = new Date(p.creado_en || Date.now()).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  const tipoLabel = p.tipo === 'delivery' ? 'DELIVERY' : p.tipo === 'retiro' ? 'RETIRO' : 'LOCAL';
  const emoji = TIPO_EMOJI[p.tipo] || '';
  let html = `
    <div class="print-center print-big">🍳 COCINA — ${tipoLabel} #${String(p.numero).padStart(3,'0')}</div>
    <div class="print-center print-line">${hora}</div>
    <div class="print-sep"></div>`;
  (p.items || []).forEach(i => {
    html += `<div class="print-line print-bold">${i.cantidad}× ${i.nombre}</div>`;
    if (i.notas) html += `<div class="print-line print-nota">&nbsp;&nbsp;⚠️ ${i.notas}</div>`;
  });
  html += `<div class="print-sep"></div>`;
  if (p.tipo !== 'local') {
    html += `<div class="print-line print-bold">${tipoLabel} → ${p.cliente_nombre}</div>`;
    if (p.cliente_tel) html += `<div class="print-line">📱 ${p.cliente_tel}</div>`;
    if (p.direccion) {
      html += `<div class="print-line">📍 ${p.direccion}</div>`;
      if (p.depto)     html += `<div class="print-line">&nbsp;&nbsp;${p.depto}</div>`;
      if (p.referencia) html += `<div class="print-line">Ref: ${p.referencia}</div>`;
    }
  }
  if (p.notas) html += `<div class="print-line print-nota">📝 ${p.notas}</div>`;
  html += `<div class="print-sep"></div>`;
  return html;
}

function printComanda(p) {
  document.getElementById('printZone').innerHTML = buildComandaHTML(p);
  window.print();
}

async function printComandaById(id) {
  const p = allPedidos.find(x => x.id === id);
  if (p) printComanda(p);
}

function printTicket(p) {
  const hora = new Date(p.creado_en || Date.now()).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  const tipoLabel = p.tipo === 'delivery' ? '🛵 DELIVERY' : p.tipo === 'retiro' ? '🏠 RETIRO' : '🪑 LOCAL';
  let html = `
    <div class="print-center print-big">Pedido #${String(p.numero).padStart(3,'0')}</div>
    <div class="print-center print-line">${tipoLabel} — ${hora}</div>
    <div class="print-sep"></div>`;
  (p.items || []).forEach(i => {
    html += `<div class="print-line">${i.cantidad}× ${i.nombre} — ${fmt(i.subtotal)}</div>`;
    if (i.notas) html += `<div class="print-line print-nota">&nbsp;&nbsp;⚠️ ${i.notas}</div>`;
  });
  html += `<div class="print-sep"></div>
    <div class="print-line print-bold">TOTAL: ${fmt(p.total)}</div>
    <div class="print-line">Pago: ${p.metodo_pago}</div>`;
  if (p.tipo !== 'local' && p.cliente_nombre) {
    html += `<div class="print-sep"></div>
      <div class="print-line print-bold">${p.cliente_nombre}</div>`;
    if (p.cliente_tel) html += `<div class="print-line">📱 ${p.cliente_tel}</div>`;
    if (p.tipo === 'delivery' && p.direccion) {
      html += `<div class="print-line">📍 ${p.direccion}</div>`;
      if (p.depto) html += `<div class="print-line">&nbsp;&nbsp;${p.depto}</div>`;
      if (p.referencia) html += `<div class="print-line">Ref: ${p.referencia}</div>`;
    }
  }
  if (p.notas) html += `<div class="print-sep"></div><div class="print-line print-nota">📝 ${p.notas}</div>`;
  html += `<div class="print-sep"></div>
    <div class="print-center print-line" style="font-size:11px">ZERO POS — Sin internet. Sin comisiones.</div>`;
  document.getElementById('printZone').innerHTML = html;
  window.print();
}

// ─── Mobile tabs ─────────────────────────────────────────
function showTab(tab) {
  const form = document.getElementById('panelForm');
  const cola = document.getElementById('panelCola');
  const tabs = document.querySelectorAll('#tabs button');
  if (tab === 'form') {
    form.classList.remove('tab-hidden');
    cola.classList.add('tab-hidden');
    tabs[0].classList.add('active');
    tabs[1].classList.remove('active');
  } else {
    form.classList.add('tab-hidden');
    cola.classList.remove('tab-hidden');
    tabs[0].classList.remove('active');
    tabs[1].classList.add('active');
  }
}

// ─── Keyboard ────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('prodResultados').style.display = 'none';
    cerrarVariantes();
    cerrarQR();
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('#prodSearch')) {
    document.getElementById('prodResultados').style.display = 'none';
  }
});

['fNombre','fDir'].forEach(id => {
  document.getElementById(id).addEventListener('input', validarForm);
});

document.getElementById('fDir').addEventListener('blur', async () => {
  setTimeout(() => {
    document.getElementById('dirAutocomplete').style.display = 'none';
  }, 200);
  const calle = document.getElementById('fDir').value.trim();
  const comuna = document.getElementById('fComuna').value.trim() || cfgComuna;
  if (!calle || calle.length < 4) return;
  const res = await apiFetch('/api/direcciones/validar', {
    method: 'POST', body: {calle, comuna}
  });
  if (!res) return;
  const alertaEl = document.getElementById('alertaDireccion');
  if (res.valida) {
    alertaEl.style.display = 'none';
    document.getElementById('fDir').style.borderColor = 'var(--green)';
    if (res.nombre_oficial && res.nombre_oficial !== calle) {
      document.getElementById('fDir').value = res.nombre_oficial;
    }
    if (res.alerta) {
      alertaEl.innerHTML = `ℹ️ ${res.alerta}`;
      alertaEl.style.background = 'rgba(99,102,241,.1)';
      alertaEl.style.borderColor = 'rgba(99,102,241,.3)';
      alertaEl.style.color = 'var(--accent2)';
      alertaEl.style.display = '';
    }
  } else {
    document.getElementById('fDir').style.borderColor = 'var(--red)';
    if (res.sugerencias?.length) {
      const btns = res.sugerencias.map(s => {
        const esc = s.replace(/'/g, "\\'");
        return `<button onclick="usarSugerenciaDir('${esc}')"
                  style="margin:2px 4px 2px 0;background:rgba(239,68,68,.15);
                         border:1px solid rgba(239,68,68,.4);border-radius:5px;
                         padding:2px 8px;font-size:11px;cursor:pointer;
                         color:var(--red);font-family:inherit;">${s}</button>`;
      }).join('');
      alertaEl.innerHTML = `⚠️ ${res.alerta}<br>${btns}`;
    } else {
      alertaEl.innerHTML = `⚠️ ${res.alerta || ''}`;
    }
    alertaEl.style.background = 'rgba(239,68,68,.1)';
    alertaEl.style.borderColor = 'rgba(239,68,68,.4)';
    alertaEl.style.color = 'var(--red)';
    if (res.alerta) alertaEl.style.display = '';
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('#fDir') && !e.target.closest('#dirAutocomplete')) {
    document.getElementById('dirAutocomplete').style.display = 'none';
  }
});

// ─── Start ───────────────────────────────────────────────
init();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', {scope: '/'})
      .catch(err => console.log('SW error:', err));
  });
}
</script>
