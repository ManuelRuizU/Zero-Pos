<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#22c55e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO POS — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<!-- ── Pantalla 1: usuarios ─────────────────────────────────── -->
<div id="pantallaUsuarios">
  <div class="logo-top">ZERO<span class="pos">POS</span></div>
  <div class="login-subtitle">¿Quién eres?</div>
  <div class="usuarios-grid" id="usuariosGrid"></div>
  <p class="pin-footer">ZERO POS v1.0</p>
</div>

<!-- ── Pantalla 2: PIN ──────────────────────────────────────── -->
<div id="pantallaPin">
  <div class="login-wrapper" id="loginWrapper">
    <div class="logo-top">ZERO<span class="pos">POS</span></div>

    <div class="avatar-usuario" id="pinAvatar"></div>
    <div id="pinNombreUsuario">Introduce tu PIN</div>
    <div id="pinSubtitulo">4 dígitos</div>

    <!-- Selector modo acceso -->
    <div class="modo-grid" style="margin-top:16px">
      <button class="btn-modo activo" id="btnModoEntrada"          onclick="seleccionarModo('entrada')">ABRIR TURNO</button>
      <button class="btn-modo"        id="btnModoSalida"           onclick="seleccionarModo('salida')">CERRAR TURNO</button>
      <button class="btn-modo"        id="btnModoSalidaColacion"   onclick="seleccionarModo('salida_colacion')">IR A COLACIÓN</button>
      <button class="btn-modo"        id="btnModoEntradaColacion"  onclick="seleccionarModo('entrada_colacion')">VOLVER DE COLACIÓN</button>
    </div>

    <div class="pin-circulos">
      <div class="circulo-pin" id="pc0"></div>
      <div class="circulo-pin" id="pc1"></div>
      <div class="circulo-pin" id="pc2"></div>
      <div class="circulo-pin" id="pc3"></div>
    </div>

    <div class="teclado-pin">
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('1')">1</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('2')">2</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('3')">3</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('4')">4</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('5')">5</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('6')">6</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('7')">7</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('8')">8</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('9')">9</button>
      <div></div>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('0')">0</button>
      <button class="btn-pin btn-borrar" onclick="crearRipple(this,event);borrarPin()">⌫</button>
      <button class="btn-pin btn-volver" onclick="volverUsuarios()">← Cambiar usuario</button>
    </div>

    <div id="pinError"></div>
  </div>
</div>

<!-- ── Pantalla: ENTRADA ────────────────────────────────────── -->
<div id="pantallaEntrada" class="pantalla-post">
  <div class="post-logo-txt">ZERO<span>POS</span></div>
  <div id="entradaSubtitulo" class="post-sub-lbl">Bienvenido/a</div>
  <div id="entradaNombre" class="post-nombre-grande"></div>
  <div id="entradaHora" class="post-hora"></div>
  <div id="entradaHorasSemana" class="post-semana-txt"></div>
  <button onclick="location.href='pos.html'" class="btn-post-ir">IR A LA CAJA</button>
</div>

<!-- ── Pantalla: SALIDA ─────────────────────────────────────── -->
<div id="pantallaSalida" class="pantalla-post">
  <div class="post-emoji">🌙</div>
  <div class="post-sub-lbl">Hasta mañana</div>
  <div id="salidaNombre" class="post-nombre-grande"></div>
  <div id="salidaHora" class="post-hora"></div>
  <div id="salidaResumen" class="post-resumen-txt"></div>
  <div class="post-buenas-txt">Buenas noches 👋</div>
  <button onclick="location.href='login.html'" class="btn-post-cerrar">CERRAR</button>
</div>

<!-- ── Pantalla: SALIDA COLACIÓN ────────────────────────────── -->
<div id="pantallaSalidaColacion" class="pantalla-post">
  <div class="post-emoji">☕</div>
  <div id="salidaColNombre" class="post-nombre-med"></div>
  <div class="post-sub-colacion">Buen provecho</div>
  <div id="salidaColHora" class="post-hora-warn"></div>
  <div class="post-sub-sm">Recuerda regresar en 30–60 minutos</div>
  <button onclick="location.href='login.html'" class="btn-post-cerrar">CERRAR</button>
</div>

<!-- ── Pantalla: ENTRADA COLACIÓN ───────────────────────────── -->
<div id="pantallaEntradaColacion" class="pantalla-post">
  <div class="post-emoji">👋</div>
  <div id="entradaColNombre" class="post-nombre-med"></div>
  <div class="post-sub-colacion">Bienvenido de vuelta</div>
  <div id="entradaColMinutos" class="post-minutos-warn"></div>
  <div id="entradaColHora" class="post-hora-ok"></div>
  <button onclick="location.href='pos.html'" class="btn-post-ir">IR A LA CAJA</button>
</div>

<!-- ── Modal cambio PIN obligatorio ───────────────────────────── -->
<div id="modalCambioPin" class="modal-cambio-pin-overlay">
  <div class="modal-cambio-pin-box">
    <div class="modal-cambio-pin-icon">⚠️</div>
    <div class="modal-cambio-pin-titulo">Cambia tu PIN</div>
    <div class="modal-cambio-pin-sub">Por seguridad debes establecer un PIN personal antes de continuar</div>
    <input id="inputPinNuevo" type="password" inputmode="numeric"
      maxlength="4" placeholder="Nuevo PIN (4 dígitos)"
      class="modal-cambio-pin-input">
    <input id="inputPinConfirmar" type="password" inputmode="numeric"
      maxlength="4" placeholder="Confirmar PIN"
      class="modal-cambio-pin-input">
    <div id="modalCambioPinError"></div>
    <button onclick="_guardarPinNuevo()" class="modal-cambio-pin-btn">Guardar PIN</button>
  </div>
</div>


<script src="/static/js/login.js"></script>
</body>
</html>
