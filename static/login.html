<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO POS — Acceso</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  background: #0f0f1a;
  background-image:
    radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.1) 0%, transparent 50%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ── Logo ────────────────────────────────────────────────── */
.logo-top {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -1.5px;
  color: white;
  margin-bottom: 32px;
  text-align: center;
}
.logo-top .pos { color: #6366f1; }

/* ── Pantalla 1: selección de usuario ───────────────────────── */
#pantallaUsuarios {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity .25s;
}
.login-subtitle {
  color: #64748b; font-size: 14px; margin-bottom: 40px;
}
.usuarios-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 16px;
  width: min(480px, 90vw);
  max-height: 60vh;
  overflow-y: auto;
}
.usuario-card {
  display: flex; flex-direction: column;
  align-items: center; gap: 10px;
  padding: 24px 12px 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  cursor: pointer;
  transition: all .15s;
  user-select: none;
}
.usuario-card:active  { transform: scale(.96); }
.usuario-card:hover   { border-color: rgba(99,102,241,0.5); background: rgba(99,102,241,0.1); }
.usuario-avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: #fff;
}
.usuario-nombre {
  font-size: 14px; font-weight: 600; color: #e2e8f0;
  text-align: center; word-break: break-word;
}
.usuario-rol {
  font-size: 11px; color: #64748b; text-transform: capitalize;
}

/* ── Pantalla 2: teclado PIN ────────────────────────────────── */
#pantallaPin {
  position: fixed; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
}
#pantallaPin.activa { display: flex; }

.login-wrapper {
  display: flex; flex-direction: column;
  align-items: center;
}
.login-wrapper.error {
  animation: shakeScreen 0.4s ease;
}
@keyframes shakeScreen {
  0%,100% { transform: translateX(0) }
  25%      { transform: translateX(-10px) }
  75%      { transform: translateX(10px) }
}

/* Avatar con glow */
.avatar-usuario {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: 700;
  color: white;
  margin: 0 auto 12px;
  box-shadow:
    0 0 0 3px rgba(99,102,241,0.2),
    0 0 30px rgba(99,102,241,0.35);
}

#pinNombreUsuario {
  color: #e2e8f0; font-size: 18px; font-weight: 600;
  margin-bottom: 4px;
}
#pinSubtitulo {
  color: #64748b; font-size: 13px; margin-bottom: 32px;
}

/* PIN dots */
.pin-circulos {
  display: flex; gap: 18px; margin-bottom: 40px;
}
.circulo-pin {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(99,102,241,0.5);
  background: transparent;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.circulo-pin.activo {
  background: #6366f1;
  border-color: #6366f1;
  box-shadow: 0 0 12px rgba(99,102,241,0.8);
  transform: scale(1.2);
}
.circulo-pin.correcto {
  background: #22c55e;
  border-color: #22c55e;
  box-shadow: 0 0 12px rgba(34,197,94,0.8);
  transform: scale(1.2);
}
.circulo-pin.error {
  background: #ef4444;
  border-color: #ef4444;
  box-shadow: 0 0 12px rgba(239,68,68,0.8);
  animation: shakeDot 0.4s ease;
}
@keyframes shakeDot {
  0%,100% { transform: translateX(0) }
  20%      { transform: translateX(-6px) }
  40%      { transform: translateX(6px) }
  60%      { transform: translateX(-4px) }
  80%      { transform: translateX(4px) }
}

/* Teclado PIN — Liquid Glass */
.teclado-pin {
  display: grid;
  grid-template-columns: repeat(3, 82px);
  gap: 14px;
  width: fit-content;
}
.btn-pin {
  width: 82px;
  height: 82px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 26px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.2),
    inset 0 -1px 0 rgba(0,0,0,0.3),
    0 4px 16px rgba(0,0,0,0.4);
  color: white;
  font-size: 28px;
  font-weight: 300;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.btn-pin::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%);
  border-radius: 26px 26px 0 0;
  pointer-events: none;
}
.btn-pin::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15) 0%, transparent 60%);
  pointer-events: none;
}
.btn-pin:hover {
  transform: scale(1.06) translateY(-2px);
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.25);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.3),
    inset 0 -1px 0 rgba(0,0,0,0.3),
    0 8px 24px rgba(99,102,241,0.3),
    0 0 0 1px rgba(99,102,241,0.2);
}
.btn-pin:active {
  transform: scale(0.92) translateY(1px);
  background: rgba(99,102,241,0.2);
  border-color: rgba(99,102,241,0.4);
  box-shadow:
    inset 0 2px 6px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.05),
    0 2px 8px rgba(0,0,0,0.3);
}
.btn-pin .ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transform: scale(0);
  animation: rippleAnim 0.4s ease-out;
  pointer-events: none;
}
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}

.btn-borrar {
  font-size: 24px;
  color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.03);
}

/* Cambiar usuario — ghost sutil */
.btn-volver {
  width: auto;
  height: auto;
  grid-column: 1 / -1;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  color: rgba(255,255,255,0.4);
  padding: 8px 20px;
  font-size: 13px;
  font-weight: 400;
  cursor: pointer;
  margin-top: 4px;
  transition: all 0.2s;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow: none;
}
.btn-volver::before,
.btn-volver::after { content: none; }
.btn-volver:hover {
  border-color: rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.7);
  transform: none;
  background: transparent;
  box-shadow: none;
}
.btn-volver:active {
  transform: none;
  background: rgba(255,255,255,0.05);
  border-color: rgba(255,255,255,0.15);
  box-shadow: none;
}

#pinError {
  height: 20px; font-size: 13px; color: #ef4444;
  margin-top: 16px; text-align: center;
}
.pin-footer {
  position: fixed; bottom: 16px;
  color: rgba(255,255,255,0.1); font-size: 11px;
}

/* ── Selector de modo acceso ───────────────────────────────── */
.modo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  width: min(280px, 90vw);
  margin-bottom: 24px;
}
.btn-modo {
  padding: 10px 6px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  color: rgba(255,255,255,0.6);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.btn-modo.activo {
  border-color: #22c55e;
  background: rgba(34,197,94,0.12);
  color: #22c55e;
}
.btn-modo:hover:not(.activo) {
  border-color: rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.8);
}

/* ── Pantallas post-login ──────────────────────────────────── */
.pantalla-post {
  position: fixed; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  background: #0f0f1a;
  z-index: 10;
}
.pantalla-post.activa { display: flex; }
.post-hora {
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
}
</style>
</head>
<body>

<!-- ── Pantalla 1: usuarios ─────────────────────────────────── -->
<div id="pantallaUsuarios">
  <div class="logo-top">ZERO<span class="pos">POS</span></div>
  <div class="login-subtitle">¿Quién eres?</div>
  <div class="usuarios-grid" id="usuariosGrid"></div>
  <p class="pin-footer">ZERO POS v1.0</p>
</div>

<!-- ── Pantalla 2: PIN ──────────────────────────────────────── -->
<div id="pantallaPin">
  <div class="login-wrapper" id="loginWrapper">
    <div class="logo-top">ZERO<span class="pos">POS</span></div>

    <div class="avatar-usuario" id="pinAvatar"></div>
    <div id="pinNombreUsuario">Introduce tu PIN</div>
    <div id="pinSubtitulo">4 dígitos</div>

    <!-- Selector modo acceso -->
    <div class="modo-grid" style="margin-top:16px">
      <button class="btn-modo activo" id="btnModoEntrada"          onclick="seleccionarModo('entrada')">ENTRADA</button>
      <button class="btn-modo"        id="btnModoSalida"           onclick="seleccionarModo('salida')">SALIDA</button>
      <button class="btn-modo"        id="btnModoSalidaColacion"   onclick="seleccionarModo('salida_colacion')">INICIO COLACIÓN</button>
      <button class="btn-modo"        id="btnModoEntradaColacion"  onclick="seleccionarModo('entrada_colacion')">FIN COLACIÓN</button>
    </div>

    <div class="pin-circulos">
      <div class="circulo-pin" id="pc0"></div>
      <div class="circulo-pin" id="pc1"></div>
      <div class="circulo-pin" id="pc2"></div>
      <div class="circulo-pin" id="pc3"></div>
    </div>

    <div class="teclado-pin">
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('1')">1</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('2')">2</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('3')">3</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('4')">4</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('5')">5</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('6')">6</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('7')">7</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('8')">8</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('9')">9</button>
      <div></div>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('0')">0</button>
      <button class="btn-pin btn-borrar" onclick="crearRipple(this,event);borrarPin()">⌫</button>
      <button class="btn-pin btn-volver" onclick="volverUsuarios()">← Cambiar usuario</button>
    </div>

    <div id="pinError"></div>
  </div>
</div>

<!-- ── Pantalla: ENTRADA ────────────────────────────────────── -->
<div id="pantallaEntrada" class="pantalla-post">
  <div style="font-size:28px;font-weight:900;letter-spacing:-1px;color:#fff;margin-bottom:32px">ZERO<span style="color:#6366f1">POS</span></div>
  <div style="font-size:15px;color:#64748b;margin-bottom:6px">Bienvenido/a</div>
  <div id="entradaNombre" style="font-size:32px;font-weight:700;color:#fff;margin-bottom:4px"></div>
  <div id="entradaHora" class="post-hora" style="font-size:56px;font-weight:200;color:#22c55e;margin-bottom:24px"></div>
  <div id="entradaHorasSemana" style="font-size:13px;color:#64748b;margin-bottom:32px"></div>
  <button onclick="location.href='pos.html'" style="background:#22c55e;border:none;color:#000;font-size:16px;font-weight:700;padding:16px 48px;border-radius:12px;cursor:pointer">IR A LA CAJA</button>
</div>

<!-- ── Pantalla: SALIDA ─────────────────────────────────────── -->
<div id="pantallaSalida" class="pantalla-post">
  <div style="font-size:64px;margin-bottom:16px">🌙</div>
  <div style="font-size:15px;color:#64748b">Hasta mañana</div>
  <div id="salidaNombre" style="font-size:32px;font-weight:700;color:#fff;margin-bottom:4px"></div>
  <div id="salidaHora" class="post-hora" style="font-size:48px;font-weight:200;color:#6366f1;margin-bottom:16px"></div>
  <div id="salidaResumen" style="font-size:14px;color:#64748b;margin-bottom:12px"></div>
  <div style="font-size:16px;color:#e2e8f0;margin-bottom:32px">Buenas noches 👋</div>
  <button onclick="location.href='login.html'" style="background:#1e1e2e;border:1px solid #2d2d5e;color:#e2e8f0;font-size:15px;font-weight:600;padding:14px 40px;border-radius:12px;cursor:pointer">CERRAR</button>
</div>

<!-- ── Pantalla: SALIDA COLACIÓN ────────────────────────────── -->
<div id="pantallaSalidaColacion" class="pantalla-post">
  <div style="font-size:64px;margin-bottom:16px">☕</div>
  <div id="salidaColNombre" style="font-size:28px;font-weight:700;color:#fff;margin-bottom:8px"></div>
  <div style="font-size:16px;color:#64748b;margin-bottom:8px">Buen provecho</div>
  <div id="salidaColHora" style="font-size:18px;color:#f59e0b;margin-bottom:8px"></div>
  <div style="font-size:14px;color:#64748b;margin-bottom:32px">Recuerda regresar en 30–60 minutos</div>
  <button onclick="location.href='login.html'" style="background:#1e1e2e;border:1px solid #2d2d5e;color:#e2e8f0;font-size:15px;font-weight:600;padding:14px 40px;border-radius:12px;cursor:pointer">CERRAR</button>
</div>

<!-- ── Pantalla: ENTRADA COLACIÓN ───────────────────────────── -->
<div id="pantallaEntradaColacion" class="pantalla-post">
  <div style="font-size:64px;margin-bottom:16px">👋</div>
  <div id="entradaColNombre" style="font-size:28px;font-weight:700;color:#fff;margin-bottom:8px"></div>
  <div style="font-size:16px;color:#64748b;margin-bottom:8px">Bienvenido de vuelta</div>
  <div id="entradaColMinutos" style="font-size:22px;font-weight:700;color:#f59e0b;margin-bottom:8px"></div>
  <div id="entradaColHora" style="font-size:18px;color:#22c55e;margin-bottom:32px"></div>
  <button onclick="location.href='pos.html'" style="background:#22c55e;border:none;color:#000;font-size:16px;font-weight:700;padding:16px 48px;border-radius:12px;cursor:pointer">IR A LA CAJA</button>
</div>

<script>
const _COLORES = [
  '#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#0ea5e9'
];
let pin = '';
let usuarioSeleccionado = null;
let _modoAcceso = 'entrada';

const _MODO_BTN = {
  entrada:           'btnModoEntrada',
  salida:            'btnModoSalida',
  salida_colacion:   'btnModoSalidaColacion',
  entrada_colacion:  'btnModoEntradaColacion',
};

function seleccionarModo(modo) {
  _modoAcceso = modo;
  Object.entries(_MODO_BTN).forEach(([m, id]) => {
    const btn = document.getElementById(id);
    if (btn) btn.classList.toggle('activo', m === modo);
  });
}

function _horaActual() {
  const d = new Date();
  return d.toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit', hour12:false});
}

function _avatarColor(nombre) {
  let h = 0;
  for (let i = 0; i < (nombre||'').length; i++) h = (h * 31 + nombre.charCodeAt(i)) & 0xFFFFFF;
  return _COLORES[Math.abs(h) % _COLORES.length];
}

function crearRipple(btn, event) {
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.classList.add('ripple');
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (event.clientX - rect.left - size / 2) + 'px';
  ripple.style.top  = (event.clientY - rect.top  - size / 2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 400);
}

async function cargarUsuarios() {
  try {
    const usuarios = await fetch('/api/auth/usuarios/publico', {credentials:'include'})
      .then(r => r.json());
    const grid = document.getElementById('usuariosGrid');
    grid.innerHTML = '';
    if (!usuarios || !usuarios.length) {
      mostrarPin(null);
      return;
    }
    usuarios.forEach(u => {
      const inicial = (u.nombre || '?')[0].toUpperCase();
      const color   = _avatarColor(u.nombre);
      const card = document.createElement('div');
      card.className = 'usuario-card';
      card.innerHTML = `
        <div class="usuario-avatar" style="background:${color}">${inicial}</div>
        <div class="usuario-nombre">${u.nombre}</div>
        <div class="usuario-rol">${u.rol || ''}</div>`;
      card.onclick = () => mostrarPin(u);
      grid.appendChild(card);
    });
    if (usuarios.length === 1) mostrarPin(usuarios[0]);
  } catch(e) {
    mostrarPin(null);
  }
}

function mostrarPin(u) {
  usuarioSeleccionado = u;
  pin = '';
  actualizarCirculos();
  setError('');

  const avatar = document.getElementById('pinAvatar');
  if (u) {
    const inicial = (u.nombre || '?')[0].toUpperCase();
    const color   = _avatarColor(u.nombre);
    avatar.textContent = inicial;
    avatar.style.background = `linear-gradient(135deg, ${color}, #8b5cf6)`;
    document.getElementById('pinNombreUsuario').textContent = u.nombre;
    document.getElementById('pinSubtitulo').textContent = u.rol || 'Introduce tu PIN';
  } else {
    avatar.textContent = '🔑';
    avatar.style.background = 'rgba(255,255,255,0.08)';
    document.getElementById('pinNombreUsuario').textContent = 'Introduce tu PIN';
    document.getElementById('pinSubtitulo').textContent = '4 dígitos';
  }

  document.getElementById('pantallaUsuarios').style.opacity = '0';
  document.getElementById('pantallaUsuarios').style.pointerEvents = 'none';
  document.getElementById('pantallaPin').classList.add('activa');
}

function volverUsuarios() {
  pin = '';
  actualizarCirculos();
  setError('');
  document.getElementById('pantallaPin').classList.remove('activa');
  document.getElementById('pantallaUsuarios').style.opacity = '1';
  document.getElementById('pantallaUsuarios').style.pointerEvents = '';
}

function actualizarCirculos(estado) {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('pc' + i);
    dot.classList.remove('activo', 'correcto', 'error');
    if (estado === 'correcto') {
      dot.classList.add('correcto');
    } else if (estado === 'error') {
      dot.classList.add('error');
    } else if (i < pin.length) {
      dot.classList.add('activo');
    }
  }
}

function presionarPin(digito) {
  if (pin.length >= 4) return;
  pin += digito;
  actualizarCirculos();
  if (navigator.vibrate) navigator.vibrate(30);
  if (pin.length === 4) setTimeout(intentarLogin, 200);
}

function borrarPin() {
  if (!pin.length) return;
  pin = pin.slice(0, -1);
  actualizarCirculos();
  setError('');
}

function setError(msg) {
  document.getElementById('pinError').textContent = msg;
}

function triggerError() {
  actualizarCirculos('error');
  const wrapper = document.getElementById('loginWrapper');
  wrapper.classList.remove('error');
  void wrapper.offsetHeight;
  wrapper.classList.add('error');
  setTimeout(() => {
    wrapper.classList.remove('error');
    pin = '';
    actualizarCirculos();
  }, 500);
}

async function intentarLogin() {
  if (pin.length !== 4) return;
  try {
    const body = {pin, modo: _modoAcceso};
    if (usuarioSeleccionado) body.usuario_id = usuarioSeleccionado.id;
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
      credentials: 'include',
    });
    const data = await r.json();
    if (data.cambiar_pin) {
      _mostrarModalCambioPin(data.usuario_id);
      return;
    }
    if (r.ok) {
      actualizarCirculos('correcto');
      setTimeout(() => _mostrarPantallaPost(data), 300);
    } else if (data.upgrade) {
      setError('Límite de sesiones alcanzado. Pide al admin que cierre una.');
      triggerError();
      if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
    } else {
      setError(data.error || 'PIN incorrecto');
      triggerError();
      if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
    }
  } catch(e) {
    setError('Error de conexión');
    triggerError();
  }
}

async function _mostrarPantallaPost(data) {
  const nombre  = data.usuario?.nombre || '';
  const modo    = data.modo || _modoAcceso;
  const hora    = _horaActual();
  const rol     = data.usuario?.rol || '';

  // Calcular resumen asistencia para pantalla entrada
  let horasSemana = '';
  if (modo === 'entrada') {
    try {
      const res = await fetch('/api/auth/asistencia/resumen', {credentials:'include'}).then(r=>r.json());
      const hrs  = res.horas_semana ?? 0;
      const pact = res.jornada_pactada ?? 45;
      horasSemana = `Esta semana: ${hrs} hrs trabajadas de ${pact} hrs pactadas`;
    } catch(e) {}

    // Si turno cerrado → ir directo a pos.html (el overlay turno-cerrado lo cubre allá)
    if (rol !== 'cocina') {
      let turnoAbierto = false;
      try {
        const tRes = await fetch('/api/auth/turno/actual', {credentials:'include'}).then(r => r.json());
        turnoAbierto = !!tRes.turno;
      } catch(e) {}
      if (!turnoAbierto) {
        window.location.href = 'pos.html';
        return;
      }
    }
  }

  const idPantalla = {
    entrada:          'pantallaEntrada',
    salida:           'pantallaSalida',
    salida_colacion:  'pantallaSalidaColacion',
    entrada_colacion: 'pantallaEntradaColacion',
  }[modo];

  if (!idPantalla) {
    // Fallback por rol
    window.location.href = rol === 'cocina' ? 'cocina.html' : 'pos.html';
    return;
  }

  if (modo === 'entrada') {
    document.getElementById('entradaNombre').textContent     = nombre;
    document.getElementById('entradaHora').textContent       = hora;
    document.getElementById('entradaHorasSemana').textContent = horasSemana;
    setTimeout(() => location.href = rol === 'cocina' ? 'cocina.html' : 'pos.html', 3000);
  } else if (modo === 'salida') {
    document.getElementById('salidaNombre').textContent  = nombre;
    document.getElementById('salidaHora').textContent    = hora;
    // Calcular horas trabajadas hoy
    try {
      const res = await fetch('/api/auth/asistencia/resumen', {credentials:'include'}).then(r=>r.json());
      if (res.ultima_entrada) {
        const ini = new Date(res.ultima_entrada.replace(' ','T'));
        const fin = new Date();
        const diffMin = Math.round((fin - ini) / 60000);
        const h = Math.floor(diffMin / 60);
        const m = diffMin % 60;
        document.getElementById('salidaResumen').textContent = `Hoy trabajaste ${h} hrs ${m} min`;
      }
    } catch(e) {}
  } else if (modo === 'salida_colacion') {
    document.getElementById('salidaColNombre').textContent = nombre;
    document.getElementById('salidaColHora').textContent   = `Colación iniciada a las ${hora}`;
  } else if (modo === 'entrada_colacion') {
    document.getElementById('entradaColNombre').textContent = nombre;
    document.getElementById('entradaColHora').textContent   = `Son las ${hora}`;
    try {
      const rCol = await fetch('/api/auth/asistencia', {
        method: 'POST', credentials: 'include',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({tipo: 'entrada_colacion'})
      }).then(r => r.json());
      if (rCol.minutos != null) {
        document.getElementById('entradaColMinutos').textContent =
          `Colación: ${rCol.minutos} minutos`;
      }
    } catch(e) {}
    setTimeout(() => location.href = 'pos.html', 3000);
  }

  document.getElementById(idPantalla).classList.add('activa');
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('pantallaPin').classList.contains('activa')) return;
  if (e.key >= '0' && e.key <= '9') presionarPin(e.key);
  else if (e.key === 'Backspace') borrarPin();
  else if (e.key === 'Escape') volverUsuarios();
});

// Detectar ?modo= en URL
(function() {
  const params = new URLSearchParams(window.location.search);
  const m = params.get('modo');
  if (m && _MODO_BTN[m]) seleccionarModo(m);
})();

cargarUsuarios();
</script>
<!-- ── Modal cambio PIN obligatorio ───────────────────────────── -->
<div id="modalCambioPin" style="
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.85);
  z-index:9999;
  align-items:center;justify-content:center;
">
  <div style="background:#1e1e2e;border-radius:16px;padding:32px 24px;
    max-width:320px;width:90%;text-align:center">
    <div style="font-size:36px;margin-bottom:12px">⚠️</div>
    <div style="font-size:18px;font-weight:700;color:#f1f5f9;margin-bottom:8px">
      Cambia tu PIN
    </div>
    <div style="font-size:13px;color:#94a3b8;margin-bottom:24px;line-height:1.5">
      Por seguridad debes establecer un PIN personal antes de continuar
    </div>
    <input id="inputPinNuevo" type="password" inputmode="numeric"
      maxlength="4" placeholder="Nuevo PIN (4 dígitos)"
      style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;
        border:1px solid #334155;background:#0f172a;color:#f1f5f9;
        font-size:16px;text-align:center;margin-bottom:10px">
    <input id="inputPinConfirmar" type="password" inputmode="numeric"
      maxlength="4" placeholder="Confirmar PIN"
      style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;
        border:1px solid #334155;background:#0f172a;color:#f1f5f9;
        font-size:16px;text-align:center;margin-bottom:16px">
    <div id="modalCambioPinError"
      style="color:#ef4444;font-size:13px;min-height:18px;margin-bottom:12px"></div>
    <button onclick="_guardarPinNuevo()"
      style="width:100%;padding:14px;background:#6366f1;border:none;
        color:#fff;font-size:15px;font-weight:700;border-radius:10px;cursor:pointer">
      Guardar PIN
    </button>
  </div>
</div>

<script>
let _cambiarPinUsuarioId = null;

function _mostrarModalCambioPin(usuarioId) {
  _cambiarPinUsuarioId = usuarioId;
  document.getElementById('inputPinNuevo').value = '';
  document.getElementById('inputPinConfirmar').value = '';
  document.getElementById('modalCambioPinError').textContent = '';
  document.getElementById('modalCambioPin').style.display = 'flex';
  document.getElementById('inputPinNuevo').focus();
}

async function _guardarPinNuevo() {
  const pinNuevo     = document.getElementById('inputPinNuevo').value.trim();
  const pinConfirmar = document.getElementById('inputPinConfirmar').value.trim();
  const errEl        = document.getElementById('modalCambioPinError');

  if (pinNuevo.length !== 4 || !/^\d{4}$/.test(pinNuevo)) {
    errEl.textContent = 'El PIN debe tener exactamente 4 dígitos';
    return;
  }
  if (pinNuevo !== pinConfirmar) {
    errEl.textContent = 'Los PINs no coinciden';
    return;
  }
  if (pinNuevo === '1234') {
    errEl.textContent = 'No puedes usar 1234 como PIN';
    return;
  }

  errEl.textContent = '';
  try {
    const r = await fetch('/api/auth/cambiar-pin', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'include',
      body: JSON.stringify({usuario_id: _cambiarPinUsuarioId, pin_nuevo: pinNuevo}),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) {
      errEl.textContent = d.error || 'Error al guardar PIN';
      return;
    }
    document.getElementById('modalCambioPin').style.display = 'none';
    // Continuar con el login usando el PIN nuevo
    pin = pinNuevo;
    await intentarLogin();
  } catch(e) {
    errEl.textContent = 'Error de conexión';
  }
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', {scope: '/'})
      .catch(err => console.log('SW error:', err));
  });
}
</script>
