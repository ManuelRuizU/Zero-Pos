<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO POS — Acceso</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  background: #1a1a2e;
  min-height: 100vh;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ── Pantalla 1: selección de usuario ───────────────────────── */
#pantallaUsuarios {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: #1a1a2e;
  transition: opacity .25s;
}
.logo-top {
  font-size: 28px; font-weight: 900; letter-spacing: -1px;
  margin-bottom: 8px;
}
.logo-top .zero { color: #fff; }
.logo-top .pos  { color: #6366f1; }
.login-subtitle {
  color: #64748b; font-size: 14px; margin-bottom: 40px;
}
.usuarios-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 16px;
  width: min(480px, 90vw);
  max-height: 60vh;
  overflow-y: auto;
}
.usuario-card {
  display: flex; flex-direction: column;
  align-items: center; gap: 10px;
  padding: 24px 12px 20px;
  background: #24243e;
  border: 1px solid #2d2d44;
  border-radius: 16px;
  cursor: pointer;
  transition: all .15s;
  user-select: none;
}
.usuario-card:active  { transform: scale(.96); }
.usuario-card:hover   { border-color: #6366f1; background: #2a2a4a; }
.usuario-avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: #fff;
}
.usuario-nombre {
  font-size: 14px; font-weight: 600; color: #e2e8f0;
  text-align: center; word-break: break-word;
}
.usuario-rol {
  font-size: 11px; color: #64748b; text-transform: capitalize;
}

/* ── Pantalla 2: teclado PIN ────────────────────────────────── */
#pantallaPin {
  position: fixed; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  background: #1a1a2e;
}
#pantallaPin.activa { display: flex; }

#pinAvatar {
  width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 700; color: #fff;
  margin-bottom: 14px;
}
#pinNombreUsuario {
  color: #e2e8f0; font-size: 18px; font-weight: 600;
  margin-bottom: 4px;
}
#pinSubtitulo {
  color: #64748b; font-size: 13px; margin-bottom: 32px;
}

/* Círculos de dígitos */
.pin-circulos {
  display: flex; gap: 18px; margin-bottom: 40px;
}
.circulo-pin {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid #6366f1;
  transition: background .12s;
}
.circulo-pin.activo { background: #6366f1; }

/* Teclado */
.teclado-pin {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px; width: min(280px, 85vw);
}
.btn-pin {
  height: 72px;
  background: #2d2d44;
  color: #f1f5f9;
  border: none; border-radius: 12px;
  font-size: 24px; font-weight: 500;
  cursor: pointer;
  transition: background .1s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.btn-pin:active { background: #6366f1; }
.btn-pin.btn-borrar {
  font-size: 20px; background: #1e1e2e; color: #94a3b8;
}
.btn-pin.btn-volver {
  font-size: 12px; background: #1e1e2e; color: #64748b;
  height: 40px; margin-top: 20px;
  grid-column: 1 / -1;
}
.btn-pin.btn-volver:active { background: #2d2d44; color: #94a3b8; }

/* Error */
#pinError {
  height: 20px; font-size: 13px; color: #ef4444;
  margin-top: 16px; text-align: center;
  animation: shake .35s ease;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-8px); }
  75%      { transform: translateX(8px); }
}
.pin-footer {
  position: fixed; bottom: 16px;
  color: #2d2d44; font-size: 11px;
}
</style>
</head>
<body>

<!-- ── Pantalla 1: usuarios ─────────────────────────────────── -->
<div id="pantallaUsuarios">
  <div class="logo-top">
    <span class="zero">ZERO</span><span class="pos">POS</span>
  </div>
  <div class="login-subtitle">¿Quién eres?</div>
  <div class="usuarios-grid" id="usuariosGrid"></div>
  <p class="pin-footer">ZERO POS v1.0</p>
</div>

<!-- ── Pantalla 2: PIN ──────────────────────────────────────── -->
<div id="pantallaPin">
  <div class="logo-top">
    <span class="zero">ZERO</span><span class="pos">POS</span>
  </div>

  <div id="pinAvatar"></div>
  <div id="pinNombreUsuario">Introduce tu PIN</div>
  <div id="pinSubtitulo">4 dígitos</div>

  <div class="pin-circulos">
    <div class="circulo-pin" id="pc0"></div>
    <div class="circulo-pin" id="pc1"></div>
    <div class="circulo-pin" id="pc2"></div>
    <div class="circulo-pin" id="pc3"></div>
  </div>

  <div class="teclado-pin">
    <button class="btn-pin" onclick="presionarPin('1')">1</button>
    <button class="btn-pin" onclick="presionarPin('2')">2</button>
    <button class="btn-pin" onclick="presionarPin('3')">3</button>
    <button class="btn-pin" onclick="presionarPin('4')">4</button>
    <button class="btn-pin" onclick="presionarPin('5')">5</button>
    <button class="btn-pin" onclick="presionarPin('6')">6</button>
    <button class="btn-pin" onclick="presionarPin('7')">7</button>
    <button class="btn-pin" onclick="presionarPin('8')">8</button>
    <button class="btn-pin" onclick="presionarPin('9')">9</button>
    <div></div>
    <button class="btn-pin" onclick="presionarPin('0')">0</button>
    <button class="btn-pin btn-borrar" onclick="borrarPin()">⌫</button>
    <button class="btn-pin btn-volver" onclick="volverUsuarios()">← Cambiar usuario</button>
  </div>

  <div id="pinError"></div>
</div>

<script>
const _COLORES = [
  '#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#0ea5e9'
];
let pin = '';
let usuarioSeleccionado = null;

function _avatarColor(nombre) {
  let h = 0;
  for (let i = 0; i < (nombre||'').length; i++) h = (h * 31 + nombre.charCodeAt(i)) & 0xFFFFFF;
  return _COLORES[Math.abs(h) % _COLORES.length];
}

async function cargarUsuarios() {
  try {
    const usuarios = await fetch('/api/auth/usuarios/publico', {credentials:'include'})
      .then(r => r.json());
    const grid = document.getElementById('usuariosGrid');
    grid.innerHTML = '';
    if (!usuarios || !usuarios.length) {
      // Sin usuarios → ir directo al PIN genérico
      mostrarPin(null);
      return;
    }
    usuarios.forEach(u => {
      const inicial = (u.nombre || '?')[0].toUpperCase();
      const color   = _avatarColor(u.nombre);
      const card = document.createElement('div');
      card.className = 'usuario-card';
      card.innerHTML = `
        <div class="usuario-avatar" style="background:${color}">${inicial}</div>
        <div class="usuario-nombre">${u.nombre}</div>
        <div class="usuario-rol">${u.rol || ''}</div>`;
      card.onclick = () => mostrarPin(u);
      grid.appendChild(card);
    });
    if (usuarios.length === 1) mostrarPin(usuarios[0]);
  } catch(e) {
    mostrarPin(null);
  }
}

function mostrarPin(u) {
  usuarioSeleccionado = u;
  pin = '';
  actualizarCirculos();
  setError('');

  if (u) {
    const inicial = (u.nombre || '?')[0].toUpperCase();
    const color   = _avatarColor(u.nombre);
    document.getElementById('pinAvatar').textContent = inicial;
    document.getElementById('pinAvatar').style.background = color;
    document.getElementById('pinNombreUsuario').textContent = u.nombre;
    document.getElementById('pinSubtitulo').textContent = u.rol || 'Introduce tu PIN';
  } else {
    document.getElementById('pinAvatar').textContent = '🔑';
    document.getElementById('pinAvatar').style.background = '#2d2d44';
    document.getElementById('pinNombreUsuario').textContent = 'Introduce tu PIN';
    document.getElementById('pinSubtitulo').textContent = '4 dígitos';
  }

  document.getElementById('pantallaUsuarios').style.opacity = '0';
  document.getElementById('pantallaUsuarios').style.pointerEvents = 'none';
  document.getElementById('pantallaPin').classList.add('activa');
}

function volverUsuarios() {
  pin = '';
  actualizarCirculos();
  setError('');
  document.getElementById('pantallaPin').classList.remove('activa');
  document.getElementById('pantallaUsuarios').style.opacity = '1';
  document.getElementById('pantallaUsuarios').style.pointerEvents = '';
}

function actualizarCirculos() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('pc' + i).classList.toggle('activo', i < pin.length);
  }
}

function presionarPin(digito) {
  if (pin.length >= 4) return;
  pin += digito;
  actualizarCirculos();
  if (navigator.vibrate) navigator.vibrate(30);
  if (pin.length === 4) setTimeout(intentarLogin, 200);
}

function borrarPin() {
  if (!pin.length) return;
  pin = pin.slice(0, -1);
  actualizarCirculos();
  setError('');
}

function setError(msg) {
  const el = document.getElementById('pinError');
  el.textContent = msg;
  if (msg) {
    el.style.animation = 'none';
    void el.offsetHeight;
    el.style.animation = 'shake .35s ease';
  }
}

async function intentarLogin() {
  if (pin.length !== 4) return;
  try {
    const body = {pin};
    if (usuarioSeleccionado) body.usuario_id = usuarioSeleccionado.id;
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
      credentials: 'include',
    });
    const data = await r.json();
    if (r.ok) {
      const destino = data.usuario.rol === 'cocina' ? 'cocina.html'
                    : data.usuario.rol === 'admin'  ? 'admin.html'
                    : 'pos.html';
      window.location.href = destino;
    } else if (data.upgrade) {
      setError('Límite de sesiones alcanzado. Pide al admin que cierre una.');
      pin = ''; actualizarCirculos();
    } else {
      setError(data.error || 'PIN incorrecto');
      pin = ''; actualizarCirculos();
      if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
    }
  } catch(e) {
    setError('Error de conexión');
    pin = ''; actualizarCirculos();
  }
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('pantallaPin').classList.contains('activa')) return;
  if (e.key >= '0' && e.key <= '9') presionarPin(e.key);
  else if (e.key === 'Backspace') borrarPin();
  else if (e.key === 'Escape') volverUsuarios();
});

cargarUsuarios();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', {scope: '/'})
      .catch(err => console.log('SW error:', err));
  });
}
</script>
</body>
</html>
