<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#22c55e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZERO POS">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO POS — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<!-- ── Pantalla 1: usuarios ─────────────────────────────────── -->
<div id="pantallaUsuarios">
  <div class="logo-top">ZERO<span class="pos">POS</span></div>
  <div class="login-subtitle">¿Quién eres?</div>
  <div class="usuarios-grid" id="usuariosGrid"></div>
  <p class="pin-footer">ZERO POS v1.0</p>
</div>

<!-- ── Pantalla 2: PIN ──────────────────────────────────────── -->
<div id="pantallaPin">
  <div class="login-wrapper" id="loginWrapper">
    <div class="logo-top">ZERO<span class="pos">POS</span></div>

    <div class="avatar-usuario" id="pinAvatar"></div>
    <div id="pinNombreUsuario">Introduce tu PIN</div>
    <div id="pinSubtitulo">4 dígitos</div>

    <!-- Selector modo acceso -->
    <div class="modo-grid" style="margin-top:16px">
      <button class="btn-modo activo" id="btnModoEntrada"          onclick="seleccionarModo('entrada')">ABRIR TURNO</button>
      <button class="btn-modo"        id="btnModoSalida"           onclick="seleccionarModo('salida')">CERRAR TURNO</button>
      <button class="btn-modo"        id="btnModoSalidaColacion"   onclick="seleccionarModo('salida_colacion')">IR A COLACIÓN</button>
      <button class="btn-modo"        id="btnModoEntradaColacion"  onclick="seleccionarModo('entrada_colacion')">VOLVER DE COLACIÓN</button>
    </div>

    <div class="pin-circulos">
      <div class="circulo-pin" id="pc0"></div>
      <div class="circulo-pin" id="pc1"></div>
      <div class="circulo-pin" id="pc2"></div>
      <div class="circulo-pin" id="pc3"></div>
    </div>

    <div class="teclado-pin">
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('1')">1</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('2')">2</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('3')">3</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('4')">4</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('5')">5</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('6')">6</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('7')">7</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('8')">8</button>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('9')">9</button>
      <div></div>
      <button class="btn-pin" onclick="crearRipple(this,event);presionarPin('0')">0</button>
      <button class="btn-pin btn-borrar" onclick="crearRipple(this,event);borrarPin()">⌫</button>
      <button class="btn-pin btn-volver" onclick="volverUsuarios()">← Cambiar usuario</button>
    </div>

    <div id="pinError"></div>
  </div>
</div>

<!-- ── Pantalla: ENTRADA ────────────────────────────────────── -->
<div id="pantallaEntrada" class="pantalla-post">
  <div style="font-size:28px;font-weight:900;letter-spacing:-1px;color:#fff;margin-bottom:32px">ZERO<span style="color:var(--accent)">POS</span></div>
  <div style="font-size:15px;color:#64748b;margin-bottom:6px">Bienvenido/a</div>
  <div id="entradaNombre" style="font-size:32px;font-weight:700;color:#fff;margin-bottom:4px"></div>
  <div id="entradaHora" class="post-hora" style="font-size:56px;font-weight:200;color:#22c55e;margin-bottom:24px"></div>
  <div id="entradaHorasSemana" style="font-size:13px;color:#64748b;margin-bottom:32px"></div>
  <button onclick="location.href='pos.html'" style="background:#22c55e;border:none;color:#000;font-size:16px;font-weight:700;padding:16px 48px;border-radius:12px;cursor:pointer">IR A LA CAJA</button>
</div>

<!-- ── Pantalla: SALIDA ─────────────────────────────────────── -->
<div id="pantallaSalida" class="pantalla-post">
  <div style="font-size:64px;margin-bottom:16px">🌙</div>
  <div style="font-size:15px;color:#64748b">Hasta mañana</div>
  <div id="salidaNombre" style="font-size:32px;font-weight:700;color:#fff;margin-bottom:4px"></div>
  <div id="salidaHora" class="post-hora" style="font-size:48px;font-weight:200;color:var(--accent);margin-bottom:16px"></div>
  <div id="salidaResumen" style="font-size:14px;color:#64748b;margin-bottom:12px"></div>
  <div style="font-size:16px;color:#e2e8f0;margin-bottom:32px">Buenas noches 👋</div>
  <button onclick="location.href='login.html'" style="background:#1e1e2e;border:1px solid #2d2d5e;color:#e2e8f0;font-size:15px;font-weight:600;padding:14px 40px;border-radius:12px;cursor:pointer">CERRAR</button>
</div>

<!-- ── Pantalla: SALIDA COLACIÓN ────────────────────────────── -->
<div id="pantallaSalidaColacion" class="pantalla-post">
  <div style="font-size:64px;margin-bottom:16px">☕</div>
  <div id="salidaColNombre" style="font-size:28px;font-weight:700;color:#fff;margin-bottom:8px"></div>
  <div style="font-size:16px;color:#64748b;margin-bottom:8px">Buen provecho</div>
  <div id="salidaColHora" style="font-size:18px;color:#f59e0b;margin-bottom:8px"></div>
  <div style="font-size:14px;color:#64748b;margin-bottom:32px">Recuerda regresar en 30–60 minutos</div>
  <button onclick="location.href='login.html'" style="background:#1e1e2e;border:1px solid #2d2d5e;color:#e2e8f0;font-size:15px;font-weight:600;padding:14px 40px;border-radius:12px;cursor:pointer">CERRAR</button>
</div>

<!-- ── Pantalla: ENTRADA COLACIÓN ───────────────────────────── -->
<div id="pantallaEntradaColacion" class="pantalla-post">
  <div style="font-size:64px;margin-bottom:16px">👋</div>
  <div id="entradaColNombre" style="font-size:28px;font-weight:700;color:#fff;margin-bottom:8px"></div>
  <div style="font-size:16px;color:#64748b;margin-bottom:8px">Bienvenido de vuelta</div>
  <div id="entradaColMinutos" style="font-size:22px;font-weight:700;color:#f59e0b;margin-bottom:8px"></div>
  <div id="entradaColHora" style="font-size:18px;color:#22c55e;margin-bottom:32px"></div>
  <button onclick="location.href='pos.html'" style="background:#22c55e;border:none;color:#000;font-size:16px;font-weight:700;padding:16px 48px;border-radius:12px;cursor:pointer">IR A LA CAJA</button>
</div>

<!-- ── Modal cambio PIN obligatorio ───────────────────────────── -->
<div id="modalCambioPin" style="
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.85);
  z-index:9999;
  align-items:center;justify-content:center;
">
  <div style="background:#1e1e2e;border-radius:16px;padding:32px 24px;
    max-width:320px;width:90%;text-align:center">
    <div style="font-size:36px;margin-bottom:12px">⚠️</div>
    <div style="font-size:18px;font-weight:700;color:#f1f5f9;margin-bottom:8px">
      Cambia tu PIN
    </div>
    <div style="font-size:13px;color:#94a3b8;margin-bottom:24px;line-height:1.5">
      Por seguridad debes establecer un PIN personal antes de continuar
    </div>
    <input id="inputPinNuevo" type="password" inputmode="numeric"
      maxlength="4" placeholder="Nuevo PIN (4 dígitos)"
      style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;
        border:1px solid #334155;background:#0f172a;color:#f1f5f9;
        font-size:16px;text-align:center;margin-bottom:10px">
    <input id="inputPinConfirmar" type="password" inputmode="numeric"
      maxlength="4" placeholder="Confirmar PIN"
      style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;
        border:1px solid #334155;background:#0f172a;color:#f1f5f9;
        font-size:16px;text-align:center;margin-bottom:16px">
    <div id="modalCambioPinError"
      style="color:#ef4444;font-size:13px;min-height:18px;margin-bottom:12px"></div>
    <button onclick="_guardarPinNuevo()"
      style="width:100%;padding:14px;background:var(--accent);border:none;
        color:#fff;font-size:15px;font-weight:700;border-radius:10px;cursor:pointer">
      Guardar PIN
    </button>
  </div>
</div>


<script src="/static/js/login.js"></script>
</body>
</html>
