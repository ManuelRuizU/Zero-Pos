<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZERO POS — Pago Khipu</title>
<style>
:root{--bg:#0a0a0f;--surface:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);
  --accent:#6366f1;--text:#f1f5f9;--text-dim:#94a3b8;
  --success:#22c55e;--warning:#f59e0b;--radius:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(99,102,241,0.12) 0%,transparent 70%);}
.card{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:20px;padding:40px;
  width:100%;max-width:420px;text-align:center;}
.icon{font-size:48px;margin-bottom:12px;}
h2{font-size:22px;font-weight:700;margin-bottom:6px;}
.sub{font-size:14px;color:var(--text-dim);margin-bottom:28px;}
.monto{font-size:48px;font-weight:900;letter-spacing:-2px;color:#818cf8;margin-bottom:24px;}
.estado{
  border-radius:12px;padding:14px;font-size:14px;margin-bottom:20px;
  display:flex;align-items:center;gap:10px;
}
.estado.pendiente{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--warning);}
.estado.pagado{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--success);}
.btn{display:block;width:100%;background:var(--accent);border:none;color:#fff;
  border-radius:12px;padding:16px;font-size:15px;font-weight:700;
  cursor:pointer;text-decoration:none;margin-bottom:10px;transition:filter .15s;}
.btn:hover{filter:brightness(1.12);}
.btn.sec{background:rgba(255,255,255,0.06);border:1px solid var(--border);}
.comision{font-size:12px;color:var(--text-dim);margin-top:16px;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🏦</div>
  <h2>Pago con Khipu</h2>
  <p class="sub">1% de comisión — la más baja del mercado</p>
  <div class="monto" id="montoDisplay">$0</div>
  <div id="estadoDiv" class="estado pendiente">
    <span>⏳</span> <span id="estadoTexto">Esperando confirmación de pago...</span>
  </div>
  <a id="btnPagar" class="btn" href="#" target="_blank">Abrir link de pago →</a>
  <button class="btn sec" onclick="verificar()">🔄 Verificar estado</button>
  <button class="btn sec" onclick="cerrar()">← Volver</button>
  <p class="comision">Khipu cobra solo 1% por transacción. Sin costos fijos.</p>
</div>

<script>
const params = new URLSearchParams(location.search);
const monto = parseFloat(params.get('monto')||0);
const paymentUrl = params.get('url')||'';
const paymentId = params.get('pid')||'';

document.getElementById('montoDisplay').textContent = '$' + Math.round(monto).toLocaleString('es-CL');
if (paymentUrl) document.getElementById('btnPagar').href = paymentUrl;

async function verificar() {
  if (!paymentId) return;
  try {
    const r = await fetch(`/api/khipu/verificar/${paymentId}`,{credentials:'include'}).then(r=>r.json());
    const div = document.getElementById('estadoDiv');
    const txt = document.getElementById('estadoTexto');
    if (r.estado==='done'||r.estado==='pagado') {
      div.className='estado pagado';
      txt.textContent='✓ Pago confirmado';
      setTimeout(()=>cerrar(), 3000);
    } else {
      txt.textContent='Estado: ' + (r.estado||'pendiente');
    }
  } catch(e) {}
}

function cerrar() {
  if (window.opener) window.close();
  else history.back();
}

if (paymentId) setInterval(verificar, 5000);
</script>
</body>
</html>
