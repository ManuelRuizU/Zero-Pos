<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ZERO CREDIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/css/zero-tokens.css">
  <link rel="stylesheet" href="/static/css/zero-base.css">
  <link rel="stylesheet" href="/static/css/zero-components.css">
  <link rel="stylesheet" href="/static/css/zero-layout.css">
  <link rel="stylesheet" href="/static/css/credit.css">
</head>
<body>
  <div class="topbar">
    <button onclick="history.length>1?history.back():location.href='pos.html'" style="display:flex;align-items:center;gap:6px;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.4);color:#e2e8f0;font-size:13px;cursor:pointer;padding:6px 12px;border-radius:8px;font-weight:600;transition:all .15s" onmouseenter="this.style.background='rgba(34,197,94,0.22)'" onmouseleave="this.style.background='rgba(34,197,94,0.12)'"><i class="ti ti-arrow-left" style="font-size:16px"></i> Volver</button>
    <div class="logo">ZERO<span>CREDIT</span></div>
    <div style="margin-left:auto;display:flex;gap:6px">
      <button class="btn tab-btn" id="tab-resumen-btn" onclick="showTab('resumen')"><div class="nav-icon-pill" style="background:#1a2744"><i class="ti ti-chart-bar" style="color:#60a5fa;font-size:14px"></i></div> Resumen</button>
      <button class="btn tab-btn" id="tab-clientes-btn" onclick="showTab('clientes')"><div class="nav-icon-pill" style="background:#1a2744"><i class="ti ti-users" style="color:#60a5fa;font-size:14px"></i></div> Clientes</button>
      <button class="btn tab-btn" id="tab-vencidos-btn" onclick="showTab('vencidos')"><div class="nav-icon-pill" style="background:#2a1a10"><i class="ti ti-alert-triangle" style="color:#fb923c;font-size:14px"></i></div> Vencidos</button>
    </div>
  </div>

  <div style="max-width:1200px;margin:0 auto;padding:24px 20px">

    <!-- TAB RESUMEN -->
    <div id="tab-resumen">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px">
        <div class="kpi-card"><div class="kpi-label">💰 Total en fiado</div><div class="kpi-value" id="kpiDeuda">$0</div></div>
        <div class="kpi-card"><div class="kpi-label">👥 Clientes</div><div class="kpi-value" id="kpiClientes">0</div></div>
        <div class="kpi-card"><div class="kpi-label">⚠️ Vencidos</div><div class="kpi-value" id="kpiVencidos" style="color:var(--danger,#ef4444)">0</div></div>
        <div class="kpi-card"><div class="kpi-label">✅ Cobrado hoy</div><div class="kpi-value" id="kpiCobrado">$0</div></div>
      </div>
      <div id="listaVencidosResumen"></div>
    </div>

    <!-- TAB CLIENTES -->
    <div id="tab-clientes" style="display:none">
      <div style="display:flex;gap:10px;margin-bottom:16px">
        <input class="search-input" id="searchClientes" placeholder="🔍 Buscar por nombre o teléfono..."
          oninput="filtrarClientes(this.value)">
      </div>
      <div id="listaClientes"></div>
    </div>

    <!-- TAB VENCIDOS -->
    <div id="tab-vencidos" style="display:none">
      <div id="listaVencidos"></div>
    </div>

  </div>

  <!-- Modal detalle cliente — generado dinámicamente por abrirCliente() -->

  <!-- Modal abono -->
  <div class="modal-overlay" id="modalAbono">
    <div class="modal" style="max-width:400px">
      <div class="modal-title">💳 Registrar abono</div>
      <div class="form-group">
        <label>Monto del abono ($)</label>
        <input type="number" id="abonoMonto" min="1" placeholder="0" style="width:100%">
      </div>
      <div class="form-group">
        <label>Descripción (opcional)</label>
        <input type="text" id="abonoDesc" placeholder="Abono en tienda" style="width:100%">
      </div>
      <div class="modal-btns">
        <button class="btn" onclick="document.getElementById('modalAbono').classList.remove('active')">Cancelar</button>
        <button class="btn primary" onclick="confirmarAbono()">✅ Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Modal nuevo cliente -->
  <div class="modal-overlay" id="modalNuevoCliente">
    <div class="modal" style="max-width:480px">
      <div class="modal-title">Nuevo cliente ZERO CREDIT</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group" style="margin:0"><label>Nombre *</label><input id="ncNombre" style="width:100%"></div>
        <div class="form-group" style="margin:0"><label>Apellido</label><input id="ncApellido" style="width:100%"></div>
      </div>
      <div style="margin-top:10px" class="form-group"><label>Teléfono *</label><input id="ncTelefono" placeholder="+56 9 XXXX XXXX" style="width:100%"></div>
      <div class="form-group"><label>Límite de crédito</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
          <button class="btn sm" onclick="setLimite(5000)">$5.000</button>
          <button class="btn sm" onclick="setLimite(10000)">$10.000</button>
          <button class="btn sm" onclick="setLimite(20000)">$20.000</button>
          <button class="btn sm" onclick="setLimite(50000)">$50.000</button>
        </div>
        <input type="number" id="ncLimite" value="10000" style="width:100%">
      </div>
      <div class="form-group"><label>Frecuencia de pago</label>
        <select id="ncFrecuencia" style="width:100%">
          <option value="semanal">Semanal</option>
          <option value="quincenal">Quincenal</option>
          <option value="mensual" selected>Mensual</option>
        </select>
      </div>
      <div class="form-group"><label>Notas (opcional)</label><input id="ncNotas" style="width:100%"></div>
      <div class="modal-btns">
        <button class="btn" onclick="document.getElementById('modalNuevoCliente').classList.remove('active')">Cancelar</button>
        <button class="btn primary" onclick="crearCliente()">✅ Crear e imprimir</button>
      </div>
    </div>
  </div>

  <!-- FAB nuevo cliente -->
  <button class="fab" onclick="document.getElementById('modalNuevoCliente').classList.add('active')" title="Nuevo cliente">+</button>

  <div id="toast" class="toast"></div>

  <script src="/static/js/zero-utils.js"></script>
  <script src="/static/js/zero-temas.js"></script>
<script src="/static/js/credit.js"></script>
</body>
</html>
