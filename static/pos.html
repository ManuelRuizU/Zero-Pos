<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZERO POS — Caja</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: rgba(255,255,255,0.05);
  --surface2: rgba(255,255,255,0.08);
  --surface-hover: rgba(255,255,255,0.1);
  --border: rgba(255,255,255,0.1);
  --accent: #6366f1;
  --accent2: #818cf8;
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
  --radius: 14px;
  --blur: blur(20px);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(99,102,241,0.12) 0%,transparent 70%);
}

/* ── Topbar ───────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;
  background:rgba(10,10,15,0.8);
  backdrop-filter:var(--blur);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  z-index:10;
}
.topbar .logo{font-weight:700;font-size:16px;letter-spacing:-0.3px;}
.topbar .logo span{color:var(--accent);}
.topbar .cajero{font-size:13px;color:var(--text-dim);}
.topbar .actions{display:flex;gap:8px;margin-left:auto;}
.btn-top{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:6px 14px;
  font-size:13px;cursor:pointer;transition:all .15s;
}
.btn-top:hover{background:var(--surface-hover);}
.badge-alert{
  background:var(--danger);color:#fff;
  border-radius:99px;padding:2px 6px;font-size:11px;
  margin-left:4px;
}

/* ── Layout principal ─────────────────────────────── */
.layout{display:flex;flex:1;overflow:hidden;}

/* ── Panel productos (izquierda) ─────────────────── */
.productos-panel{
  flex:1;display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  overflow:hidden;
}
.search-bar{
  padding:10px 14px;display:flex;gap:8px;
  background:rgba(10,10,15,0.6);
  border-bottom:1px solid var(--border);
}
.search-input{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:8px 14px;color:var(--text);
  font-size:14px;outline:none;transition:border-color .2s;
}
.search-input:focus{border-color:var(--accent);}
.btn-scan{
  background:var(--accent);border:none;color:#fff;
  border-radius:10px;padding:8px 14px;cursor:pointer;
  font-size:18px;transition:filter .15s;
}
.btn-scan:hover{filter:brightness(1.15);}

.categorias{
  display:flex;gap:8px;padding:10px 14px;
  overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;
}
.categorias::-webkit-scrollbar{display:none;}
.cat-btn{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-dim);border-radius:99px;
  padding:5px 14px;font-size:13px;cursor:pointer;
  white-space:nowrap;transition:all .15s;flex-shrink:0;
}
.cat-btn.active{
  background:var(--accent);border-color:var(--accent);
  color:#fff;
}

.productos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;padding:12px 14px;
  overflow-y:auto;flex:1;
  align-content:start;
}
.prod-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 12px;
  cursor:pointer;transition:all .18s;
  display:flex;flex-direction:column;gap:6px;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.prod-card:hover{background:var(--surface-hover);transform:translateY(-2px);border-color:rgba(99,102,241,0.4);}
.prod-card:active{transform:scale(0.97);}
.prod-card.sin-stock{opacity:0.45;cursor:not-allowed;}
.prod-nombre{font-size:13px;font-weight:600;line-height:1.3;}
.prod-precio{font-size:18px;font-weight:700;color:var(--accent2);}
.prod-stock{font-size:11px;color:var(--text-dim);}
.prod-stock.bajo{color:var(--warning);}

/* ── Panel carrito (derecha) ─────────────────────── */
.carrito-panel{
  width:340px;flex-shrink:0;
  display:flex;flex-direction:column;
  background:rgba(10,10,15,0.4);
}
.carrito-header{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.carrito-title{font-weight:700;font-size:15px;}
.btn-clear{
  background:none;border:1px solid var(--border);
  color:var(--text-dim);border-radius:8px;
  padding:4px 10px;font-size:12px;cursor:pointer;
  transition:all .15s;
}
.btn-clear:hover{background:var(--danger);border-color:var(--danger);color:#fff;}

.carrito-items{
  flex:1;overflow-y:auto;padding:10px;
  display:flex;flex-direction:column;gap:6px;
}
.carrito-empty{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;color:var(--text-dim);
  font-size:13px;gap:8px;
}
.carrito-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;
  display:flex;align-items:center;gap:10px;
}
.item-nombre{flex:1;font-size:13px;font-weight:500;}
.item-controles{display:flex;align-items:center;gap:6px;}
.qty-btn{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-radius:6px;
  width:26px;height:26px;cursor:pointer;
  font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.qty-btn:hover{background:var(--accent);}
.qty-num{font-size:14px;font-weight:700;min-width:20px;text-align:center;}
.item-subtotal{font-size:13px;font-weight:600;color:var(--accent2);min-width:60px;text-align:right;}
.item-del{
  background:none;border:none;color:var(--text-dim);
  cursor:pointer;font-size:16px;padding:2px;
  transition:color .15s;
}
.item-del:hover{color:var(--danger);}

.carrito-footer{
  padding:14px 16px;
  border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:10px;
}
.totales{display:flex;flex-direction:column;gap:4px;}
.total-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);}
.total-row.main{font-size:20px;font-weight:700;color:var(--text);margin-top:4px;}
.descuento-row{display:flex;gap:8px;align-items:center;}
.descuento-input{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;color:var(--text);font-size:13px;outline:none;
}
.descuento-input:focus{border-color:var(--accent);}
.btn-cobrar{
  background:var(--accent);border:none;color:#fff;
  border-radius:12px;padding:16px;font-size:16px;font-weight:700;
  cursor:pointer;transition:all .2s;width:100%;
  box-shadow:0 4px 20px rgba(99,102,241,0.4);
}
.btn-cobrar:hover{filter:brightness(1.12);transform:translateY(-1px);}
.btn-cobrar:active{transform:scale(0.98);}
.btn-cobrar:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

/* ── Modal cobro ─────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  backdrop-filter:blur(6px);z-index:100;
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.active{display:flex;}
.modal{
  background:#13131a;border:1px solid var(--border);
  border-radius:20px;padding:28px;width:100%;max-width:440px;
  box-shadow:0 32px 64px rgba(0,0,0,0.6);
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-title{font-size:20px;font-weight:700;margin-bottom:20px;}
.modal-total{
  font-size:36px;font-weight:800;text-align:center;
  color:var(--accent2);margin:12px 0 24px;
  letter-spacing:-1px;
}
.metodos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.metodo-btn{
  background:var(--surface);border:2px solid var(--border);
  border-radius:12px;padding:14px 10px;
  color:var(--text);cursor:pointer;transition:all .15s;
  text-align:center;font-size:13px;font-weight:600;
}
.metodo-btn:hover{background:var(--surface-hover);}
.metodo-btn.selected{
  background:rgba(99,102,241,0.2);
  border-color:var(--accent);
  color:var(--accent2);
}
.metodo-icon{font-size:22px;margin-bottom:6px;}
.efectivo-section{margin-bottom:16px;}
.label{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
.monto-input{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;color:var(--text);
  font-size:18px;font-weight:700;outline:none;transition:border-color .2s;
}
.monto-input:focus{border-color:var(--accent);}
.vuelto-row{
  display:flex;justify-content:space-between;
  background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);
  border-radius:10px;padding:10px 14px;margin-top:8px;
}
.vuelto-label{color:var(--success);font-weight:600;}
.vuelto-monto{color:var(--success);font-weight:800;font-size:18px;}
.modal-acciones{display:flex;gap:10px;}
.btn-cancelar{
  flex:1;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:12px;padding:14px;
  cursor:pointer;font-size:14px;transition:all .15s;
}
.btn-cancelar:hover{background:var(--surface-hover);}
.btn-confirmar{
  flex:2;background:var(--success);border:none;
  color:#fff;border-radius:12px;padding:14px;
  cursor:pointer;font-size:15px;font-weight:700;
  transition:all .2s;
  box-shadow:0 4px 16px rgba(34,197,94,0.3);
}
.btn-confirmar:hover{filter:brightness(1.1);}

/* QR pago */
.qr-container{text-align:center;padding:10px 0;}
.qr-container img{border-radius:12px;max-width:180px;}

/* ── Toast ────────────────────────────────────────── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#1e1e2e;border:1px solid var(--border);
  border-radius:12px;padding:12px 20px;font-size:14px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
  z-index:200;opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.toast.show{opacity:1;}
.toast.success{border-color:var(--success);color:var(--success);}
.toast.error{border-color:var(--danger);color:var(--danger);}

/* ── Modal variantes ─────────────────────────────────── */
.modal-variantes{
  background:#13131a;border:1px solid var(--border);
  border-radius:20px;padding:24px;width:100%;max-width:380px;
  animation:slideUp .2s ease;
}
.variantes-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin:16px 0;
}
.variante-btn{
  background:var(--surface);border:2px solid var(--border);
  border-radius:12px;padding:14px 10px;
  cursor:pointer;transition:all .15s;text-align:center;
  color:var(--text);
}
.variante-btn:hover{background:var(--surface-hover);border-color:rgba(99,102,241,0.4);}
.variante-nombre{font-size:13px;font-weight:600;margin-bottom:4px;}
.variante-precio{font-size:16px;font-weight:700;color:var(--accent2);}
.variante-stock{font-size:11px;color:var(--text-dim);margin-top:2px;}

/* ── Modal venta rápida ───────────────────────────────── */
.modal-rapida{
  background:#13131a;border:1px solid var(--border);
  border-radius:20px;padding:24px;width:100%;max-width:420px;
  animation:slideUp .2s ease;
}
.campo-group{margin-bottom:16px;}
.campo-group label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:6px;}
.campo-group input,.campo-group select{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;
}
.campo-group input:focus,.campo-group select:focus{border-color:var(--accent);}
.campo-group select option{background:#1e1e2e;}
.rapida-items{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:180px;overflow-y:auto;}
.rapida-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
}
.rapida-item-nombre{flex:1;font-size:13px;}
.rapida-item-precio{font-size:13px;font-weight:700;color:var(--accent2);}
.rapida-item-del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;}
.rapida-item-del:hover{color:var(--danger);}

/* Lookup barras */
.lookup-result{
  background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);
  border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px;
  display:none;
}
.lookup-nombre{font-weight:600;margin-bottom:2px;}
.lookup-fuente{color:var(--text-dim);font-size:11px;}

/* ── Responsive ───────────────────────────────────── */
@media(max-width:768px){
  .carrito-panel{
    position:fixed;bottom:0;left:0;right:0;
    width:100%;height:55vh;z-index:50;
    border-radius:20px 20px 0 0;
    border-top:1px solid var(--border);
    background:#13131a;
    transform:translateY(calc(100% - 60px));
    transition:transform .3s ease;
  }
  .carrito-panel.open{transform:translateY(0);}
  .carrito-header{cursor:pointer;}
  .carrito-header::before{
    content:'';display:block;width:40px;height:4px;
    background:var(--border);border-radius:2px;
    margin:0 auto 12px;
  }
  .productos-panel{flex:none;height:calc(100vh - 52px - 60px);}
  .layout{flex-direction:column;}
  .productos-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="logo">ZERO<span>POS</span></div>
  <div class="cajero" id="cajeroNombre">Cargando...</div>
  <div class="actions">
    <button class="btn-top" onclick="abrirVentaRapida()" title="Venta rápida sin catálogo">⚡ Rápida</button>
    <button class="btn-top" onclick="verAlertas()" id="btnAlertas">⚠️ Stock</button>
    <button class="btn-top" onclick="location.href='admin.html'">📊</button>
    <button class="btn-top" onclick="cerrarSesion()">Salir</button>
  </div>
</div>

<div class="layout">

  <!-- Panel productos -->
  <div class="productos-panel">
    <div class="search-bar">
      <input class="search-input" type="text" id="searchInput"
        placeholder="Buscar producto o código..." autocomplete="off"
        oninput="filtrar()">
      <button class="btn-scan" onclick="abrirScanner()" title="Escanear código">📷</button>
    </div>
    <div class="categorias" id="categorias">
      <button class="cat-btn active" data-id="" onclick="selCat(this,'')">Todos</button>
    </div>
    <div class="productos-grid" id="productosGrid"></div>
  </div>

  <!-- Panel carrito -->
  <div class="carrito-panel" id="carrito">
    <div class="carrito-header" onclick="toggleCarritoMobile()">
      <span class="carrito-title">🛒 Carrito (<span id="itemCount">0</span>)</span>
      <button class="btn-clear" onclick="event.stopPropagation();limpiarCarrito()">Limpiar</button>
    </div>
    <div class="carrito-items" id="carritoItems">
      <div class="carrito-empty">
        <span style="font-size:32px">🛒</span>
        <span>Agrega productos tocando la grilla</span>
      </div>
    </div>
    <div class="carrito-footer">
      <div class="totales">
        <div class="total-row"><span>Subtotal</span><span id="subtotalDisp">$0</span></div>
        <div class="total-row">
          <span>Descuento</span>
          <input class="descuento-input" type="number" id="descuentoInput"
            min="0" placeholder="0" oninput="recalcular()" style="width:90px;text-align:right;">
        </div>
        <div class="total-row main">
          <span>TOTAL</span><span id="totalDisp">$0</span>
        </div>
      </div>
      <button class="btn-cobrar" id="btnCobrar" onclick="abrirCobro()" disabled>
        Cobrar →
      </button>
    </div>
  </div>
</div>

<!-- Modal cobro -->
<div class="modal-overlay" id="modalCobro">
  <div class="modal">
    <div class="modal-title">💳 Cobrar venta</div>
    <div class="modal-total" id="modalTotal">$0</div>
    <div class="metodos">
      <div class="metodo-btn selected" data-met="efectivo" onclick="selMetodo(this)">
        <div class="metodo-icon">💵</div>Efectivo
      </div>
      <div class="metodo-btn" data-met="transferencia" onclick="selMetodo(this)">
        <div class="metodo-icon">📲</div>Transferencia
      </div>
      <div class="metodo-btn" data-met="tarjeta" onclick="selMetodo(this)">
        <div class="metodo-icon">💳</div>Tarjeta
      </div>
      <div class="metodo-btn" data-met="khipu" onclick="selMetodo(this)">
        <div class="metodo-icon">🏦</div>Khipu
      </div>
    </div>
    <div class="efectivo-section" id="secEfectivo">
      <div class="label">Monto recibido</div>
      <input class="monto-input" type="number" id="montoRecibido"
        placeholder="0" oninput="calcularVuelto()">
      <div class="vuelto-row" id="vueltoRow" style="display:none">
        <span class="vuelto-label">Vuelto</span>
        <span class="vuelto-monto" id="vueltoMonto">$0</span>
      </div>
    </div>
    <div id="secTransferencia" style="display:none">
      <div class="qr-container">
        <img id="qrTransferencia" src="" alt="QR Pago" style="display:none">
        <p style="color:var(--text-dim);font-size:13px;" id="qrMsg">Cargando QR...</p>
      </div>
    </div>
    <div id="secKhipu" style="display:none">
      <p style="color:var(--text-dim);font-size:13px;text-align:center;">
        Se generará un link de pago Khipu para el cliente.
      </p>
    </div>
    <div class="modal-acciones">
      <button class="btn-cancelar" onclick="cerrarCobro()">Cancelar</button>
      <button class="btn-confirmar" id="btnConfirmar" onclick="confirmarPago()">
        ✓ Confirmar pago
      </button>
    </div>
  </div>
</div>

<!-- Modal variantes -->
<div class="modal-overlay" id="modalVariantes">
  <div class="modal-variantes">
    <div class="modal-title" id="variantesTitulo" style="font-size:17px;font-weight:700;margin-bottom:4px;"></div>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">Elige una presentación</div>
    <div class="variantes-grid" id="variantesGrid"></div>
    <button class="btn-cancelar" style="width:100%;margin-top:4px;" onclick="cerrarVariantes()">Cancelar</button>
  </div>
</div>

<!-- Modal venta rápida -->
<div class="modal-overlay" id="modalRapida">
  <div class="modal-rapida">
    <div class="modal-title" style="font-size:18px;font-weight:700;margin-bottom:20px;">⚡ Venta rápida</div>

    <!-- Buscar por código de barras -->
    <div class="campo-group">
      <label>Buscar por código de barras (opcional)</label>
      <div style="display:flex;gap:8px;">
        <input id="rapidaBarras" type="text" placeholder="Escanear o escribir código..."
          oninput="lookupRapida(this.value)">
      </div>
    </div>
    <div class="lookup-result" id="lookupResult">
      <div class="lookup-nombre" id="lookupNombre"></div>
      <div class="lookup-fuente" id="lookupFuente"></div>
    </div>

    <div class="campo-group">
      <label>Descripción del producto *</label>
      <input id="rapidaNombre" type="text" placeholder="Ej: Café con leche">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="campo-group">
        <label>Precio (CLP) *</label>
        <input id="rapidaPrecio" type="number" placeholder="0" min="0">
      </div>
      <div class="campo-group">
        <label>Cantidad</label>
        <input id="rapidaCantidad" type="number" placeholder="1" min="1" value="1">
      </div>
    </div>
    <button class="btn-primary" style="width:100%;margin-bottom:16px;padding:10px;"
      onclick="agregarItemRapido()">+ Agregar item</button>

    <div class="rapida-items" id="rapidaItems"></div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
      <input type="checkbox" id="rapidaGuardar" style="width:16px;height:16px;">
      <label for="rapidaGuardar" style="font-size:13px;color:var(--text-dim);cursor:pointer;">
        Guardar como productos en el catálogo
      </label>
    </div>

    <div class="modal-acciones">
      <button class="btn-cancelar" onclick="cerrarVentaRapida()">Cancelar</button>
      <button class="btn-confirmar" onclick="confirmarVentaRapida()">⚡ Agregar al carrito</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const fmt = n => '$' + Math.round(n).toLocaleString('es-CL');

let productos = [];
let carrito = [];
let categoriaActual = '';
let metodoPago = 'efectivo';
let total = 0;

// ── Init ─────────────────────────────────────────────────────────────
async function init() {
  const me = await fetch('/api/auth/me', {credentials:'include'}).then(r => r.json()).catch(() => null);
  if (!me || me.error) { location.href = 'login.html'; return; }
  document.getElementById('cajeroNombre').textContent = `👤 ${me.nombre}`;

  // Redirigir a onboarding si nunca se configuró
  const estado = await fetch('/api/onboarding/estado', {credentials:'include'})
    .then(r => r.json()).catch(() => ({completado: true}));
  if (!estado.completado && !estado.hay_productos) {
    location.href = 'onboarding.html';
    return;
  }

  await cargarCategorias();
  await cargarProductos();
  verificarAlertas();
  verificarTurno(me);
}

async function verificarTurno(me) {
  const t = await fetch('/api/auth/turno/actual', {credentials:'include'}).then(r => r.json());
  if (!t.turno) {
    const fondo = prompt('Abre tu turno — ingresa el fondo inicial de caja (ej: 50000):','0');
    if (fondo !== null) {
      await fetch('/api/auth/turno/abrir', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({fondo_inicial: parseFloat(fondo)||0})
      });
    }
  }
}

async function cargarCategorias() {
  const data = await fetch('/api/productos/categorias', {credentials:'include'}).then(r => r.json()).catch(() => []);
  const div = document.getElementById('categorias');
  data.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.dataset.id = c.id;
    btn.textContent = (c.icono || '') + ' ' + c.nombre;
    btn.onclick = () => selCat(btn, c.id);
    div.appendChild(btn);
  });
}

async function cargarProductos() {
  const q = document.getElementById('searchInput').value;
  const url = `/api/productos?activos=1${categoriaActual ? '&categoria_id='+categoriaActual : ''}${q ? '&q='+encodeURIComponent(q) : ''}`;
  productos = await fetch(url, {credentials:'include'}).then(r => r.json()).catch(() => []);
  renderProductos(productos);
}

function renderProductos(lista) {
  const grid = document.getElementById('productosGrid');
  grid.innerHTML = '';
  if (!lista.length) {
    grid.innerHTML = '<p style="color:var(--text-dim);font-size:13px;grid-column:1/-1;padding:20px;text-align:center">Sin productos</p>';
    return;
  }
  lista.forEach(p => {
    const sinStock = !p.tiene_variantes && p.stock <= 0;
    const div = document.createElement('div');
    div.className = 'prod-card' + (sinStock ? ' sin-stock' : '');
    div.innerHTML = `
      <div class="prod-nombre">${p.nombre}</div>
      <div class="prod-precio">${fmt(p.precio)}</div>
      <div class="prod-stock ${p.stock <= p.stock_minimo && !p.tiene_variantes ? 'bajo' : ''}">
        ${p.tiene_variantes
          ? '<span style="color:var(--accent2);font-size:11px;">▼ ver variantes</span>'
          : `Stock: ${p.stock}${p.stock <= p.stock_minimo ? ' ⚠️' : ''}`}
      </div>`;
    if (!sinStock) {
      div.onclick = () => p.tiene_variantes ? abrirVariantes(p) : agregarAlCarrito(p);
    }
    grid.appendChild(div);
  });
}

function selCat(btn, id) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  categoriaActual = id;
  cargarProductos();
}

function filtrar() {
  clearTimeout(filtrar._t);
  filtrar._t = setTimeout(cargarProductos, 250);
}

// ── Carrito ──────────────────────────────────────────────────────────
function agregarAlCarrito(prod) {
  const idx = carrito.findIndex(i => i.producto_id === prod.id);
  if (idx >= 0) {
    if (carrito[idx].cantidad >= prod.stock) { showToast('Stock máximo alcanzado', 'error'); return; }
    carrito[idx].cantidad++;
  } else {
    carrito.push({
      producto_id: prod.id,
      nombre: prod.nombre,
      precio_unit: prod.precio,
      cantidad: 1,
      stock: prod.stock,
    });
  }
  renderCarrito();
}

function cambiarCantidad(idx, delta) {
  carrito[idx].cantidad += delta;
  if (carrito[idx].cantidad <= 0) carrito.splice(idx, 1);
  renderCarrito();
}

function eliminarItem(idx) {
  carrito.splice(idx, 1);
  renderCarrito();
}

function limpiarCarrito() {
  carrito = [];
  renderCarrito();
}

function renderCarrito() {
  const el = document.getElementById('carritoItems');
  document.getElementById('itemCount').textContent = carrito.reduce((s,i) => s+i.cantidad, 0);

  if (!carrito.length) {
    el.innerHTML = '<div class="carrito-empty"><span style="font-size:32px">🛒</span><span>Agrega productos tocando la grilla</span></div>';
    document.getElementById('btnCobrar').disabled = true;
    recalcular();
    return;
  }

  el.innerHTML = '';
  carrito.forEach((item, idx) => {
    const sub = item.precio_unit * item.cantidad;
    const div = document.createElement('div');
    div.className = 'carrito-item';
    div.innerHTML = `
      <div class="item-nombre">${item.nombre}</div>
      <div class="item-controles">
        <button class="qty-btn" onclick="cambiarCantidad(${idx},-1)">−</button>
        <span class="qty-num">${item.cantidad}</span>
        <button class="qty-btn" onclick="cambiarCantidad(${idx},+1)">+</button>
      </div>
      <div class="item-subtotal">${fmt(sub)}</div>
      <button class="item-del" onclick="eliminarItem(${idx})">✕</button>`;
    el.appendChild(div);
  });

  document.getElementById('btnCobrar').disabled = false;
  recalcular();
}

function recalcular() {
  const subtotal = carrito.reduce((s,i) => s + i.precio_unit * i.cantidad, 0);
  const desc = parseFloat(document.getElementById('descuentoInput').value) || 0;
  total = Math.max(0, subtotal - desc);
  document.getElementById('subtotalDisp').textContent = fmt(subtotal);
  document.getElementById('totalDisp').textContent = fmt(total);
}

// ── Cobro ────────────────────────────────────────────────────────────
function abrirCobro() {
  if (!carrito.length) return;
  recalcular();
  document.getElementById('modalTotal').textContent = fmt(total);
  document.getElementById('montoRecibido').value = '';
  document.getElementById('vueltoRow').style.display = 'none';
  document.getElementById('modalCobro').classList.add('active');
  selMetodo(document.querySelector('[data-met="efectivo"]'));
}

function cerrarCobro() {
  document.getElementById('modalCobro').classList.remove('active');
}

function selMetodo(btn) {
  document.querySelectorAll('.metodo-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  metodoPago = btn.dataset.met;
  document.getElementById('secEfectivo').style.display = metodoPago === 'efectivo' ? 'block' : 'none';
  document.getElementById('secTransferencia').style.display = metodoPago === 'transferencia' ? 'block' : 'none';
  document.getElementById('secKhipu').style.display = metodoPago === 'khipu' ? 'block' : 'none';
  if (metodoPago === 'transferencia') cargarQrPago();
}

async function cargarQrPago() {
  const img = document.getElementById('qrTransferencia');
  const msg = document.getElementById('qrMsg');
  img.style.display = 'none';
  msg.textContent = 'Generando QR...';
  try {
    const r = await fetch('/api/qr/pago', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({monto:total, concepto:'Pago en tienda'})
    }).then(r => r.json());
    if (r.qr_base64) {
      img.src = 'data:image/png;base64,' + r.qr_base64;
      img.style.display = 'block';
      msg.textContent = '';
    } else {
      msg.textContent = r.texto || 'QR no disponible';
    }
  } catch(e) {
    msg.textContent = 'Error al generar QR';
  }
}

function calcularVuelto() {
  const recibido = parseFloat(document.getElementById('montoRecibido').value) || 0;
  const vuelto = recibido - total;
  const row = document.getElementById('vueltoRow');
  if (recibido > 0) {
    row.style.display = 'flex';
    document.getElementById('vueltoMonto').textContent = fmt(Math.max(0, vuelto));
    row.style.borderColor = vuelto < 0 ? 'rgba(239,68,68,0.3)' : 'rgba(34,197,94,0.2)';
  } else {
    row.style.display = 'none';
  }
}

async function confirmarPago() {
  if (metodoPago === 'efectivo') {
    const recibido = parseFloat(document.getElementById('montoRecibido').value) || 0;
    if (recibido < total) { showToast('Monto insuficiente', 'error'); return; }
  }
  if (metodoPago === 'khipu') {
    await crearPagoKhipu();
    return;
  }

  const btn = document.getElementById('btnConfirmar');
  btn.disabled = true;
  btn.textContent = 'Procesando...';

  const desc = parseFloat(document.getElementById('descuentoInput').value) || 0;

  // Separar items normales de rápidos
  const itemsNormales = carrito.filter(i => !i._rapida && i.producto_id);
  const itemsRapidosCarrito = carrito.filter(i => i._rapida);

  try {
    let ventaId = null;

    // Procesar items normales
    if (itemsNormales.length) {
      const payload = {
        items: itemsNormales.map(i => ({
          producto_id: i.producto_id,
          variante_id: i.variante_id || null,
          nombre_variante: i.nombre_variante || "",
          cantidad: i.cantidad,
        })),
        metodo_pago: metodoPago,
        descuento: itemsRapidosCarrito.length ? 0 : desc,
      };
      const r = await fetch('/api/ventas', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload),
      });
      const data = await r.json();
      if (!r.ok) { showToast(data.error || 'Error al registrar venta', 'error'); return; }
      ventaId = data.venta_id;
    }

    // Procesar items rápidos
    if (itemsRapidosCarrito.length) {
      const guardar = itemsRapidosCarrito.some(i => i._guardar);
      const payloadR = {
        items: itemsRapidosCarrito.map(i => ({
          nombre: i.nombre,
          precio_unit: i.precio_unit,
          cantidad: i.cantidad,
        })),
        metodo_pago: metodoPago,
        descuento: desc,
        guardar_productos: guardar,
      };
      const r2 = await fetch('/api/ventas/rapida', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payloadR),
      });
      const data2 = await r2.json();
      if (!r2.ok) { showToast(data2.error || 'Error en venta rápida', 'error'); return; }
      ventaId = ventaId || data2.venta_id;
    }

    cerrarCobro();
    limpiarCarrito();
    document.getElementById('descuentoInput').value = '';
    showToast(`✓ Venta #${ventaId} — ${fmt(total)}`, 'success');
    setTimeout(() => cargarProductos(), 500);
  } catch(e) {
    showToast('Error de conexión', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '✓ Confirmar pago';
  }
}

async function crearPagoKhipu() {
  const btn = document.getElementById('btnConfirmar');
  btn.disabled = true;
  btn.textContent = 'Creando link...';
  try {
    const r = await fetch('/api/khipu/crear_pago', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({monto:total, concepto:'Compra en tienda'}),
    }).then(r => r.json());
    if (r.payment_url) {
      window.open(r.payment_url, '_blank');
      showToast('Link Khipu abierto', 'success');
    } else {
      showToast(r.error || 'Error Khipu', 'error');
    }
  } catch(e) {
    showToast('Error de conexión', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '✓ Confirmar pago';
  }
}

// ── Variantes ────────────────────────────────────────────────────────
let productoActual = null;

async function abrirVariantes(prod) {
  productoActual = prod;
  document.getElementById('variantesTitulo').textContent = prod.nombre;
  document.getElementById('variantesGrid').innerHTML = '<div style="color:var(--text-dim);font-size:13px;">Cargando...</div>';
  document.getElementById('modalVariantes').classList.add('active');

  const variantes = await fetch(`/api/productos/${prod.id}/variantes`, {credentials:'include'})
    .then(r => r.json()).catch(() => []);

  const grid = document.getElementById('variantesGrid');
  if (!variantes.length) {
    grid.innerHTML = '<div style="color:var(--text-dim);font-size:13px;">Sin variantes disponibles</div>';
    return;
  }
  grid.innerHTML = '';
  variantes.forEach(v => {
    const btn = document.createElement('div');
    btn.className = 'variante-btn' + (v.stock <= 0 ? ' sin-stock' : '');
    btn.innerHTML = `
      <div class="variante-nombre">${v.nombre}</div>
      <div class="variante-precio">${fmt(v.precio)}</div>
      <div class="variante-stock">Stock: ${v.stock}</div>`;
    if (v.stock > 0) {
      btn.onclick = () => {
        agregarAlCarritoConVariante(prod, v);
        cerrarVariantes();
      };
    }
    grid.appendChild(btn);
  });
}

function cerrarVariantes() {
  document.getElementById('modalVariantes').classList.remove('active');
  productoActual = null;
}

function agregarAlCarritoConVariante(prod, variante) {
  const key = `${prod.id}_v${variante.id}`;
  const idx = carrito.findIndex(i => i._key === key);
  if (idx >= 0) {
    if (carrito[idx].cantidad >= variante.stock) { showToast('Stock máximo alcanzado', 'error'); return; }
    carrito[idx].cantidad++;
  } else {
    carrito.push({
      _key: key,
      producto_id: prod.id,
      variante_id: variante.id,
      nombre: `${prod.nombre} — ${variante.nombre}`,
      nombre_variante: variante.nombre,
      precio_unit: variante.precio,
      cantidad: 1,
      stock: variante.stock,
    });
  }
  renderCarrito();
  showToast(`${prod.nombre} (${variante.nombre}) agregado`, 'success');
}

// ── Venta rápida ──────────────────────────────────────────────────────
let itemsRapidos = [];
let lookupTimer = null;

function abrirVentaRapida() {
  itemsRapidos = [];
  document.getElementById('rapidaNombre').value = '';
  document.getElementById('rapidaPrecio').value = '';
  document.getElementById('rapidaCantidad').value = '1';
  document.getElementById('rapidaBarras').value = '';
  document.getElementById('lookupResult').style.display = 'none';
  document.getElementById('rapidaItems').innerHTML = '';
  document.getElementById('modalRapida').classList.add('active');
}

function cerrarVentaRapida() {
  document.getElementById('modalRapida').classList.remove('active');
}

function lookupRapida(codigo) {
  clearTimeout(lookupTimer);
  if (codigo.length < 6) { document.getElementById('lookupResult').style.display = 'none'; return; }
  lookupTimer = setTimeout(async () => {
    const r = await fetch(`/api/productos/barras/${encodeURIComponent(codigo)}/lookup`,
      {credentials:'include'}).then(r => r.json()).catch(() => null);
    const box = document.getElementById('lookupResult');
    if (r && r.encontrado) {
      document.getElementById('lookupNombre').textContent = r.nombre || r.producto_nombre || '';
      const fuentes = {local:'✓ En tu catálogo', catalogo_base:'📋 Catálogo base', open_food_facts:'🌐 Open Food Facts'};
      document.getElementById('lookupFuente').textContent = fuentes[r.fuente] || r.fuente;
      box.style.display = 'block';
      if (!document.getElementById('rapidaNombre').value) {
        document.getElementById('rapidaNombre').value = r.nombre || r.producto_nombre || '';
      }
      if (!document.getElementById('rapidaPrecio').value && r.precio_sugerido) {
        document.getElementById('rapidaPrecio').value = r.precio_sugerido;
      }
    } else {
      box.style.display = 'none';
    }
  }, 500);
}

function agregarItemRapido() {
  const nombre = document.getElementById('rapidaNombre').value.trim();
  const precio = parseFloat(document.getElementById('rapidaPrecio').value) || 0;
  const cantidad = parseInt(document.getElementById('rapidaCantidad').value) || 1;
  if (!nombre) { showToast('Ingresa una descripción', 'error'); return; }
  if (precio <= 0) { showToast('Ingresa un precio', 'error'); return; }

  itemsRapidos.push({nombre, precio_unit: precio, cantidad});
  document.getElementById('rapidaNombre').value = '';
  document.getElementById('rapidaPrecio').value = '';
  document.getElementById('rapidaCantidad').value = '1';
  document.getElementById('rapidaBarras').value = '';
  document.getElementById('lookupResult').style.display = 'none';
  renderItemsRapidos();
}

function renderItemsRapidos() {
  const el = document.getElementById('rapidaItems');
  el.innerHTML = '';
  itemsRapidos.forEach((it, idx) => {
    const div = document.createElement('div');
    div.className = 'rapida-item';
    div.innerHTML = `
      <div class="rapida-item-nombre">${it.nombre} x${it.cantidad}</div>
      <div class="rapida-item-precio">${fmt(it.precio_unit * it.cantidad)}</div>
      <button class="rapida-item-del" onclick="eliminarItemRapido(${idx})">✕</button>`;
    el.appendChild(div);
  });
}

function eliminarItemRapido(idx) {
  itemsRapidos.splice(idx, 1);
  renderItemsRapidos();
}

function confirmarVentaRapida() {
  if (!itemsRapidos.length) { showToast('Agrega al menos un item', 'error'); return; }
  // Agregar items al carrito normal para cobrarlos junto
  itemsRapidos.forEach(it => {
    carrito.push({
      _key: `rapida_${Date.now()}_${Math.random()}`,
      producto_id: null,       // se resolverá en venta rápida
      variante_id: null,
      nombre: it.nombre,
      nombre_variante: '',
      precio_unit: it.precio_unit,
      cantidad: it.cantidad,
      stock: 9999,
      _rapida: true,
      _guardar: document.getElementById('rapidaGuardar').checked,
    });
  });
  cerrarVentaRapida();
  renderCarrito();
}

// ── Extras ───────────────────────────────────────────────────────────
async function verificarAlertas() {
  const data = await fetch('/api/productos/alertas', {credentials:'include'}).then(r => r.json()).catch(() => []);
  if (data.length > 0) {
    document.getElementById('btnAlertas').innerHTML = `⚠️ Stock <span class="badge-alert">${data.length}</span>`;
  }
}

function verAlertas() { location.href = 'inventario.html'; }

function abrirScanner() { location.href = 'scanner.html'; }

function toggleCarritoMobile() {
  document.getElementById('carrito').classList.toggle('open');
}

async function cerrarSesion() {
  await fetch('/api/auth/logout', {method:'POST', credentials:'include'});
  location.href = 'login.html';
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 3000);
}

// Cierre con Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    cerrarCobro();
    cerrarVariantes();
    cerrarVentaRapida();
  }
});

init();
</script>
